 ENG_derby_retirement_tt:0 "§YLord Derby§! will retire within two years, leaving the premiership to §YBenjamin Disraeli§!."
 ENG_general_election_tt:0 "A §Ygeneral election§! will be held. The result depends on the §Ypopularity§! of the §YLiberal§! and §YConservative§! parties; a close result may produce a §Rhung Parliament§!."
 ENG_mission_ireland_tt:0 "Gladstone's government makes Ireland its first priority."
 ENG_labour_grievance_tt:0 "§RLabour grievances will grow.§! If organised labour is repeatedly suppressed, something new may stir in the workshops."
 ENG_unlock_strike_decisions_tt:0 "Unlocks the §YOrganise Strikes§! decisions."
 ENG_unlock_parliament_decisions_tt:0 "Unlocks the §YDisrupt Parliament§! decisions."
 ENG_workshop_variable_tt:0 "Improves the §YWorkshop of the World§! modifier."
 ENG_war_office_act_tt:0 "The Commander-in-Chief is subordinated to the Secretary of State for War. The §YDuke of Cambridge§! can no longer serve as Chief of Army."
 ENG_balloon_decision_tt:0 "Unlocks the decision §YBalloon Trials at Woolwich§!."
 ENG_hms_captain_tt:0 "§YHMS Captain§! will be completed. Her sea trials will decide her fate."
 ENG_prince_of_wales_tt:0 "The Prince of Wales will take on public duties, and something may happen to him."
 ENG_dilke_warning_tt:0 "§RRepublican sentiment may come to a head.§!"
 ENG_1868_liberal_tt:0 "The §YLiberal party§! will form the next government under §YW. E. Gladstone§!."
 ENG_1868_conservative_tt:0 "The §YConservative party§! will remain in office under §YBenjamin Disraeli§!."
 ENG_constitutional_crisis_tt:0 "§RNo party commands a stable majority. The Crown may be drawn into politics.§!"
 ENG_abyssinia_decision_tt:0 "Unlocks the decision §YThe Abyssinian Expedition§!."
 ENG_captain_lost_tt:0 "§RHMS Captain capsizes in a squall off Cape Finisterre with almost all hands, Cowper Coles among them.§!"
 ENG_captain_survives_tt:0 "§GHMS Captain survives her trials and joins the Channel Squadron.§!"
 ENG_secret_path_unlocked_tt:0 "§GA hidden branch of the national focus tree has been revealed.§!"

 ENG_parliamentary_affairs:0 "Parliamentary Affairs"
 ENG_parliamentary_affairs_desc:0 "Managing the House of Commons, the parties and the business of government."
 ENG_imperial_affairs:0 "Imperial Affairs"
 ENG_imperial_affairs_desc:0 "Expeditions, acquisitions and the business of the Colonial and India Offices."
 ENG_workshop_affairs:0 "The Treasury and the Workshop"
 ENG_workshop_affairs_desc:0 "Taxation, investment and industrial policy."

 ENG_whip_the_party:0 "Whip the Party"
 ENG_whip_the_party_desc:0 "The Whips will remind our members where their loyalties lie and rally the party in the country."
 ENG_court_the_opposition:0 "Court the Opposition"
 ENG_court_the_opposition_desc:0 "A government that consults the other side governs more securely, though it strengthens its rivals."
 ENG_appoint_royal_commission:0 "Appoint a Royal Commission"
 ENG_appoint_royal_commission_desc:0 "When in doubt, inquire. A Royal Commission will gather evidence and recommend reform."
 ENG_hung_parliament_crisis:0 "A Hung Parliament"
 ENG_hung_parliament_crisis_desc:0 "No party can command the House. Some at Court whisper that the Queen should intervene."
 ENG_abyssinian_expedition:0 "The Abyssinian Expedition"
 ENG_abyssinian_expedition_desc:0 "Emperor Tewodros holds British envoys captive at Magdala. Sir Robert Napier will lead an army from Bombay to free them."
 ENG_red_river_expedition:0 "The Red River Expedition"
 ENG_red_river_expedition_desc:0 "Colonel Wolseley will lead regulars and militia across the wilderness to assert the Dominion's authority at Fort Garry."
 ENG_purchase_dutch_gold_coast:0 "Purchase the Dutch Gold Coast"
 ENG_purchase_dutch_gold_coast_desc:0 "The Netherlands is willing to sell its forts at Elmina and elsewhere on the Gold Coast."
 ENG_show_the_flag:0 "Show the Flag"
 ENG_show_the_flag_desc:0 "A cruise by the Flying Squadron reminds the world of British naval power."
 ENG_raise_the_income_tax:0 "Raise the Income Tax"
 ENG_raise_the_income_tax_desc:0 "A penny on the income tax will fill the Treasury, and empty the government's popularity."
 ENG_cut_the_income_tax:0 "Cut the Income Tax"
 ENG_cut_the_income_tax_desc:0 "Gladstone dreams of abolishing the income tax altogether. A reduction will please the middle classes."
 ENG_invest_in_railways:0 "Sanction New Railway Lines"
 ENG_invest_in_railways_desc:0 "Parliament will approve new lines and stations."
 ENG_balloon_trials_at_woolwich:0 "Balloon Trials at Woolwich"
 ENG_balloon_trials_at_woolwich_desc:0 "Captive ascents at Woolwich Arsenal will test gas supply, observation and signalling from the air."

 britain_fpw.1.t:0 "The Reform Bill Defeated"
 britain_fpw.1.d:0 "On 18 June Lord Dunkellin's amendment, carried by Conservatives and Robert Lowe's rebel Adullamites, has wrecked the government's Reform Bill. Lord Russell must decide whether to resign or to carry on with a divided party."
 britain_fpw.1.a:0 "Russell resigns; Lord Derby is sent for."
 britain_fpw.1.b:0 "Russell will not be driven out by his own backbenchers."
 britain_fpw.10.t:0 "Black Friday in Lombard Street"
 britain_fpw.10.d:0 "On 10 May the great discount house of Overend, Gurney and Company has stopped payment with debts of eleven million pounds. Crowds besiege the banks, and the Bank of England is close to the limit of its legal note issue."
 britain_fpw.10.a:0 "The Chancellor will authorise the Bank to suspend the Act."
 britain_fpw.10.b:0 "The market must clear itself."
 britain_fpw.11.t:0 "The Hyde Park Railings"
 britain_fpw.11.d:0 "The Home Secretary banned the Reform League's meeting in Hyde Park, but the crowd has pushed down the railings and poured into the park. For three days London has been in uproar. Mr Walpole is said to have wept before the League's deputation."
 britain_fpw.11.a:0 "Let the League meet; the right of public meeting stands."
 britain_fpw.11.b:0 "Send in the Guards."
 britain_fpw.12.t:0 "The Fenian Raids"
 britain_fpw.12.d:0 "Fenian veterans of the American Civil War have crossed the Niagara frontier and defeated Canadian militia at Ridgeway. The American government is slow to stop them."
 britain_fpw.12.a:0 "Reinforce the Canadian garrison."
 britain_fpw.12.b:0 "Lodge the strongest protest in Washington."
 britain_fpw.13.t:0 "The Fenian Rising"
 britain_fpw.13.d:0 "In March 1867 the Irish Republican Brotherhood has risen in Dublin, Cork, Limerick and Tipperary. Snowstorms and informers have crippled the rebels, but police barracks are under attack across Munster."
 britain_fpw.13.a:0 "The Constabulary had warning. The rising collapses."
 britain_fpw.13.b:0 "We were unprepared. Ireland is aflame."
 britain_fpw.14.t:0 "The Clerkenwell Outrage"
 britain_fpw.14.d:0 "Three Fenians were hanged in Manchester for the killing of a police sergeant during a rescue. Now a barrel of gunpowder, set to free a prisoner from Clerkenwell gaol, has demolished a row of houses and killed a dozen Londoners. Public opinion is outraged."
 britain_fpw.14.a:0 "The full rigour of the law."
 britain_fpw.14.b:0 "Violence must not blind us to Ireland's wrongs."
 britain_fpw.15.t:0 "The Sheffield Outrages"
 britain_fpw.15.d:0 "A can of gunpowder thrown into a non-union workman's house in Sheffield has led to revelations of years of 'rattening' and violence by the grinders' unions."
 britain_fpw.15.a:0 "Appoint a Royal Commission to inquire into the trade unions."
 britain_fpw.15.b:0 "Prosecute the union leaders."
 britain_fpw.16.t:0 "The Cattle Plague"
 britain_fpw.16.d:0 "Rinderpest, brought in with cattle from the Baltic, is killing herds across England. Dairymen in London have lost nearly half their cows."
 britain_fpw.16.a:0 "Compulsory slaughter and quarantine."
 britain_fpw.16.b:0 "We cannot ruin the farmers."
 britain_fpw.17.t:0 "The Top of the Greasy Pole"
 britain_fpw.17.d:0 "Lord Derby's gout has forced him to resign. The Queen has sent for Benjamin Disraeli, who tells his friends: 'Yes, I have climbed to the top of the greasy pole.'"
 britain_fpw.17.a:0 "Disraeli kisses hands as Prime Minister."
 britain_fpw.18.t:0 "The General Election"
 britain_fpw.18.d:0 "Britain has gone to the polls on the new household franchise. As the results come in from the boroughs and counties, the shape of the next government becomes clear."
 britain_fpw.18.a:0 "A Liberal majority. Gladstone is sent for."
 britain_fpw.18.b:0 "The new voters reward the Conservatives."
 britain_fpw.18.c:0 "No clear majority. The House is hung."
 britain_fpw.19.t:0 "The Captives of Tewodros"
 britain_fpw.19.d:0 "Emperor Tewodros II of Abyssinia has held the British consul Charles Cameron and the envoy Hormuzd Rassam in chains at Magdala for years. Diplomacy has failed."
 britain_fpw.19.a:0 "Prepare an expedition from Bombay."
 britain_fpw.19.b:0 "Keep negotiating."
 britain_fpw.20.t:0 "The Fall of Magdala"
 britain_fpw.20.d:0 "After a march of four hundred miles through the Abyssinian highlands, Napier's army has stormed Magdala. Tewodros has taken his own life and the captives are free. The army will now withdraw."
 britain_fpw.20.a:0 "A triumph of planning and logistics."
 britain_fpw.21.t:0 "HMS Captain at Sea"
 britain_fpw.21.d:0 "Coles's turret ship is complete, but the Chief Constructor warns that she sits nearly two feet deeper than designed and that her freeboard is perilously low for a ship carrying a full rig."
 britain_fpw.21.a:0 "Heed the warnings and hold more trials."
 britain_fpw.21.b:0 "Send her to sea with the Channel Squadron."
 britain_fpw.23.t:0 "The Gorchakov Circular"
 britain_fpw.23.d:0 "While Europe watches France and Prussia, Russia has declared that it no longer considers itself bound by the Black Sea clauses of the Treaty of Paris."
 britain_fpw.23.a:0 "Settle it at a conference in London."
 britain_fpw.23.b:0 "Britain will not tolerate unilateral repudiation."
 britain_fpw.24.t:0 "Dilke at Newcastle"
 britain_fpw.24.d:0 "Sir Charles Dilke, a young Radical MP, has told a Newcastle audience that the monarchy costs too much and does too little, and that he would welcome a republic if the nation were ready. The speech is everywhere."
 britain_fpw.24.a:0 "Loyal addresses and indignant leaders drown him out."
 britain_fpw.24.b:0 "Let the debate run its course."
 britain_fpw.25.t:0 "The Prince of Wales Lies Ill"
 britain_fpw.25.d:0 "The Prince of Wales has typhoid fever, the illness that killed his father ten years ago, almost to the day. The whole nation waits for the bulletins from Sandringham."
 britain_fpw.25.a:0 "He recovers. The nation gives thanks."
 britain_fpw.26.t:0 "The Nine Hours Strike"
 britain_fpw.26.d:0 "The engineers of Newcastle and Sunderland have been on strike for five months for a nine-hour day. The employers are bringing in foreign labour, but the men are holding firm."
 britain_fpw.26.a:0 "The masters concede the nine-hour day."
 britain_fpw.26.b:0 "Stand with the employers."
 britain_fpw.28.t:0 "The Geneva Award"
 britain_fpw.28.d:0 "The tribunal at Geneva has found Britain liable for the depredations of the Alabama, Florida and Shenandoah, and has awarded the United States fifteen and a half million dollars in gold."
 britain_fpw.28.a:0 "Pay the award. Arbitration is better than war."
 britain_fpw.28.b:0 "The award is unjust and will not be paid."
 britain_fpw.29.t:0 "The General Election"
 britain_fpw.29.d:0 "Parliament has been dissolved. The ministry seeks a fresh mandate from the country."
 britain_fpw.29.a:0 "A Conservative majority. Disraeli returns."
 britain_fpw.29.b:0 "The Liberals hold on."
 britain_fpw.29.c:0 "Deadlock at Westminster."
 britain_fpw.30.t:0 "The Ashanti War"
 britain_fpw.30.d:0 "The Asante army has invaded the Gold Coast protectorate. Garnet Wolseley proposes to march on Kumasi with picked battalions before the fever season begins."
 britain_fpw.30.a:0 "Send Wolseley."
 britain_fpw.30.b:0 "The protectorate must defend itself."
 britain_fpw.31.t:0 "The Death of Charles Dickens"
 britain_fpw.31.d:0 "Charles Dickens has died at Gad's Hill, leaving Edwin Drood unfinished. He asked to be buried quietly; instead he will lie in Poets' Corner, Westminster Abbey."
 britain_fpw.31.a:0 "The nation mourns the Inimitable."
 britain_fpw.35.t:0 "The International"
 britain_fpw.35.d:0 "Again and again organised labour has been beaten down by the law and the magistrates. In the meeting rooms of the International Workingmen's Association, men are beginning to ask whether Parliament will ever give the working class justice."
 britain_fpw.35.a:0 "The workers will not be silenced."
 britain_fpw.35.b:0 "Swear in special constables."
 britain_fpw.36.t:0 "Greater Britain"
 britain_fpw.36.d:0 "Charles Dilke's account of his travels through America, Australia and India describes a 'Greater Britain' of English-speaking peoples. With the Dominion of Canada established and Disraeli preaching empire, some ask whether that greater Britain could become a single state."
 britain_fpw.36.a:0 "Federate the empire."
 britain_fpw.36.b:0 "A young man's fancy."
 britain_fpw.37.t:0 "Fort Garry Reached"
 britain_fpw.37.d:0 "After three months of portages and rapids, Wolseley's column has reached Fort Garry. Riel has fled and the Dominion's authority is secure on the Red River."
 britain_fpw.37.a:0 "Well done."
 britain_fpw.38.t:0 "A Hung Parliament"
 britain_fpw.38.d:0 "Ministries fall one after another and no leader can form a lasting government. At Windsor, the Queen's private secretary drafts memoranda on the royal prerogative."
 britain_fpw.38.a:0 "The constitution is in crisis."
 britain_fpw.39.t:0 "The International Exhibition"
 britain_fpw.39.d:0 "South Kensington hosts the first of a series of annual international exhibitions of fine art and industry, in the shadow of the new Royal Albert Hall."
 britain_fpw.39.a:0 "Industry and art in harmony."

 britain_news.1.t:0 "Britain Takes a Leap in the Dark"
 britain_news.1.d:0 "The Second Reform Act has received the royal assent. Nearly a million men, most of them working men in the towns, have been added to the electorate of the United Kingdom."
 britain_news.1.a:0 "A great day for the constitution."
 britain_news.1.b:0 "The British grow more democratic by the year."
 britain_news.2.t:0 "Church of Ireland Disestablished"
 britain_news.2.d:0 "The Irish Church Act ends the Church of Ireland's status as the established church. The Catholic majority will no longer pay for a Protestant establishment."
 britain_news.2.a:0 "Justice for Ireland."
 britain_news.2.b:0 "London concedes to the Irish."
 britain_news.3.t:0 "Britain Legislates for Popular Education"
 britain_news.3.d:0 "Forster's Elementary Education Act provides for elected school boards to build schools wherever existing provision is inadequate."
 britain_news.3.a:0 "Every child shall be taught."
 britain_news.3.b:0 "Britain follows Prussia in schooling her people."
 britain_news.4.t:0 "The Irish Land Act"
 britain_news.4.d:0 "Irish tenants will now be compensated for eviction and for the improvements they make to their holdings."
 britain_news.4.a:0 "A first step."
 britain_news.4.b:0 "Will it be enough?"
 britain_news.5.t:0 "Purchase Abolished in the British Army"
 britain_news.5.d:0 "Defeated in the House of Lords, the government has abolished the purchase of army commissions by Royal Warrant. Officers will now rise by merit and seniority."
 britain_news.5.a:0 "A professional army at last."
 britain_news.5.b:0 "The British Army modernises."
 britain_news.6.t:0 "The Secret Ballot Comes to Britain"
 britain_news.6.d:0 "Parliamentary and municipal elections in the United Kingdom will now be held by secret ballot."
 britain_news.6.a:0 "The end of the bribed and bullied voter."
 britain_news.6.b:0 "Britain adopts the secret ballot."
 britain_news.7.t:0 "Thanksgiving at St Paul's"
 britain_news.7.d:0 "Huge crowds lined the route as the Queen and the recovered Prince of Wales drove to St Paul's Cathedral for a service of national thanksgiving."
 britain_news.7.a:0 "God save the Queen!"
 britain_news.7.b:0 "The British monarchy is popular again."
 britain_news.8.t:0 "HMS Devastation Commissioned"
 britain_news.8.d:0 "The Royal Navy's new turret ship carries no masts or sails at all. Naval officers across the world are studying her design."
 britain_news.8.a:0 "The future of naval warfare."
 britain_news.8.b:0 "We must study her closely."
 britain_news.9.t:0 "Revolution in Britain"
 britain_news.9.d:0 "Workers' committees have seized power in London and the industrial North. Loyalist forces are gathering elsewhere. The workshop of the world is at war with itself."
 britain_news.9.a:0 "The workers' hour has come."
 britain_news.9.b:0 "A Commune in London!"
 britain_news.10.t:0 "Britain Proclaims a Commonwealth"
 britain_news.10.d:0 "For the first time since Cromwell, Britain has abolished its monarchy. Sir Charles Dilke heads a republican government, while royalists rally to the Crown."
 britain_news.10.a:0 "Long live the Commonwealth!"
 britain_news.10.b:0 "The British throne has fallen."
 britain_news.11.t:0 "Britain Guarantees Belgium"
 britain_news.11.d:0 "London has concluded separate treaties with France and Prussia: if either violates Belgian neutrality, Britain will defend Belgium together with the other."
 britain_news.11.a:0 "Belgium must stay neutral."
 britain_news.11.b:0 "Britain draws a line."
 britain_news.12.t:0 "The Dominion of Canada"
 britain_news.12.d:0 "The British North America Act has united Canada, Nova Scotia and New Brunswick in a new self-governing Dominion under the British Crown."
 britain_news.12.a:0 "A new nation within the empire."
 britain_news.12.b:0 "A new Dominion in North America."
 britain_news.13.t:0 "The Treaty of Washington"
 britain_news.13.d:0 "Britain and the United States have agreed to submit the Alabama claims to international arbitration, the largest dispute ever settled in this way."
 britain_news.13.a:0 "Arbitration instead of war."
 britain_news.13.b:0 "The Anglo-Saxon powers make peace."
 britain_news.14.t:0 "The Suez Canal Opens"
 britain_news.14.d:0 "The canal across the Isthmus of Suez is open. The voyage from London to Bombay has been cut by more than four thousand miles."
 britain_news.14.a:0 "The road to India is shorter."
 britain_news.14.b:0 "A new age of world trade."
 britain_news.15.t:0 "The Empire Federates"
 britain_news.15.d:0 "The United Kingdom and its self-governing colonies have joined in a single imperial federation."
 britain_news.15.a:0 "Greater Britain is born."
 britain_news.15.b:0 "A world empire becomes a world state."
 britain_news.16.t:0 "Panic in Lombard Street"
 britain_news.16.d:0 "The collapse of the London discount house Overend, Gurney and Company has set off a financial panic. Bank rate has risen to ten per cent and failures are spreading."
 britain_news.16.a:0 "Black Friday."
 britain_news.16.b:0 "The City of London trembles."
 britain_news.17.t:0 "Magdala Falls"
 britain_news.17.d:0 "A British expedition has stormed the Abyssinian fortress of Magdala and freed the European captives of Emperor Tewodros, who has taken his own life."
 britain_news.17.a:0 "A brilliant campaign."
 britain_news.17.b:0 "Britain's long arm reaches Abyssinia."
 britain_news.18.t:0 "HMS Captain Lost"
 britain_news.18.d:0 "The new British turret ship HMS Captain has capsized in a gale off Cape Finisterre. Nearly five hundred men have drowned, among them her designer, Captain Cowper Coles."
 britain_news.18.a:0 "A national tragedy."
 britain_news.18.b:0 "A disaster for the Royal Navy."
 britain_news.19.t:0 "Outrage at Clerkenwell"
 britain_news.19.d:0 "A Fenian bomb intended to free prisoners from Clerkenwell House of Detention has killed and maimed London residents. Anti-Irish feeling is running high."
 britain_news.19.a:0 "The Fenians will be brought to justice."
 britain_news.19.b:0 "Ireland's troubles reach London."

 britain_fpw.2.d:0 "France is in turmoil and her future hangs in the balance. Britain could hasten the fall of the Emperor's regime by backing a coup, or settle matters by force of arms."
 britain_fpw.3.d:0 "The opponents of the regime in Paris are ready to move. With British money and arms behind them, they might succeed."
 britain_fpw.4.d:0 "Paris has risen against the government. Revolutionaries have seized the capital and the north, and France is at war with itself."
 britain_fpw.5.d:0 "[FROM.GetName] demands that we dissolve the unified German state and restore the independence of the lesser German states."
