l_english:
 ENG_commonwealth:0 "Commonwealth of Britain"
 ENG_commonwealth_DEF:0 "the Commonwealth of Britain"
 ENG_commonwealth_ADJ:0 "British"

 fpw_eng_city_of_london:0 "The City of London"
 fpw_eng_city_of_london_desc:0 "London is the world's money market. Sterling bills finance trade on every continent, and the great houses of Rothschild and Baring lend to governments everywhere."
 fpw_eng_rule_britannia:0 "Rule, Britannia"
 fpw_eng_rule_britannia_desc:0 "The Royal Navy is larger than the next two navies combined, and the dockyards of the Thames, Tyne and Clyde can outbuild the world."
 fpw_eng_reform_agitation:0 "Agitation for Reform"
 fpw_eng_reform_agitation_desc:0 "The Reform League and the Reform Union are holding mass meetings across the country. Five men in six still have no vote."
 fpw_eng_irish_question:0 "The Irish Question"
 fpw_eng_irish_question_desc:0 "Absentee landlords, an established Protestant Church and the memory of the Famine keep Ireland disaffected, and the Fenian Brotherhood is waiting for its chance."
 fpw_eng_fenian_insurgency:0 "Fenian Insurgency"
 fpw_eng_fenian_insurgency_desc:0 "The Irish Republican Brotherhood is in open revolt. Police barracks are attacked and the countryside is unsafe."
 fpw_eng_labour_tensions:0 "Industrial Labour Tensions"
 fpw_eng_labour_tensions_desc:0 "Trade unions have no secure legal standing, and strikes, lock-outs and the occasional outrage disturb the manufacturing districts."
 fpw_eng_purchase_system:0 "Purchase of Commissions"
 fpw_eng_purchase_system_desc:0 "Most army commissions and promotions are bought and sold. Wealth, not merit, decides who commands."
 fpw_eng_seclusion_of_the_queen:0 "The Widow of Windsor"
 fpw_eng_seclusion_of_the_queen_desc:0 "Since Prince Albert's death the Queen has all but withdrawn from public life, and her people have begun to wonder what the monarchy is for."
 fpw_eng_urban_squalor:0 "Urban Squalor"
 fpw_eng_urban_squalor_desc:0 "Cholera, typhus and consumption thrive in the overcrowded courts of the industrial towns."
 fpw_eng_panic_of_1866:0 "The Panic of 1866"
 fpw_eng_panic_of_1866_desc:0 "The collapse of Overend, Gurney and Company has brought down banks and contractors across the country. Bank rate stands at ten per cent."
 fpw_eng_credit_restored:0 "Credit Restored"
 fpw_eng_credit_restored_desc:0 "The Bank of England has lent freely and confidence is returning to Lombard Street."
 fpw_eng_household_suffrage:0 "Household Suffrage"
 fpw_eng_household_suffrage_desc:0 "Every male householder in the boroughs now has the vote. The electorate has almost doubled."
 fpw_eng_secret_ballot:0 "The Secret Ballot"
 fpw_eng_secret_ballot_desc:0 "Votes are now cast in secret, beyond the reach of landlord and employer."
 fpw_eng_meritocratic_civil_service:0 "Open Competition"
 fpw_eng_meritocratic_civil_service_desc:0 "Clerks are recruited by examination, not patronage."
 fpw_eng_tory_democracy:0 "Tory Democracy"
 fpw_eng_tory_democracy_desc:0 "The Conservative party has found a popular voice among the new electors."
 fpw_eng_peace_retrenchment_reform:0 "Peace, Retrenchment and Reform"
 fpw_eng_peace_retrenchment_reform_desc:0 "Economy in spending and caution abroad are the watchwords of the government."
 fpw_eng_unpopular_licensing_act:0 "The Licensing Act Backlash"
 fpw_eng_unpopular_licensing_act_desc:0 "Publicans and brewers have turned against the government."
 fpw_eng_sanitary_reform:0 "Sanitary Reform"
 fpw_eng_sanitary_reform_desc:0 "Sewers, clean water and medical officers of health are beginning to tame the diseases of the towns."
 fpw_eng_elementary_education:0 "Elementary Education"
 fpw_eng_elementary_education_desc:0 "School boards are building schools wherever the churches have left gaps."
 fpw_eng_voluntary_schools:0 "Voluntary Schools"
 fpw_eng_voluntary_schools_desc:0 "Church schools, generously funded, remain the backbone of popular education."
 fpw_eng_legal_trade_unions:0 "Lawful Trade Unions"
 fpw_eng_legal_trade_unions_desc:0 "The unions are recognised in law and their funds are protected."
 fpw_eng_restricted_picketing:0 "Restricted Picketing"
 fpw_eng_restricted_picketing_desc:0 "The unions are lawful, but the Criminal Law Amendment Act makes effective picketing a crime."
 fpw_eng_nine_hours_day:0 "The Nine-Hour Day"
 fpw_eng_nine_hours_day_desc:0 "Engineering workers have won a fifty-four hour week."
 fpw_eng_coercion_in_ireland:0 "Coercion in Ireland"
 fpw_eng_coercion_in_ireland_desc:0 "Special powers and a strong garrison hold Ireland down."
 fpw_eng_justice_for_ireland:0 "Justice for Ireland"
 fpw_eng_justice_for_ireland_desc:0 "Ireland is being governed with Irish grievances in mind."
 fpw_eng_free_trade:0 "Free Trade"
 fpw_eng_free_trade_desc:0 "Britain's ports are open to the goods of the world."
 fpw_eng_fair_trade:0 "Fair Trade"
 fpw_eng_fair_trade_desc:0 "Home industry and agriculture are shielded from foreign competition."
 fpw_eng_cattle_plague:0 "The Cattle Plague"
 fpw_eng_cattle_plague_desc:0 "Rinderpest is sweeping through the herds of England."
 fpw_eng_short_service:0 "Short Service"
 fpw_eng_short_service_desc:0 "Six years with the colours, six in the reserve: the army can at last expand in wartime."
 fpw_eng_professional_officer_corps:0 "A Professional Officer Corps"
 fpw_eng_professional_officer_corps_desc:0 "Promotion now depends on merit and seniority, not on the length of an officer's purse."
 fpw_eng_regimental_tradition:0 "Regimental Tradition"
 fpw_eng_regimental_tradition_desc:0 "Pride in the regiment carries the British soldier through any ordeal."
 fpw_eng_balloon_experiments:0 "Balloon Experiments"
 fpw_eng_balloon_experiments_desc:0 "The Royal Engineers are experimenting with tethered observation balloons. They are a tool for reconnaissance and artillery spotting, not a fighting arm."
 fpw_eng_flying_squadron:0 "The Flying Squadron"
 fpw_eng_flying_squadron_desc:0 "Our cruising squadrons are trained in long-distance voyages around the globe."
 fpw_eng_royal_revival:0 "Royal Revival"
 fpw_eng_royal_revival_desc:0 "The monarchy is once again loved by the nation."
 fpw_eng_republican_agitation:0 "Republican Agitation"
 fpw_eng_republican_agitation_desc:0 "Republican clubs, satirical pamphlets and angry speeches attack the cost of an absent Crown."
 fpw_eng_imperial_federation:0 "Imperial Federation"
 fpw_eng_imperial_federation_desc:0 "The empire is drawing together into a single political community."
 fpw_eng_pax_britannica:0 "Pax Britannica"
 fpw_eng_pax_britannica_desc:0 "British sea power and British credit underpin a world order of free trade and peace."

