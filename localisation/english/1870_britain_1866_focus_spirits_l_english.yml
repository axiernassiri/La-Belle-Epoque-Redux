l_english:
 fpw_eng_r_treasury_early:0 "Treasury Control (Beginnings)"
 fpw_eng_r_treasury_early_desc:0 "The Treasury watches every vote of money. Thrift is a virtue, but the spending departments chafe under it. The work has only just begun."
 fpw_eng_r_treasury:0 "Treasury Control"
 fpw_eng_r_treasury_desc:0 "The Treasury watches every vote of money. Thrift is a virtue, but the spending departments chafe under it."
 fpw_eng_r_local_early:0 "Local Self-Government (Beginnings)"
 fpw_eng_r_local_early_desc:0 "Towns and counties are learning to govern, tax and build for themselves, often against the will of Whitehall. The work has only just begun."
 fpw_eng_r_local:0 "Local Self-Government"
 fpw_eng_r_local_desc:0 "Towns and counties are learning to govern, tax and build for themselves, often against the will of Whitehall."
 fpw_eng_r_party_early:0 "The Party Machine (Beginnings)"
 fpw_eng_r_party_early_desc:0 "Organised parties, a national press and professional agents now decide elections. Politics grows sharper as it grows larger. The work has only just begun."
 fpw_eng_r_party:0 "The Party Machine"
 fpw_eng_r_party_desc:0 "Organised parties, a national press and professional agents now decide elections. Politics grows sharper as it grows larger."
 fpw_eng_r_sanitary_early:0 "The Sanitary Idea (Beginnings)"
 fpw_eng_r_sanitary_early_desc:0 "Drains, clean water and inspectors: the great towns are being made fit to live in, at a price the ratepayers feel. The work has only just begun."
 fpw_eng_r_sanitary:0 "The Sanitary Idea"
 fpw_eng_r_sanitary_desc:0 "Drains, clean water and inspectors: the great towns are being made fit to live in, at a price the ratepayers feel."
 fpw_eng_r_poor_law_early:0 "Self-Help and the Poor Law (Beginnings)"
 fpw_eng_r_poor_law_early_desc:0 "Charity is to be organised, thrift encouraged and the pauper discouraged. Respectable working men prosper; the destitute suffer. The work has only just begun."
 fpw_eng_r_poor_law:0 "Self-Help and the Poor Law"
 fpw_eng_r_poor_law_desc:0 "Charity is to be organised, thrift encouraged and the pauper discouraged. Respectable working men prosper; the destitute suffer."
 fpw_eng_r_woman_early:0 "The Woman Question (Beginnings)"
 fpw_eng_r_woman_early_desc:0 "Women are entering the colleges, the hospitals and the school boards, and demanding the vote. Their opponents are loud and many. The work has only just begun."
 fpw_eng_r_woman:0 "The Woman Question"
 fpw_eng_r_woman_desc:0 "Women are entering the colleges, the hospitals and the school boards, and demanding the vote. Their opponents are loud and many."
 fpw_eng_r_science_early:0 "The Scientific Spirit (Beginnings)"
 fpw_eng_r_science_early_desc:0 "Laboratories, learned societies and the reviews are remaking how Britain thinks. Not everyone welcomes the new ideas. The work has only just begun."
 fpw_eng_r_science:0 "The Scientific Spirit"
 fpw_eng_r_science_desc:0 "Laboratories, learned societies and the reviews are remaking how Britain thinks. Not everyone welcomes the new ideas."
 fpw_eng_r_letters_early:0 "The Victorian Imagination (Beginnings)"
 fpw_eng_r_letters_early_desc:0 "Novels, poems, museums and cathedrals of iron and Gothic stone: the age is finding its voice, and money is being spent on it. The work has only just begun."
 fpw_eng_r_letters:0 "The Victorian Imagination"
 fpw_eng_r_letters_desc:0 "Novels, poems, museums and cathedrals of iron and Gothic stone: the age is finding its voice, and money is being spent on it."
 fpw_eng_r_home_office_early:0 "The Queen's Peace (Beginnings)"
 fpw_eng_r_home_office_early_desc:0 "Police, prisons and the courts keep order at home. Radicals mutter about Continental methods. The work has only just begun."
 fpw_eng_r_home_office:0 "The Queen's Peace"
 fpw_eng_r_home_office_desc:0 "Police, prisons and the courts keep order at home. Radicals mutter about Continental methods."
 fpw_eng_r_railways_early:0 "The Iron Road (Beginnings)"
 fpw_eng_r_railways_early_desc:0 "Fifteen thousand miles of railway bind the kingdom together. Every new line costs money, land and labour before it pays. The work has only just begun."
 fpw_eng_r_railways:0 "The Iron Road"
 fpw_eng_r_railways_desc:0 "Fifteen thousand miles of railway bind the kingdom together. Every new line costs money, land and labour before it pays."
 fpw_eng_r_coal_iron_early:0 "Coal and Iron (Beginnings)"
 fpw_eng_r_coal_iron_early_desc:0 "The pits and the furnaces are the foundation of British power, and the hardest, most dangerous work in the land. The work has only just begun."
 fpw_eng_r_coal_iron:0 "Coal and Iron"
 fpw_eng_r_coal_iron_desc:0 "The pits and the furnaces are the foundation of British power, and the hardest, most dangerous work in the land."
 fpw_eng_r_cotton_early:0 "King Cotton (Beginnings)"
 fpw_eng_r_cotton_early_desc:0 "Lancashire clothes the world. The spindles turn day and night, and the mill towns live by their rhythm. The work has only just begun."
 fpw_eng_r_cotton:0 "King Cotton"
 fpw_eng_r_cotton_desc:0 "Lancashire clothes the world. The spindles turn day and night, and the mill towns live by their rhythm."
 fpw_eng_r_money_early:0 "The Money Market (Beginnings)"
 fpw_eng_r_money_early_desc:0 "Bills, bonds and shares: the City finances the world, and the world's crises come home to the City. The work has only just begun."
 fpw_eng_r_money:0 "The Money Market"
 fpw_eng_r_money_desc:0 "Bills, bonds and shares: the City finances the world, and the world's crises come home to the City."
 fpw_eng_r_land_early:0 "The Land Interest (Beginnings)"
 fpw_eng_r_land_early_desc:0 "Four thousand families own half of England. The countryside is prosperous, deferential and slow to change. The work has only just begun."
 fpw_eng_r_land:0 "The Land Interest"
 fpw_eng_r_land_desc:0 "Four thousand families own half of England. The countryside is prosperous, deferential and slow to change."
 fpw_eng_r_ordnance_early:0 "The Ordnance Factories (Beginnings)"
 fpw_eng_r_ordnance_early_desc:0 "Woolwich, Enfield and the private gunmakers arm the Queen's forces. Each new pattern means new machinery and new controversy. The work has only just begun."
 fpw_eng_r_ordnance:0 "The Ordnance Factories"
 fpw_eng_r_ordnance_desc:0 "Woolwich, Enfield and the private gunmakers arm the Queen's forces. Each new pattern means new machinery and new controversy."
 fpw_eng_r_home_defence_early:0 "An Englishman's Home (Beginnings)"
 fpw_eng_r_home_defence_early_desc:0 "Forts, volunteers and reserves stand ready against an invasion that may never come. The scaremongers keep the nation nervous. The work has only just begun."
 fpw_eng_r_home_defence:0 "An Englishman's Home"
 fpw_eng_r_home_defence_desc:0 "Forts, volunteers and reserves stand ready against an invasion that may never come. The scaremongers keep the nation nervous."
 fpw_eng_r_soldiers_early:0 "Tommy Atkins (Beginnings)"
 fpw_eng_r_soldiers_early_desc:0 "The private soldier is being treated as a man rather than a brute. Better men enlist, but they cost more to keep. The work has only just begun."
 fpw_eng_r_soldiers:0 "Tommy Atkins"
 fpw_eng_r_soldiers_desc:0 "The private soldier is being treated as a man rather than a brute. Better men enlist, but they cost more to keep."
 fpw_eng_r_dockyards_early:0 "The Royal Dockyards (Beginnings)"
 fpw_eng_r_dockyards_early_desc:0 "Basins, slips and steam factories are being rebuilt for the age of iron. The yards eat money before they turn out ships. The work has only just begun."
 fpw_eng_r_dockyards:0 "The Royal Dockyards"
 fpw_eng_r_dockyards_desc:0 "Basins, slips and steam factories are being rebuilt for the age of iron. The yards eat money before they turn out ships."
 fpw_eng_r_naval_tactics_early:0 "The Steam Navy (Beginnings)"
 fpw_eng_r_naval_tactics_early_desc:0 "Masts and sails are giving way to engines, rams and turrets. The new fleet is faster and deadlier, and tied to its coal. The work has only just begun."
 fpw_eng_r_naval_tactics:0 "The Steam Navy"
 fpw_eng_r_naval_tactics_desc:0 "Masts and sails are giving way to engines, rams and turrets. The new fleet is faster and deadlier, and tied to its coal."
 fpw_eng_r_seas_early:0 "Policeman of the Oceans (Beginnings)"
 fpw_eng_r_seas_early_desc:0 "From the slave coasts to the China Seas, the Royal Navy keeps order on the world's waters, at Britain's expense. The work has only just begun."
 fpw_eng_r_seas:0 "Policeman of the Oceans"
 fpw_eng_r_seas_desc:0 "From the slave coasts to the China Seas, the Royal Navy keeps order on the world's waters, at Britain's expense."
 fpw_eng_r_royal_family_early:0 "The Royal Family (Beginnings)"
 fpw_eng_r_royal_family_early_desc:0 "The Queen's children and grandchildren are the nation's family. They cost the nation money, and occasionally embarrassment. The work has only just begun."
 fpw_eng_r_royal_family:0 "The Royal Family"
 fpw_eng_r_royal_family_desc:0 "The Queen's children and grandchildren are the nation's family. They cost the nation money, and occasionally embarrassment."
 fpw_eng_r_church_early:0 "Church and Chapel (Beginnings)"
 fpw_eng_r_church_early_desc:0 "Britain is a churchgoing nation, but a divided one: Anglican, Dissenter and Catholic each have their own politics. The work has only just begun."
 fpw_eng_r_church:0 "Church and Chapel"
 fpw_eng_r_church_desc:0 "Britain is a churchgoing nation, but a divided one: Anglican, Dissenter and Catholic each have their own politics."
 fpw_eng_r_great_game_early:0 "The Great Game (Beginnings)"
 fpw_eng_r_great_game_early_desc:0 "From the Bosphorus to the Pamirs, Britain shadows Russia's every step towards India. The work has only just begun."
 fpw_eng_r_great_game:0 "The Great Game"
 fpw_eng_r_great_game_desc:0 "From the Bosphorus to the Pamirs, Britain shadows Russia's every step towards India."
 fpw_eng_r_concert_early:0 "The European Balance (Beginnings)"
 fpw_eng_r_concert_early_desc:0 "Britain holds the balance of Europe by keeping out of its quarrels, so far as she can. The work has only just begun."
 fpw_eng_r_concert:0 "The European Balance"
 fpw_eng_r_concert_desc:0 "Britain holds the balance of Europe by keeping out of its quarrels, so far as she can."
 fpw_eng_r_far_east_early:0 "The Eastern Seas (Beginnings)"
 fpw_eng_r_far_east_early_desc:0 "Treaty ports, consuls and gunboats open the markets of China, Japan and Burma to British trade. The work has only just begun."
 fpw_eng_r_far_east:0 "The Eastern Seas"
 fpw_eng_r_far_east_desc:0 "Treaty ports, consuls and gunboats open the markets of China, Japan and Burma to British trade."
 fpw_eng_r_commerce_early:0 "Trade Follows the Flag (Beginnings)"
 fpw_eng_r_commerce_early_desc:0 "Commercial treaties, consuls and loans make Britain the hub of a worldwide web of trade, open to rivals as well as friends. The work has only just begun."
 fpw_eng_r_commerce:0 "Trade Follows the Flag"
 fpw_eng_r_commerce_desc:0 "Commercial treaties, consuls and loans make Britain the hub of a worldwide web of trade, open to rivals as well as friends."
 fpw_eng_r_raj_early:0 "The Indian Empire (Beginnings)"
 fpw_eng_r_raj_early_desc:0 "Two hundred and fifty million people governed by a thousand covenanted civil servants and a sixty-thousand-strong British army. The work has only just begun."
 fpw_eng_r_raj:0 "The Indian Empire"
 fpw_eng_r_raj_desc:0 "Two hundred and fifty million people governed by a thousand covenanted civil servants and a sixty-thousand-strong British army."
 fpw_eng_r_british_america_early:0 "British America (Beginnings)"
 fpw_eng_r_british_america_early_desc:0 "The Dominion of Canada governs itself, the sugar islands decline, and the garrisons are coming home. The work has only just begun."
 fpw_eng_r_british_america:0 "British America"
 fpw_eng_r_british_america_desc:0 "The Dominion of Canada governs itself, the sugar islands decline, and the garrisons are coming home."
 fpw_eng_r_southern_africa_early:0 "The Cape and Natal (Beginnings)"
 fpw_eng_r_southern_africa_early_desc:0 "Diamonds, wool and sugar enrich the colonies of southern Africa, and draw Britain ever deeper into its quarrels. The work has only just begun."
 fpw_eng_r_southern_africa:0 "The Cape and Natal"
 fpw_eng_r_southern_africa_desc:0 "Diamonds, wool and sugar enrich the colonies of southern Africa, and draw Britain ever deeper into its quarrels."
 fpw_eng_r_tropical_africa_early:0 "Commerce and Christianity (Beginnings)"
 fpw_eng_r_tropical_africa_early_desc:0 "Explorers, missionaries, consuls and traders are opening up the interior of Africa, at a terrible cost in fever. The work has only just begun."
 fpw_eng_r_tropical_africa:0 "Commerce and Christianity"
 fpw_eng_r_tropical_africa_desc:0 "Explorers, missionaries, consuls and traders are opening up the interior of Africa, at a terrible cost in fever."
 fpw_eng_r_antipodes_early:0 "Britain of the South (Beginnings)"
 fpw_eng_r_antipodes_early_desc:0 "The Australian colonies and New Zealand are prosperous, self-governing and loyal, and expect to be consulted. The work has only just begun."
 fpw_eng_r_antipodes:0 "Britain of the South"
 fpw_eng_r_antipodes_desc:0 "The Australian colonies and New Zealand are prosperous, self-governing and loyal, and expect to be consulted."
 fpw_eng_r_colonial_office_early:0 "The Colonial Office (Beginnings)"
 fpw_eng_r_colonial_office_early_desc:0 "Downing Street governs forty colonies with a few dozen clerks, a great deal of paper and a lot of patience. The work has only just begun."
 fpw_eng_r_colonial_office:0 "The Colonial Office"
 fpw_eng_r_colonial_office_desc:0 "Downing Street governs forty colonies with a few dozen clerks, a great deal of paper and a lot of patience."
 fpw_eng_x_exchequer_audit:0 "The Comptroller and Auditor General"
 fpw_eng_x_exchequer_audit_desc:0 "Every department's accounts now pass under a single independent eye."
 fpw_eng_x_match_tax:0 "The Match Tax Agitation"
 fpw_eng_x_match_tax_desc:0 "The match girls have marched on Westminster, and the Chancellor is a laughing stock, but the revenue is safe."
 fpw_eng_x_great_stink:0 "The Great Stink Remembered"
 fpw_eng_x_great_stink_desc:0 "Nobody who smelled the Thames in 1858 wants to again. London will pay for its drains."
 fpw_eng_x_cholera:0 "Cholera in the East End"
 fpw_eng_x_cholera_desc:0 "Thousands are dying in Whitechapel, and Dr Farr is mapping every case."
 fpw_eng_x_anti_vaccination:0 "The Anti-Vaccination League"
 fpw_eng_x_anti_vaccination_desc:0 "Fines, riots and pamphlets in Leicester, but a healthier generation of recruits."
 fpw_eng_x_birmingham_caucus:0 "The Caucus"
 fpw_eng_x_birmingham_caucus_desc:0 "The Birmingham machine delivers every Liberal vote in the town."
 fpw_eng_x_thunderer:0 "The Thunderer"
 fpw_eng_x_thunderer_desc:0 "The Times speaks, and the governing classes listen."
 fpw_eng_x_edinburgh_riot:0 "The Surgeons' Hall Riot"
 fpw_eng_x_edinburgh_riot_desc:0 "Students pelted seven women with mud. The scandal has done the women's cause more good than harm."
 fpw_eng_x_descent_of_man:0 "The Darwinian Controversy"
 fpw_eng_x_descent_of_man_desc:0 "Bishops and professors are at war in the reviews, and the public reads every word."
 fpw_eng_x_challenger:0 "HMS Challenger at Sea"
 fpw_eng_x_challenger_desc:0 "The great survey ship is sounding the ocean floors of the world."
 fpw_eng_x_albert_hall:0 "The Hall of Arts and Sciences"
 fpw_eng_x_albert_hall_desc:0 "Concerts, congresses and exhibitions fill the great hall in the Prince Consort's memory."
 fpw_eng_x_detective_branch:0 "Scotland Yard"
 fpw_eng_x_detective_branch_desc:0 "Plain-clothes detectives follow the forgers, swindlers and Fenians of London."
 fpw_eng_x_hyde_park:0 "The Right of Public Meeting"
 fpw_eng_x_hyde_park_desc:0 "Speakers have their corner in the park, and the railings stay standing."
 fpw_eng_x_metropolitan_line:0 "The Underground Railway"
 fpw_eng_x_metropolitan_line_desc:0 "Twenty million passengers a year travel beneath the streets of London."
 fpw_eng_x_coal_famine:0 "The Coal Famine"
 fpw_eng_x_coal_famine_desc:0 "Coal has doubled in price. The colliers prosper; everyone else shivers."
 fpw_eng_x_oldham_boom:0 "The Oldham Mill Boom"
 fpw_eng_x_oldham_boom_desc:0 "Working men's shares are building a new mill every month."
 fpw_eng_x_vienna_crash:0 "The Panic of 1873"
 fpw_eng_x_vienna_crash_desc:0 "Vienna, Berlin and New York are in panic. Only London still lends."
 fpw_eng_x_revolt_of_the_field:0 "The Revolt of the Field"
 fpw_eng_x_revolt_of_the_field_desc:0 "The farmers have locked out the union men; thousands are emigrating to the towns and the colonies."
 fpw_eng_x_gun_controversy:0 "The Great Gun Controversy"
 fpw_eng_x_gun_controversy_desc:0 "Armstrong and Whitworth fight on in the press, the committees and the Commons."
 fpw_eng_x_dorking_panic:0 "The Invasion Panic"
 fpw_eng_x_dorking_panic_desc:0 "Everyone has read the Battle of Dorking, and the volunteer corps are full."
 fpw_eng_x_lissa:0 "The Ram Craze"
 fpw_eng_x_lissa_desc:0 "Every new ironclad must have a ram bow, whatever the gunnery officers say."
 fpw_eng_x_gunboats:0 "Gunboat Diplomacy"
 fpw_eng_x_gunboats_desc:0 "Where a consul's protest fails, a gunboat in the harbour rarely does."
 fpw_eng_x_mordaunt:0 "The Mordaunt Case"
 fpw_eng_x_mordaunt_desc:0 "The Prince of Wales in the witness box: the clubs talk of nothing else."
 fpw_eng_x_revival:0 "The Moody and Sankey Revival"
 fpw_eng_x_revival_desc:0 "Hymns and sermons fill the halls of every great town."
 fpw_eng_x_forward_policy:0 "The Forward Policy"
 fpw_eng_x_forward_policy_desc:0 "The frontier is to be held in the passes, not on the plains."
 fpw_eng_x_masterly_inactivity:0 "Masterly Inactivity"
 fpw_eng_x_masterly_inactivity_desc:0 "India will be strengthened from within; Afghanistan will be left alone."
 fpw_eng_x_commune_refugees:0 "The Communard Exiles"
 fpw_eng_x_commune_refugees_desc:0 "Thousands of refugees from Paris live in Soho and Fitzrovia, debating the next revolution."
 fpw_eng_x_bengal_relief:0 "Temple's Famine Relief"
 fpw_eng_x_bengal_relief_desc:0 "Rice from Burma feeds Bengal at the Government's expense."
 fpw_eng_x_kimberley:0 "The Big Hole"
 fpw_eng_x_kimberley_desc:0 "The diggers of Kimberley are tearing the richest square mile on earth apart."
 fpw_eng_x_livingstone:0 "Dr Livingstone, I Presume"
 fpw_eng_x_livingstone_desc:0 "The whole nation is gripped by the meeting at Ujiji."
 fpw_eng_b_stormy_session:0 "A Stormy Session"
 fpw_eng_b_stormy_session_desc:0 "Obstruction, all-night sittings and angry divisions are wearing down the government's business."
 fpw_eng_b_treasury_squeeze:0 "The Treasury Squeeze"
 fpw_eng_b_treasury_squeeze_desc:0 "The Chancellor guards every shilling, and every department feels the pinch."
 fpw_eng_b_vested_interests:0 "Vested Interests"
 fpw_eng_b_vested_interests_desc:0 "Those who profit from the old ways are fighting the change in the lobbies, the press and the clubs."
 fpw_eng_b_strike_wave:0 "Strike Wave"
 fpw_eng_b_strike_wave_desc:0 "The men have downed tools across the district, and the masters will not yield."
 fpw_eng_b_retooling:0 "Retooling the Works"
 fpw_eng_b_retooling_desc:0 "New machinery and new methods mean months of disruption before the gains arrive."
 fpw_eng_b_army_upheaval:0 "The Army in Upheaval"
 fpw_eng_b_army_upheaval_desc:0 "Regiments are being reorganised, depots moved and officers reshuffled."
 fpw_eng_b_dockyard_upheaval:0 "Dockyard Upheaval"
 fpw_eng_b_dockyard_upheaval_desc:0 "Slips are being rebuilt and gangs reorganised; the yards work at half pace."
 fpw_eng_b_diplomatic_friction:0 "Diplomatic Friction"
 fpw_eng_b_diplomatic_friction_desc:0 "Foreign chancelleries resent Britain's latest move, and say so."
 fpw_eng_b_colonial_overstretch:0 "Colonial Overstretch"
 fpw_eng_b_colonial_overstretch_desc:0 "Too many garrisons, too few battalions, and too many distant crises at once."
 fpw_eng_b_public_outcry:0 "Public Outcry"
 fpw_eng_b_public_outcry_desc:0 "Indignation meetings, angry leaders in the newspapers and petitions by the cartload."
 fpw_eng_b_church_controversy:0 "Church Controversy"
 fpw_eng_b_church_controversy_desc:0 "Churchmen and Dissenters are at each other's throats, and Parliament is dragged into the quarrel."
 fpw_eng_b_war_of_ideas:0 "A War of Ideas"
 fpw_eng_b_war_of_ideas_desc:0 "Pulpits, lecture halls and reviews ring with controversy over the new learning."
 fpw_eng_b_frontier_unrest:0 "Frontier Unrest"
 fpw_eng_b_frontier_unrest_desc:0 "Raids, risings and disputed borders keep the outposts of empire on edge."
 fpw_eng_b_agricultural_distress:0 "Agricultural Distress"
 fpw_eng_b_agricultural_distress_desc:0 "Low prices, poor harvests and restless labourers trouble the countryside."
 fpw_eng_b_city_jitters:0 "Jitters in the City"
 fpw_eng_b_city_jitters_desc:0 "Bank rate is up and the money market is nervous."
 fpw_eng_b_court_scandal:0 "Talk of the Court"
 fpw_eng_b_court_scandal_desc:0 "The clubs and the cheap papers are full of gossip about the royal family."
 fpw_eng_b_police_powers:0 "Strong Police Powers"
 fpw_eng_b_police_powers_desc:0 "Radicals and libertarians protest that the liberty of the subject is being sacrificed to order."
 fpw_eng_b_navvy_shortage:0 "Shortage of Navvies"
 fpw_eng_b_navvy_shortage_desc:0 "Every contractor in the kingdom is bidding for the same gangs of labourers."
 fpw_eng_b_epidemic:0 "A Sickly Season"
 fpw_eng_b_epidemic_desc:0 "Cholera and fever are abroad in the crowded districts."
 fpw_eng_b_naval_panic:0 "Naval Panic"
 fpw_eng_b_naval_panic_desc:0 "Alarmists insist the Navy is unready, and the Admiralty is under siege."
