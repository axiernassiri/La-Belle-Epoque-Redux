l_english:
  news_fpw.1.t:0 "Crisis in Germany!"
  news_fpw.1.d:0 "Tensions between [PRS.GetNameDef] and [AUS.GetNameDef] have reached a breaking point following the crisis over Holstein. A last attempt at diplomacy in Frankfurt, where the German states convened to resolve the dispute, ended in failure. The assembly voted 16 to 9 in favor of allowing [AUS.GetNameDef] to mobilize against [PRS.GetNameDef], citing Prussias unilateral seizure of Holstein as a violation of the Gastein Convention and an attack on the sovereignty of the Confederation. With Austrian troops now gathering along the Bohemian border and Prussia refusing to back down, war seems inevitable."
  news_fpw.1.a:0 "Germany stands at the brink."
  news_fpw.1.b:0 "Prussia must unite Germany!"
  news_fpw.1.c:0 "Austria will defend its rightful place!"
  
  news_fpw.2.t:0 "The [FRA.GetName] has collapsed"
  news_fpw.2.d:0 "Following the recent events in the Franco-Prussian War, the [FRA.GetAdjective] Emperor Napoleon III has been captured in Sedan! When this message reached the population of France, the Republicans have called out the Third French Republic. Will this end the horrors of war in France?"
  news_fpw.2.a:0 "When will the war finally end?"
  news_fpw.2.b:0 "Will we finally unite our people?"
  news_fpw.2.c:0 "Vive la République!"
  
  news_fpw.3.t:0 "The [FRA.GetAdjective] Provisional Government has resigned!"
  news_fpw.3.d:0 "The [FRA.GetAdjective] Provisional Government has resigned from its position, but before that, a ceasefire all over France has been ordered. This means that, at least for now, peace has come again over the European continent."
  news_fpw.3.a:0 "Is this the end of the war?"
  news_fpw.3.b:0 "Finally, we will win!"
  news_fpw.3.c:0 "Damné!"

  news_fpw.4.t:0 "Luxembourg Crisis"
  news_fpw.4.d:0 "War looms after [FRA.GetNameDef] attempts to buy [LUX.GetNameDef]. The tension arises as [PRS.GetNameDef] tries to intervene in the purchase of the small duchy of Luxembourg."
  news_fpw.4.a:0 "Let's see where this is going"

  news_fpw.11.t:0 "[PRS.GetNameDefCap] Unites Northern Germany!"
  news_fpw.11.d:0 "With Austria's influence pushed out of German affairs and [PRS.GetLeader] at the helm, the dream of a Prussian-led Germany seems closer than ever. Meanwhile, southern German states remain independent but closely watch these developments, will they be next to join this new German nation?"
  news_fpw.11.a:0 "A new Germany rises!"
  news_fpw.11.b:0 "Prussian dominance is complete."
  news_fpw.11.c:0 "Dark days for Austria..."
  news_fpw.11.e:0 "Dark days for Europe..."

  news_fpw.12.t:0 "France Humiliated After Ems Incident?"
  news_fpw.12.d:0 "A diplomatic exchange in Bad Ems has escalated into crisis after Prussia published a report on a tense meeting between King Wilhelm I and French ambassador Count Benedetti. According to Prussia, Benedetti repeatedly pressed the King to renounce any Hohenzollern claim to the Spanish throne, but the King refused to make binding commitments. Chancellor [PRS.GetLeader] later released an edited version of the exchange, stating it \"revealed the pressure France attempted to exert on Prussia.\" In Paris, [FRA.GetLeader]'s government saw it as a calculated insult, fueling outrage. With tensions rising, many fear this could push France and Prussia to war."
  news_fpw.12.a:0 "Is war coming?"
  news_fpw.12.b:0 "Let's see how France reacts."
  news_fpw.12.c:0 "Damn Prussian liars!"
  news_fpw.4.a:0 "Let’s see where this is going"
  news_fpw.13.d:0 "The Afghan Civil War has finally come to a close after Sher Ali Khan led his armies onto kabul while crushing the rebellion. [AFG.GetNameDef] has finally been stabilized after many long years, and with the death of Sher Ali Khan's brother, the leader of the rebellion, the rebels have laid down their arms."
  news_fpw.14.d:0 "[AFG.GetNameDef] has proclaim the restoration of the Durrani Empire. The Durrani Empire which had previously collapsed because of internal conflict and the start of the Afghan Civil War."
  news_fpw.15.d:0 "[AFG.GetNameDef] after conquering Arabia and the Ottoman Sultanate, have now claimed the title of the caliph. There was no muslim nation that could oppose the [AFG.GetNameDef]."
  news_fpw.16.d:0 "[AFG.GetNameDef] after defeating most of the major powers of the world, have now proclaim their ambitions to conquer the rest of the world. They have proclaim a new world order and are trying to unite the entire world."
  news_fpw.17.d:0 "The Anglo-Afghan war started when tensions began to rise between [AFG.GetNameDef] and [ENG.GetNameDef]. This all climax when war was declared"
  news_fpw.13.a:0 "Great."
  news_fpw.13.b:0 "Another Area To Expand Influence."
  news_fpw.13.c:0 "Ok."
  news_fpw.14.a:0 "Great."
  news_fpw.14.b:0 "Will History Repeat Itself?"
  news_fpw.15.a:0 "Great."
  news_fpw.15.b:0 "Ok."
  news_fpw.16.a:0 "Great."
  news_fpw.16.b:0 "You Think We Will Let You?"
  news_fpw.17.a:0 "We WILL Defend Our Homeland"
  news_fpw.17.b:0 "Another Addition to My Empire."
  news_fpw.17.c:0 "We Will Crush You"
  news_fpw.17.d:0 "Ok."
  news_fpw.13.t:0 "Afghan Civil War Ends"
  news_fpw.14.t:0 "Durrani Empire Restored"
  news_fpw.15.t:0 "Title of Caliph Seized"
  news_fpw.16.t:0 "New World Order Proclaimed"
  news_fpw.17.t:0 "The Anglo-Afghan War"

  news_fpw.18.t:0 "The Age of Flight"
  news_fpw.18.d:0 "The Aeronautical Society of Great Britain has been established in London, bringing together a number of gentlemen interested in the advancement of human flight. Though the prospect of heavier-than-air machines carrying passengers remains distant, the society intends to encourage scientific investigation into the principles of aeronautics. Its formation has been welcomed by enthusiasts who believe that the conquest of the skies may one day become a reality."
  news_fpw.18.a:0 "An interesting undertaking."
  news_fpw.18.b:0 "A foolish pursuit of impossible dreams."

  news_fpw.19.t:0 "A Woman Enters the Dental Profession"
  news_fpw.19.d:0 "Lucy Hobbs Taylor has graduated from the Ohio College of Dental Surgery, becoming the first woman in the United States to receive a Doctor of Dental Surgery degree. Her achievement marks a remarkable development in the medical profession, where women have long faced considerable obstacles to formal education. Her accomplishment has attracted attention among advocates of greater opportunities for women in the learned professions."
  news_fpw.19.a:0 "A remarkable achievement."
  news_fpw.19.b:0 "Such matters ought to remain unchanged."


  news_fpw.20.t:0 "A New Society for the Protection of Animals"
  news_fpw.20.d:0 "A new organisation dedicated to the prevention of cruelty towards animals has been established in New York City. Founded by Henry Bergh, the American Society for the Prevention of Cruelty to Animals intends to combat the mistreatment of domestic animals and promote more humane practices. The organisation hopes to bring greater public attention to a cause which has received comparatively little formal consideration."
  news_fpw.20.a:0 "A worthy cause."
  news_fpw.20.b:0 "Surely there are greater concerns."


  news_fpw.21.t:0 "The Death of John McDouall Stuart"
  news_fpw.21.d:0 "John McDouall Stuart, one of the most celebrated explorers of the Australian continent, has died in London at the age of fifty. Stuart is remembered for his remarkable expeditions across the Australian interior, most notably his successful journey from south to north in 1862. His explorations greatly expanded European geographical knowledge of the continent, and his achievements will be remembered by generations of explorers."
  news_fpw.21.a:0 "His achievements shall be remembered."
  news_fpw.21.b:0 "Another explorer lost to the wilderness."

  news_fpw.22.t:0 "A Cable Across the Atlantic"
  news_fpw.22.d:0 "After years of unsuccessful attempts and considerable technical difficulties, a transatlantic telegraph cable has finally been successfully laid between Europe and North America. The enormous undertaking, carried out by the steamship Great Eastern, promises to transform international communications by allowing messages to cross the Atlantic in minutes rather than weeks. The achievement is being celebrated as one of the greatest engineering accomplishments of the age."
  news_fpw.22.a:0 "The world grows smaller."
  news_fpw.22.b:0 "An expensive undertaking with uncertain benefits."



  news_fpw.23.t:0 "A Great Fire in Quebec"
  news_fpw.23.d:0 "A devastating fire has swept through the city of Quebec, destroying more than twelve hundred houses in the districts of Saint-Roch and Saint-Sauveur. The flames have spread rapidly through densely populated neighbourhoods, leaving thousands of inhabitants without shelter. Emergency efforts have struggled to contain the disaster, while local authorities face the enormous task of providing assistance to those affected and rebuilding the damaged districts."
  news_fpw.23.a:0 "A terrible tragedy."
  news_fpw.23.b:0 "A dreadful reminder of the dangers of urban life."


  news_fpw.24.t:0 "Disaster at the Oaks Colliery"
  news_fpw.24.d:0 "A catastrophic explosion has ripped through the Oaks Colliery near Barnsley, England, trapping hundreds of miners beneath the ground. The blast has devastated the underground workings and destroyed much of the mine's infrastructure, while rescue parties have struggled to reach those still trapped. Further explosions on the following day have claimed the lives of rescuers as well. With 361 lives ultimately lost, the disaster stands among the deadliest mining catastrophes in British history."
  news_fpw.24.a:0 "A dreadful loss of life."
  news_fpw.24.b:0 "The price of industrial progress is becoming unbearable."

  news_fpw.25.t:0 "The World's Longest Suspension Bridge"
  news_fpw.25.d:0 "A remarkable feat of engineering has been completed in the United States, as the new suspension bridge spanning the Ohio River between Cincinnati and Covington officially opens to public traffic. Designed by the engineer John A. Roebling, the enormous structure boasts a central span of over one thousand feet, making it the longest suspension bridge in the world. Its completion represents a significant achievement in modern engineering and promises to improve transportation and commerce between the two communities."
  news_fpw.25.a:0 "An extraordinary feat of engineering."
  news_fpw.25.b:0 "An expensive bridge is hardly a wonder."

  news_fpw.26.t:0 "The Blue Danube Makes Its Debut"
  news_fpw.26.d:0 "A new waltz composed by the Austrian musician Johann Strauss II has been performed for the first time in Vienna. Entitled An der schönen blauen Donau, or The Blue Danube, the composition has been introduced before an audience of music enthusiasts and members of Viennese society. Although its initial reception has been somewhat mixed, the work possesses a distinctive melody and may yet find its way into the finest ballrooms and concert halls of Europe."
  news_fpw.26.a:0 "A beautiful addition to European music."
  news_fpw.26.b:0 "Another forgettable ballroom composition."

  news_fpw.27.t:0 "A New Approach to Surgery"
  news_fpw.27.d:0 "An important medical paper by the British surgeon Joseph Lister has appeared in the prestigious medical journal The Lancet. Entitled \"On the Antiseptic Principle in the Practice of Surgery\", the publication describes his methods of using carbolic acid to prevent infection in surgical wounds. Lister's work challenges established medical practices, which have long struggled with the dangers of postoperative infections. If his methods prove successful, they may fundamentally transform the practice of surgery."
  news_fpw.27.a:0 "A promising advancement in medicine."
  news_fpw.27.b:0 "An unnecessary complication of established medical practice."

  news_fpw.28.t:0 "The Great Exhibition of Paris"
  news_fpw.28.d:0 "The International Exposition has officially opened in Paris, bringing together an extraordinary collection of industrial inventions, artistic creations and technological achievements from across the world. Occupying an enormous exhibition complex on the Champ de Mars, the event showcases the latest developments in machinery, transportation, architecture and the decorative arts. Thousands of exhibitors have assembled to demonstrate the achievements of their respective nations, while visitors from across Europe and beyond are expected to attend in great numbers."
  news_fpw.28.a:0 "A magnificent celebration of human achievement."
  news_fpw.28.b:0 "A costly spectacle of vanity and extravagance."

  news_fpw.29.t:0 "A New Explosive Enters the Market"
  news_fpw.29.d:0 "The Swedish inventor Alfred Nobel has secured a British patent for a new explosive substance known as dynamite. Developed through experiments involving nitroglycerin and a porous siliceous material, the invention offers a more manageable means of handling an otherwise highly dangerous explosive. Its potential applications in mining, construction and large-scale engineering have attracted considerable interest among industrialists. The discovery may prove invaluable to the expansion of modern industry, although concerns regarding its destructive capabilities are already being raised."
  news_fpw.29.a:0 "A tremendous opportunity for industry."
  news_fpw.29.b:0 "Humanity has little need for more explosives."

  news_fpw.30.t:0 "A Railway Disaster at Bray Head"
  news_fpw.30.d:0 "A tragic railway accident has occurred along the coast of County Wicklow in Ireland, when a passenger train travelling from Enniscorthy towards Dublin derailed while crossing a viaduct near Bray Head. The locomotive and several carriages plunged into a ravine, resulting in the deaths of two passengers and injuries to many others. The incident has raised serious concerns regarding the safety of railway infrastructure, particularly along difficult coastal routes where engineering challenges remain considerable."
  news_fpw.30.a:0 "A terrible tragedy for the passengers."
  news_fpw.30.b:0 "The railways must answer for their negligence."

  news_fpw.31.t:0 "A New Work of Political Economy"
  news_fpw.31.d:0 "A substantial new work by the German philosopher and economist Karl Marx has been published in Hamburg. Entitled Das Kapital, the first volume examines the workings of capitalist production, the accumulation of wealth and the relationship between labour and capital. The publication has already attracted attention among intellectual circles and is expected to provoke considerable discussion among economists, philosophers and social commentators throughout Europe."
  news_fpw.31.a:0 "An important contribution to economic thought."
  news_fpw.31.b:0 "Another radical theory with little practical value."

  news_fpw.32.t:0 "The End of Transportation to Australia"
  news_fpw.32.d:0 "The final convict ship to depart from Britain for Western Australia has set sail from Portsmouth. The vessel, Hougoumont, carries a number of prisoners, including several Irish political offenders, on what is expected to be an approximately three-month voyage. Its departure marks the conclusion of the long-established British practice of transporting convicted criminals to Australia, a system that has shaped the development of several Australian settlements for generations."
  news_fpw.32.a:0 "An important chapter of history comes to an end."
  news_fpw.32.b:0 "Britain has merely abandoned an effective punishment."

