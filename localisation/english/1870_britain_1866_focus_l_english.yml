l_english:
 ENG_the_reform_question:0 "The Reform Question"
 ENG_the_reform_question_desc:0 "Palmerston is dead, and with him the long truce over the franchise. Lord Russell and Mr Gladstone have brought in a modest Reform Bill, and the country is watching to see whether Parliament will widen the door to the working man."
 ENG_collapse_of_liberal_government:0 "The Cave of Adullam"
 ENG_collapse_of_liberal_government_desc:0 "Robert Lowe and his 'Adullamites' have deserted the government and the Reform Bill has been wrecked in committee. Lord Russell resigns, and Lord Derby forms a minority Conservative ministry."
 ENG_russell_carries_on:0 "Russell Carries On"
 ENG_russell_carries_on_desc:0 "The Prime Minister refuses to be driven out by a cabal of his own backbenchers. The Liberal ministry limps on, its authority bruised but intact."
 ENG_derby_ministry:0 "The Fourteenth Earl"
 ENG_derby_ministry_desc:0 "Edward Smith-Stanley, Earl of Derby, takes office for the third time. Gout-ridden and ageing, he leaves the management of the Commons to his Chancellor, Benjamin Disraeli."
 ENG_gladstone_leads_the_commons:0 "Gladstone Leads the Commons"
 ENG_gladstone_leads_the_commons_desc:0 "With Russell in the Lords, Gladstone carries the government in the Commons. His oratory and his appetite for work make him the coming man of Liberalism."
 ENG_dish_the_whigs:0 "Dish the Whigs"
 ENG_dish_the_whigs_desc:0 "Disraeli means to take reform from the Liberals and make it a Tory measure. If the franchise must be widened, let it be widened by a Conservative hand and to Conservative advantage."
 ENG_tory_retrenchment:0 "Tory Retrenchment"
 ENG_tory_retrenchment_desc:0 "A minority government cannot afford extravagance. Economies in the estimates will steady the Treasury and reassure the country gentlemen."
 ENG_liberal_reform_bill:0 "A Liberal Reform Bill"
 ENG_liberal_reform_bill_desc:0 "A fresh Bill, better drafted and better whipped, will extend the borough franchise and show that the Liberal party keeps its promises."
 ENG_adullamite_compromise:0 "Conciliate the Adullamites"
 ENG_adullamite_compromise_desc:0 "Lowe's rebels can be brought back into the fold with patience and concessions on the rating qualification. Unity before purity."
 ENG_second_reform_act:0 "The Second Reform Act"
 ENG_second_reform_act_desc:0 "Household suffrage in the boroughs and a lodger franchise will nearly double the electorate. Derby called it 'a leap in the dark'; we shall see where we land."
 ENG_progressive_thinking:0 "On Liberty"
 ENG_progressive_thinking_desc:0 "John Stuart Mill now sits for Westminster. The philosopher of liberty has brought his arguments into the House itself."
 ENG_support_social_critics:0 "Culture and Anarchy"
 ENG_support_social_critics_desc:0 "Matthew Arnold warns that a nation of Philistines, Barbarians and Populace needs 'sweetness and light' as much as it needs votes."
 ENG_support_womens_suffrage:0 "Mill's Amendment"
 ENG_support_womens_suffrage_desc:0 "Mill proposes to replace the word 'man' with 'person' in the Reform Bill. The House will laugh, but seventy-three members will vote with him."
 ENG_kensington_society:0 "The Kensington Society"
 ENG_kensington_society_desc:0 "Educated women such as Emily Davies and Barbara Bodichon are organising, petitioning and founding colleges. Their energy is a national asset."
 ENG_conservative_working_men:0 "Conservative Working Men"
 ENG_conservative_working_men_desc:0 "The new voters need not all be Liberals. Conservative Working Men's Associations can bind the artisan to Church, Crown and Constitution."
 ENG_expansion_of_the_franchise:0 "Redistribution of Seats"
 ENG_expansion_of_the_franchise_desc:0 "Rotten boroughs must give way to the great towns. A redistribution of seats will make the new franchise mean something."
 ENG_1868_elections:0 "The General Election of 1868"
 ENG_1868_elections_desc:0 "The first election on the new franchise will decide who governs Britain. The outcome depends on the strength of the parties in the country."
 ENG_gladstones_first_ministry:0 "Gladstone's First Ministry"
 ENG_gladstones_first_ministry_desc:0 "'My mission is to pacify Ireland.' Gladstone takes office at the head of a great reforming majority."
 ENG_mission_to_pacify_ireland:0 "My Mission is to Pacify Ireland"
 ENG_mission_to_pacify_ireland_desc:0 "The Prime Minister has made Ireland the first business of his government. The Irish Question will receive the full attention of the Cabinet."
 ENG_peace_retrenchment_reform:0 "Peace, Retrenchment and Reform"
 ENG_peace_retrenchment_reform_desc:0 "Low taxes, cheap government and a foreign policy that avoids adventures: the creed of Gladstonian Liberalism."
 ENG_open_civil_service:0 "Open Competition"
 ENG_open_civil_service_desc:0 "Patronage will give way to examination. From now on, entry to most of the civil service will be by open competition."
 ENG_licensing_act:0 "The Licensing Act"
 ENG_licensing_act_desc:0 "Restricting the hours of public houses will please the temperance movement and enrage the brewers. 'Borne down in a torrent of gin and beer', a future Liberal may say."
 ENG_the_ballot_act:0 "The Ballot Act"
 ENG_the_ballot_act_desc:0 "The secret ballot will end the bribery and intimidation of the hustings. A man's vote will at last be his own."
 ENG_university_tests_act:0 "Abolish the University Tests"
 ENG_university_tests_act_desc:0 "Oxford, Cambridge and Durham will no longer demand Anglican conformity of their students and fellows."
 ENG_judicature_acts:0 "The Judicature Acts"
 ENG_judicature_acts_desc:0 "Lord Selborne's great reform will fuse common law and equity into a single Supreme Court of Judicature."
 ENG_liberal_ascendancy:0 "The Liberal Ascendancy"
 ENG_liberal_ascendancy_desc:0 "The work of reform has transformed the state. The Liberal party now stands as the natural party of government."
 ENG_disraelis_tory_democracy:0 "Tory Democracy"
 ENG_disraelis_tory_democracy_desc:0 "Disraeli has proved that the working man can be a Conservative. The party of the land will now become the party of the nation."
 ENG_one_nation:0 "One Nation"
 ENG_one_nation_desc:0 "Disraeli once wrote of 'two nations, the rich and the poor'. A Conservative government will work to make them one."
 ENG_conservative_central_office:0 "Conservative Central Office"
 ENG_conservative_central_office_desc:0 "John Gorst's new party machine will register voters, train agents and fight every seat."
 ENG_crystal_palace_speech:0 "The Crystal Palace Speech"
 ENG_crystal_palace_speech_desc:0 "The great question, Disraeli declares, is whether England will be a comfortable little country or a great country, an imperial country."
 ENG_sanitas_sanitatum:0 "Sanitas Sanitatum, Omnia Sanitas"
 ENG_sanitas_sanitatum_desc:0 "The health of the people is the first duty of a statesman. Sewers, water and clean air will win more votes than speeches."
 ENG_defend_church_and_crown:0 "Defend Church and Crown"
 ENG_defend_church_and_crown_desc:0 "Against the Radicals who would disestablish the Church and the republicans who mock the Queen, the Conservative party stands firm."
 ENG_imperial_programme:0 "An Imperial Programme"
 ENG_imperial_programme_desc:0 "The colonies are not a burden to be shed but an empire to be consolidated. The government will bind them closer to the mother country."
 ENG_artisans_dwellings:0 "Housing the Working Classes"
 ENG_artisans_dwellings_desc:0 "Slum clearance and decent artisans' dwellings will give practical meaning to Tory Democracy."
 ENG_tory_ascendancy:0 "The Tory Ascendancy"
 ENG_tory_ascendancy_desc:0 "Conservatism has renewed itself on a popular foundation. The party of Pitt and Peel is once again the party of the nation."
 ENG_1874_elections:0 "The General Election of 1874"
 ENG_1874_elections_desc:0 "Parliament has run its course. The country will once more decide who governs."
 ENG_victorian_constitution:0 "The Mid-Victorian Constitution"
 ENG_victorian_constitution_desc:0 "Crown, Lords and Commons in balance, two great parties alternating in power, and the rule of law above all: the envy of Europe."
 ENG_convene_an_order_in_council:0 "Convene an Order in Council"
 ENG_convene_an_order_in_council_desc:0 "No party commands the House and the Queen's government must be carried on. Her Majesty will govern through her Privy Council until order is restored."
 ENG_victorias_cabinet:0 "The Queen's Cabinet"
 ENG_victorias_cabinet_desc:0 "The Queen will choose her own ministers, not from the parties but from men of proven loyalty to the Crown."
 ENG_privy_council_rule:0 "Rule Through the Privy Council"
 ENG_privy_council_rule_desc:0 "Orders in Council will do the work that a paralysed Parliament cannot."
 ENG_loyal_peers:0 "The Lords Stand with the Crown"
 ENG_loyal_peers_desc:0 "The great territorial magnates have rallied to the sovereign against the chaos of the Commons."
 ENG_prorogue_parliament:0 "Prorogue Parliament"
 ENG_prorogue_parliament_desc:0 "Parliament is prorogued sine die. The radicals and the Commons men will not accept it quietly. This means civil war."
 ENG_empress_and_queen:0 "Empress and Queen"
 ENG_empress_and_queen_desc:0 "The Crown has triumphed. Victoria reigns as no British monarch has since the Stuarts."
 ENG_condition_of_england:0 "The Condition of England"
 ENG_condition_of_england_desc:0 "Carlyle's question has not been answered. The richest nation on earth houses its workers in cellars and courts."
 ENG_sanitary_reform:0 "The Sanitary Act"
 ENG_sanitary_reform_desc:0 "After the cholera of 1866, local authorities will be compelled to provide sewers, water and the removal of nuisances."
 ENG_factory_acts_extension:0 "Factory Acts Extension Act"
 ENG_factory_acts_extension_desc:0 "The protections of the textile mills will be extended to every workplace employing fifty hands or more."
 ENG_contagious_diseases_act:0 "The Contagious Diseases Acts"
 ENG_contagious_diseases_act_desc:0 "To protect the health of soldiers and sailors, women in garrison towns may be compulsorily examined. The measure is effective and deeply controversial."
 ENG_public_health_act:0 "The Public Health Act"
 ENG_public_health_act_desc:0 "Every part of the country will be placed under a sanitary authority with a medical officer of health."
 ENG_workshop_regulation:0 "Workshop Regulation Act"
 ENG_workshop_regulation_desc:0 "Small workshops, where children and women toil longest, will now come under inspection."
 ENG_national_education_league:0 "The National Education League"
 ENG_national_education_league_desc:0 "From Birmingham, Joseph Chamberlain and George Dixon demand free, compulsory and unsectarian schooling for every child."
 ENG_ladies_national_association:0 "The Ladies' National Association"
 ENG_ladies_national_association_desc:0 "Josephine Butler leads a campaign of women against the Contagious Diseases Acts, a crusade that shocks and stirs the country."
 ENG_local_government_board:0 "The Local Government Board"
 ENG_local_government_board_desc:0 "Poor law, public health and local administration will be gathered under one department of state."
 ENG_elementary_education_act:0 "Forster's Education Act"
 ENG_elementary_education_act_desc:0 "Elected school boards will fill the gaps left by the voluntary schools, so that every child in England and Wales may be taught."
 ENG_voluntary_schools:0 "Defend the Voluntary Schools"
 ENG_voluntary_schools_desc:0 "The Church schools have educated the poor for generations. Greater grants, not godless board schools, are the answer."
 ENG_married_womens_property_act:0 "Married Women's Property Act"
 ENG_married_womens_property_act_desc:0 "A wife will at last be entitled to keep her own earnings, a modest but historic breach in the law of coverture."
 ENG_trade_union_question:0 "The Royal Commission on Trade Unions"
 ENG_trade_union_question_desc:0 "After the Sheffield outrages, a Royal Commission must decide whether the unions are conspiracies or lawful associations."
 ENG_trade_union_act:0 "Legalise the Trade Unions"
 ENG_trade_union_act_desc:0 "The unions will be given legal recognition and the protection of their funds, and peaceful picketing will be permitted."
 ENG_criminal_law_amendment:0 "The Criminal Law Amendment Act"
 ENG_criminal_law_amendment_desc:0 "The unions may be lawful, but molestation and obstruction will be crimes. In practice picketing becomes almost impossible."
 ENG_nine_hours_movement:0 "The Nine Hours Movement"
 ENG_nine_hours_movement_desc:0 "The engineers of the North-East demand a nine-hour working day. How the country answers will shape industrial relations for a generation."
 ENG_the_age_of_improvement:0 "The Age of Improvement"
 ENG_the_age_of_improvement_desc:0 "Schools, sewers and lawful unions: Victorian Britain has begun to civilise the industrial revolution it unleashed."
 ENG_undermine_the_government:0 "The International Workingmen's Association"
 ENG_undermine_the_government_desc:0 "From its London headquarters the International, with Marx in its council and George Odger as its president, calls on British labour to act for itself."
 ENG_concessions_to_the_workers:0 "Wring Concessions from the Masters"
 ENG_concessions_to_the_workers_desc:0 "Every strike won is a lesson in power. The working class must learn its strength."
 ENG_assert_the_rights_of_trade_unions:0 "Assert the Rights of Labour"
 ENG_assert_the_rights_of_trade_unions_desc:0 "Labour will no longer beg Parliament for its rights. It will take them."
 ENG_organise_strikes_focus:0 "Organise the Strikes"
 ENG_organise_strikes_focus_desc:0 "Coordinated strikes in London and the industrial North will show the governing classes who keeps the country running."
 ENG_disrupt_legislative_process:0 "Disrupt Parliament"
 ENG_disrupt_legislative_process_desc:0 "A Parliament of landlords and millowners cannot be allowed to legislate against the people."
 ENG_societal_restructure:0 "A New Social Order"
 ENG_societal_restructure_desc:0 "The workshops, the land and the banks belong by right to those who labour."
 ENG_revolution_of_the_proletariat:0 "The British Commune"
 ENG_revolution_of_the_proletariat_desc:0 "What Paris attempted, London will achieve. The workers rise, and the old order will fight for its life."
 ENG_workshop_of_the_world:0 "The Workshop of the World"
 ENG_workshop_of_the_world_desc:0 "Britain mines half the world's coal and spins half its cotton. Our task is to keep it so."
 ENG_black_friday:0 "Black Friday"
 ENG_black_friday_desc:0 "The failure of Overend, Gurney and Company has shaken the City to its foundations. Confidence must be restored."
 ENG_industrial_sector:0 "Industrial Expansion"
 ENG_industrial_sector_desc:0 "New mills, foundries and engine works rise in every manufacturing town."
 ENG_encourage_international_trade:0 "The Free Trade Consensus"
 ENG_encourage_international_trade_desc:0 "Since the Cobden-Chevalier treaty, free trade has been the creed of the nation. Cheap bread and open markets are Britain's strength."
 ENG_reintroduce_corn_laws:0 "Fair Trade and Protection"
 ENG_reintroduce_corn_laws_desc:0 "Foreign tariffs rise while Britain keeps her ports open. Some now argue for 'fair trade' and protection of home industry."
 ENG_agricultural_sector:0 "High Farming"
 ENG_agricultural_sector_desc:0 "Drainage, fertilisers and steam ploughs have brought a golden age to English agriculture."
 ENG_suspend_bank_charter_act:0 "Suspend the Bank Charter Act"
 ENG_suspend_bank_charter_act_desc:0 "The Treasury will authorise the Bank of England to exceed its legal note issue, as in 1847 and 1857, to end the panic."
 ENG_let_the_market_clear:0 "Let the Market Clear"
 ENG_let_the_market_clear_desc:0 "Rescuing reckless bankers rewards recklessness. Let the unsound houses fail, and the sound ones will prosper."
 ENG_fill_the_factories:0 "Expand the Arsenals and Mills"
 ENG_fill_the_factories_desc:0 "Engineering works that can build locomotives can build guns. Industrial capacity is national strength."
 ENG_bessemer_steel:0 "The Bessemer Process"
 ENG_bessemer_steel_desc:0 "Cheap steel from Sheffield's converters will transform rails, ships and guns."
 ENG_merchant_marine:0 "Britannia's Merchant Fleet"
 ENG_merchant_marine_desc:0 "Iron steamers from the Clyde and the Tyne carry the world's goods under the red ensign."
 ENG_cattle_plague:0 "The Cattle Plague"
 ENG_cattle_plague_desc:0 "Rinderpest has killed hundreds of thousands of cattle. Slaughter and quarantine must stamp it out."
 ENG_increase_resource_output:0 "King Coal of South Wales"
 ENG_increase_resource_output_desc:0 "Steam coal from the Rhondda fuels the world's navies and merchant fleets."
 ENG_lombard_street:0 "The Lender of Last Resort"
 ENG_lombard_street_desc:0 "As Walter Bagehot argues, in a panic the Bank of England must lend freely, at a high rate, against good security."
 ENG_coal_is_king:0 "Coal is King"
 ENG_coal_is_king_desc:0 "Jevons warns that our prosperity rests on coal. Then let us dig it, and dig it well."
 ENG_textile_industry_in_lancashire:0 "Recovery from the Cotton Famine"
 ENG_textile_industry_in_lancashire_desc:0 "With American cotton flowing again after the Civil War, the mills of Lancashire can return to full time."
 ENG_steel_and_ironworks:0 "Sheffield and Middlesbrough"
 ENG_steel_and_ironworks_desc:0 "The ironmasters of Teesside and the steelmakers of Sheffield lead the world."
 ENG_telegraph_cables:0 "The Atlantic Telegraph"
 ENG_telegraph_cables_desc:0 "The Great Eastern has laid a working cable to Newfoundland. London now speaks to New York in minutes."
 ENG_mine_tungsten_in_plymouth:0 "Cornish Tin and Wolfram"
 ENG_mine_tungsten_in_plymouth_desc:0 "The mines of Cornwall and Devon still yield tin, copper and wolfram."
 ENG_city_of_london:0 "Capital of World Finance"
 ENG_city_of_london_desc:0 "Bills on London finance the trade of every continent. The City is the clearing house of the world."
 ENG_railway_network:0 "The Railway Network"
 ENG_railway_network_desc:0 "Branch lines, new termini and the Midland's St Pancras will complete the finest railway system on earth."
 ENG_machine_tools:0 "Whitworth Standards"
 ENG_machine_tools_desc:0 "Standard screw threads and precision machine tools make interchangeable manufacture possible."
 ENG_global_trade_network:0 "Invisible Exports"
 ENG_global_trade_network_desc:0 "Shipping, insurance and banking earn Britain as much as her factories."
 ENG_overseas_investment:0 "Investment Abroad"
 ENG_overseas_investment_desc:0 "British capital builds railways in Argentina, India and the United States, and the dividends flow home."
 ENG_engineering_excellence:0 "Engineering Excellence"
 ENG_engineering_excellence_desc:0 "From Armstrong's guns to Penn's engines, British engineering sets the standard for the world."
 ENG_the_empire_is_booming:0 "The Great Victorian Boom"
 ENG_the_empire_is_booming_desc:0 "Production, trade and investment have never been higher. The mid-Victorian boom is at its peak."
 ENG_the_army_question:0 "The State of the Army"
 ENG_the_army_question_desc:0 "The army that won in the Crimea and India is small, scattered and old-fashioned. Prussia's victory at Königgrätz is a warning."
 ENG_snider_enfield:0 "Adopt the Snider-Enfield"
 ENG_snider_enfield_desc:0 "Jacob Snider's conversion turns the Enfield rifle-musket into a breech-loader, quickly and cheaply."
 ENG_army_estimates:0 "The Army Estimates"
 ENG_army_estimates_desc:0 "The House must be persuaded to pay for an efficient army without paying for an expensive one."
 ENG_volunteer_force:0 "The Volunteer Force"
 ENG_volunteer_force_desc:0 "The rifle volunteers raised in the invasion scare of 1859 are 170,000 strong. They must be trained and equipped."
 ENG_rml_artillery:0 "Rifled Muzzle-Loaders"
 ENG_rml_artillery_desc:0 "Armstrong's breech-loaders have proved troublesome. The Ordnance Committee prefers simpler rifled muzzle-loaders."
 ENG_martini_henry:0 "The Martini-Henry"
 ENG_martini_henry_desc:0 "Friedrich von Martini's falling-block action and Alexander Henry's rifling make a purpose-built breech-loader for the army."
 ENG_militia_reform:0 "Reform the Militia"
 ENG_militia_reform_desc:0 "The Militia must become a true reserve rather than a county pageant."
 ENG_cardwell_reforms:0 "The Cardwell Reforms"
 ENG_cardwell_reforms_desc:0 "Edward Cardwell will reorganise the army from top to bottom: short service, reserves, localised regiments and an end to purchase."
 ENG_duke_of_cambridge_way:0 "The Duke of Cambridge's Army"
 ENG_duke_of_cambridge_way_desc:0 "The Commander-in-Chief believes in the regimental system as it is. 'There is a time for everything, and the time for change is when you can no longer help it.'"
 ENG_army_enlistment_act:0 "Short Service Enlistment"
 ENG_army_enlistment_act_desc:0 "Six years with the colours and six in the reserve will build a trained reserve that the army has never had."
 ENG_abolish_purchase:0 "Abolish the Purchase of Commissions"
 ENG_abolish_purchase_desc:0 "Commissions will no longer be bought and sold. When the Lords obstruct, the government will abolish purchase by Royal Warrant."
 ENG_regimental_tradition:0 "Regimental Tradition"
 ENG_regimental_tradition_desc:0 "The regiment is the soldier's family. Its colours, its customs and its battle honours are worth more than any reform."
 ENG_preserve_purchase:0 "Preserve the Purchase System"
 ENG_preserve_purchase_desc:0 "Purchase keeps the officer corps in the hands of men of property and loyalty. It will remain."
 ENG_localisation_scheme:0 "Localisation of the Regiments"
 ENG_localisation_scheme_desc:0 "Linked battalions with county depots will tie each regiment to its own recruiting district."
 ENG_subordinate_the_commander_in_chief:0 "The War Office Act"
 ENG_subordinate_the_commander_in_chief_desc:0 "The Commander-in-Chief will be placed under the Secretary of State for War, and the Horse Guards will move to Pall Mall."
 ENG_brigade_of_guards:0 "The Household Troops"
 ENG_brigade_of_guards_desc:0 "The Guards and the Household Cavalry remain the model of discipline for the whole army."
 ENG_autumn_manoeuvres:0 "Autumn Manoeuvres"
 ENG_autumn_manoeuvres_desc:0 "Large-scale exercises on Salisbury Plain and Dartmoor will test the army in the field, as the Prussians do."
 ENG_aldershot_camp:0 "The Camp at Aldershot"
 ENG_aldershot_camp_desc:0 "The permanent camp at Aldershot is the home of the army. It will be expanded and improved."
 ENG_staff_college:0 "Reform the Staff College"
 ENG_staff_college_desc:0 "Camberley must produce trained staff officers fit to plan campaigns, not merely gentlemen of good family."
 ENG_balloon_committee:0 "The War Office Balloon Committee"
 ENG_balloon_committee_desc:0 "Captains Beaumont and Grover have argued since 1862 for military balloons. A committee with the chemist Frederick Abel will study gas supply and observation ascents. There will be no flying machines, only tethered balloons for observation."
 ENG_field_telegraph:0 "The Field Telegraph"
 ENG_field_telegraph_desc:0 "A Royal Engineers telegraph troop will link headquarters to the front by wire."
 ENG_intelligence_branch:0 "The Intelligence Branch"
 ENG_intelligence_branch_desc:0 "The Topographical and Statistical Department will become an Intelligence Branch studying foreign armies."
 ENG_small_wars:0 "Small Wars"
 ENG_small_wars_desc:0 "The British Army fights its wars at the ends of the earth. Imperial campaigning demands its own skills."
 ENG_a_modern_army:0 "A Modern Army"
 ENG_a_modern_army_desc:0 "Reformed, re-armed and professional, the British Army is ready for the challenges of a new age."
 ENG_rule_britannia:0 "Rule, Britannia"
 ENG_rule_britannia_desc:0 "The Royal Navy is the largest and most powerful in the world. Keeping it so is the first principle of British strategy."
 ENG_ironclad_programme:0 "The Ironclad Programme"
 ENG_ironclad_programme_desc:0 "Warrior made every wooden battleship obsolete. The battle fleet must be rebuilt in iron."
 ENG_admiralty_reform:0 "Reform the Board of Admiralty"
 ENG_admiralty_reform_desc:0 "The Board must be made efficient, with clear responsibility for each department."
 ENG_naval_bases:0 "Coaling Stations of the Empire"
 ENG_naval_bases_desc:0 "Steam warships need coal. Malta, Gibraltar and Bermuda must be fortified and stocked."
 ENG_reeds_central_battery:0 "Reed's Central Battery Ships"
 ENG_reeds_central_battery_desc:0 "The Chief Constructor's armoured central batteries combine heavy guns, thick armour and seaworthiness."
 ENG_coles_turret_ships:0 "Coles's Turret Ships"
 ENG_coles_turret_ships_desc:0 "Captain Cowper Coles insists that guns in revolving turrets are the future, and the press agrees with him."
 ENG_royal_naval_reserve:0 "The Royal Naval Reserve"
 ENG_royal_naval_reserve_desc:0 "Trained merchant seamen will reinforce the fleet in wartime."
 ENG_dockyard_expansion:0 "Expand the Royal Dockyards"
 ENG_dockyard_expansion_desc:0 "Portsmouth and Devonport need new basins and docks for the larger ironclads."
 ENG_hercules_class:0 "HMS Hercules"
 ENG_hercules_class_desc:0 "Reed's masterpiece, with ten-inch guns behind nine inches of iron, will be the most powerful ship afloat."
 ENG_hms_captain:0 "HMS Captain"
 ENG_hms_captain_desc:0 "Coles's masted turret ship is being built by Laird's. Reed warns that her freeboard is dangerously low."
 ENG_flying_squadron:0 "The Flying Squadron"
 ENG_flying_squadron_desc:0 "A squadron of fast frigates will sail round the world, training crews and showing the flag in every ocean."
 ENG_unarmoured_cruisers:0 "Fast Unarmoured Frigates"
 ENG_unarmoured_cruisers_desc:0 "Fast iron frigates such as Inconstant will hunt down raiders and protect British commerce."
 ENG_devastation:0 "HMS Devastation"
 ENG_devastation_desc:0 "No masts, no sails: a sea-going turret ship that relies on steam alone. The first modern battleship."
 ENG_whitehead_torpedo:0 "The Whitehead Torpedo"
 ENG_whitehead_torpedo_desc:0 "Robert Whitehead's self-propelled torpedo has been tested at Sheerness. The Admiralty should buy the rights."
 ENG_greenwich_naval_college:0 "Royal Naval College, Greenwich"
 ENG_greenwich_naval_college_desc:0 "Wren's Greenwich Hospital will become a college where officers study gunnery, engineering and strategy."
 ENG_channel_and_mediterranean:0 "The Channel and Mediterranean Fleets"
 ENG_channel_and_mediterranean_desc:0 "Two great fleets guard the approaches to Britain and the road to India."
 ENG_mistress_of_the_seas:0 "Mistress of the Seas"
 ENG_mistress_of_the_seas_desc:0 "No combination of powers can challenge the Royal Navy."
 ENG_the_widow_of_windsor:0 "The Widow of Windsor"
 ENG_the_widow_of_windsor_desc:0 "Since the Prince Consort's death in 1861 the Queen has hidden from her people at Windsor, Osborne and Balmoral. Her absence is noticed."
 ENG_coax_the_queen_out:0 "Coax the Queen into Public Life"
 ENG_coax_the_queen_out_desc:0 "The Queen must be persuaded, gently but firmly, to open Parliament and be seen by her subjects."
 ENG_respect_her_mourning:0 "Respect Her Mourning"
 ENG_respect_her_mourning_desc:0 "It is not for ministers to lecture the sovereign on her grief."
 ENG_prince_of_wales_duties:0 "Duties for the Prince of Wales"
 ENG_prince_of_wales_duties_desc:0 "The heir needs serious public work, both to occupy him and to show the monarchy at work."
 ENG_balmoral_and_mr_brown:0 "Mrs Brown"
 ENG_balmoral_and_mr_brown_desc:0 "The Queen's devotion to her Highland servant John Brown is the gossip of the clubs and the joke of the satirists."
 ENG_royal_civil_list:0 "The Civil List Debates"
 ENG_royal_civil_list_desc:0 "Radicals ask what the nation gets for the money it spends on an invisible monarch. Parliament must answer."
 ENG_thanksgiving_for_the_prince:0 "A Day of National Thanksgiving"
 ENG_thanksgiving_for_the_prince_desc:0 "The Queen and the Prince of Wales drive to St Paul's through cheering crowds. Republicanism has never looked weaker."
 ENG_dignified_constitution:0 "The Dignified Constitution"
 ENG_dignified_constitution_desc:0 "As Bagehot writes, the Crown is the 'dignified' part of the constitution, and its mystery is its strength."
 ENG_queen_and_empress:0 "Queen and Empress"
 ENG_queen_and_empress_desc:0 "An imperial title for the sovereign of India will bind the Raj to the Crown."
 ENG_republican_clubs:0 "The Republican Clubs"
 ENG_republican_clubs_desc:0 "Republican clubs are springing up in London, Birmingham and Newcastle."
 ENG_dilkes_newcastle_speech:0 "Dilke's Newcastle Speech"
 ENG_dilkes_newcastle_speech_desc:0 "Sir Charles Dilke tells a crowd that a republic would be cheaper and better. The audience cheers."
 ENG_bradlaugh_and_the_secularists:0 "Bradlaugh and the Secularists"
 ENG_bradlaugh_and_the_secularists_desc:0 "Charles Bradlaugh, atheist, Malthusian and republican, fills halls across the country."
 ENG_reform_league_radicals:0 "The Radicals of the Reform League"
 ENG_reform_league_radicals_desc:0 "The men who tore down the Hyde Park railings now demand more than the vote."
 ENG_regency_question:0 "The Regency Question"
 ENG_regency_question_desc:0 "If the Queen will not reign, must she abdicate? And should her son succeed her at all?"
 ENG_commonwealth_of_britain:0 "The Commonwealth of Britain"
 ENG_commonwealth_of_britain_desc:0 "For the second time in her history, Britain proclaims a Commonwealth. The loyalists will not yield without a fight."
 ENG_foreign_office:0 "The Foreign Office"
 ENG_foreign_office_desc:0 "Prussia has humbled Austria and Europe is changing fast. Britain must decide how far she will be drawn in."
 ENG_non_intervention:0 "Non-Intervention"
 ENG_non_intervention_desc:0 "Lord Stanley's maxim: Britain will not involve herself in continental quarrels that do not touch her interests."
 ENG_european_concert:0 "The Concert of Europe"
 ENG_european_concert_desc:0 "The great powers must settle their differences by conference, not war, with Britain as broker."
 ENG_anglo_american_relations:0 "Relations with the United States"
 ENG_anglo_american_relations_desc:0 "Washington has not forgiven British sympathy for the Confederacy. The relationship must be repaired."
 ENG_luxembourg_guarantee:0 "The Luxembourg Crisis"
 ENG_luxembourg_guarantee_desc:0 "Napoleon III wishes to buy Luxembourg and Bismarck will not allow it. A conference in London will neutralise the duchy."
 ENG_belgian_neutrality:0 "Guarantee Belgian Neutrality"
 ENG_belgian_neutrality_desc:0 "Whatever happens between France and Prussia, Belgium must not be touched. Britain will make treaties with both."
 ENG_relations_with_france:0 "The Entente with the Second Empire"
 ENG_relations_with_france_desc:0 "Allies in the Crimea and partners in free trade, Britain and France have every reason to stay friends."
 ENG_the_german_question:0 "The German Question"
 ENG_the_german_question_desc:0 "A united Germany under Prussia would transform the balance of Europe. What should Britain's attitude be?"
 ENG_alabama_claims:0 "The Alabama Claims"
 ENG_alabama_claims_desc:0 "The Americans demand compensation for the damage done by the Confederate raider Alabama, built at Birkenhead."
 ENG_canadian_confederation:0 "British North America Act"
 ENG_canadian_confederation_desc:0 "Canada, Nova Scotia and New Brunswick will unite in a self-governing Dominion, strong enough to deter American ambitions."
 ENG_black_sea_clauses:0 "The Black Sea Clauses"
 ENG_black_sea_clauses_desc:0 "Russia means to tear up the neutralisation of the Black Sea agreed at Paris in 1856."
 ENG_balance_against_prussia:0 "Balance Against Prussia"
 ENG_balance_against_prussia_desc:0 "A Prussian Germany threatens the balance of power. Britain must lean towards France and Austria."
 ENG_accommodate_germany:0 "Accommodate the New Germany"
 ENG_accommodate_germany_desc:0 "A strong, Protestant Germany is a natural counterweight to France and Russia."
 ENG_treaty_of_washington:0 "The Treaty of Washington"
 ENG_treaty_of_washington_desc:0 "Commissioners of both nations agree to submit the Alabama claims to international arbitration."
 ENG_dominion_from_sea_to_sea:0 "A Dominion from Sea to Sea"
 ENG_dominion_from_sea_to_sea_desc:0 "Rupert's Land, British Columbia and Prince Edward Island will join the Dominion, which will then reach the Pacific."
 ENG_strengthen_ties_with_the_turks:0 "Uphold the Ottoman Empire"
 ENG_strengthen_ties_with_the_turks_desc:0 "The Sultan's empire is the barrier between Russia and the road to India."
 ENG_suez_interest:0 "The Road to India"
 ENG_suez_interest_desc:0 "Lesseps's canal across the Isthmus of Suez will shorten the voyage to Bombay by thousands of miles."
 ENG_geneva_arbitration:0 "The Geneva Arbitration"
 ENG_geneva_arbitration_desc:0 "A tribunal of five arbitrators sits in Geneva to judge the Alabama claims."
 ENG_finish_construction_of_the_suez:0 "The Suez Canal"
 ENG_finish_construction_of_the_suez_desc:0 "The canal is complete. Most of the ships that pass through it fly the British flag."
 ENG_anglo_american_friendship:0 "Blood Thicker than Water"
 ENG_anglo_american_friendship_desc:0 "The Alabama settlement has shown that the English-speaking peoples can settle their quarrels peaceably."
 ENG_influence_egypt:0 "Influence the Khedive"
 ENG_influence_egypt_desc:0 "Khedive Ismail is spending beyond his means. British advice and British money will follow British shipping."
 ENG_pax_britannica_focus:0 "Pax Britannica"
 ENG_pax_britannica_focus_desc:0 "Britain keeps the peace of the seas, and through it the peace of the world."
 ENG_greater_britain:0 "Greater Britain"
 ENG_greater_britain_desc:0 "Dilke's book describes an English-speaking race spread across the globe. Why should it not be a single state?"
 ENG_imperial_federation_league:0 "The Imperial Federation Movement"
 ENG_imperial_federation_league_desc:0 "Colonists and Britons alike call for closer union."
 ENG_colonial_conference:0 "A Colonial Conference"
 ENG_colonial_conference_desc:0 "The premiers of the self-governing colonies will meet in London to discuss defence, trade and union."
 ENG_imperial_parliament:0 "An Imperial Parliament"
 ENG_imperial_parliament_desc:0 "Colonial members at Westminster, or a new parliament above it, will give the empire a single voice."
 ENG_federation_of_the_empire:0 "The Federation of the Empire"
 ENG_federation_of_the_empire_desc:0 "The self-governing colonies join the United Kingdom in one federal state. Greater Britain is born."
 ENG_continue_colonization_around_the_world:0 "The Colonial Office"
 ENG_continue_colonization_around_the_world_desc:0 "From Downing Street, a handful of clerks oversees an empire on which the sun never sets."
 ENG_turn_to_the_west:0 "The West Indies"
 ENG_turn_to_the_west_desc:0 "After the Morant Bay rebellion, the Caribbean colonies need firm and honest government."
 ENG_turn_to_the_east:0 "The East"
 ENG_turn_to_the_east_desc:0 "India, the Straits and the Australasian colonies are the heart of the empire's wealth."
 ENG_turn_to_the_south:0 "Africa"
 ENG_turn_to_the_south_desc:0 "Britain's African possessions are scattered coastal footholds, but the interior is being explored."
 ENG_jamaica_crown_colony:0 "Crown Colony Government in Jamaica"
 ENG_jamaica_crown_colony_desc:0 "After Governor Eyre's brutal suppression at Morant Bay, Jamaica's assembly gives up its powers to direct Crown rule."
 ENG_west_indian_sugar:0 "West Indian Sugar"
 ENG_west_indian_sugar_desc:0 "Sugar estates worked by indentured labourers keep the island economies alive."
 ENG_indian_focus:0 "The Raj after the Mutiny"
 ENG_indian_focus_desc:0 "Since 1858 India has been governed by the Crown through a Viceroy. Stability is the first priority."
 ENG_indian_trade:0 "Indian Trade"
 ENG_indian_trade_desc:0 "Indian cotton, jute, indigo and tea feed British industry, and Indian markets buy British cloth."
 ENG_increase_indian_garrisons:0 "The Indian Garrison"
 ENG_increase_indian_garrisons_desc:0 "After 1857, a large European garrison will always be kept in India."
 ENG_reinforce_land_revenue_system:0 "The Land Revenue System"
 ENG_reinforce_land_revenue_system_desc:0 "Land revenue is the backbone of Indian finance. It must be assessed and collected efficiently."
 ENG_supression_of_indian_freedom:0 "Rule by the Sword"
 ENG_supression_of_indian_freedom_desc:0 "India was won by the sword and will be held by the sword."
 ENG_indian_council_act:0 "The Indian Councils"
 ENG_indian_council_act_desc:0 "Nominated Indian members on the legislative councils will give the Raj a measure of consent."
 ENG_build_infastructure_in_india:0 "Indian Railways and Canals"
 ENG_build_infastructure_in_india_desc:0 "Guaranteed railway companies and great irrigation canals will open up the subcontinent."
 ENG_orissa_famine_relief:0 "Famine Relief"
 ENG_orissa_famine_relief_desc:0 "The Orissa famine of 1866 killed perhaps a million people. Never again must the government stand by."
 ENG_indian_industrialization:0 "Indian Industry"
 ENG_indian_industrialization_desc:0 "The cotton mills of Bombay show that India can manufacture as well as grow."
 ENG_oceania_focus:0 "The Antipodean Colonies"
 ENG_oceania_focus_desc:0 "Gold, wool and free settlers have made the Australasian colonies prosperous and self-governing."
 ENG_australia:0 "Australian Gold and Wool"
 ENG_australia_desc:0 "Victoria's goldfields and the sheep runs of New South Wales enrich the empire."
 ENG_malaysia:0 "The Straits Settlements"
 ENG_malaysia_desc:0 "Singapore, Penang and Malacca command the route to China."
 ENG_economic_growth_in_southeast_australia:0 "Marvellous Melbourne"
 ENG_economic_growth_in_southeast_australia_desc:0 "Melbourne is fast becoming one of the great cities of the empire."
 ENG_crown_colony_of_the_straits_settlements:0 "A Crown Colony"
 ENG_crown_colony_of_the_straits_settlements_desc:0 "The Straits Settlements pass from the India Office to the Colonial Office as a Crown colony."
 ENG_new_zealand_wars:0 "End the New Zealand Wars"
 ENG_new_zealand_wars_desc:0 "The imperial regiments are being withdrawn. The settlers must make peace with the Maori or fight alone."
 ENG_grant_straits_settlements_a_colonial_constitution:0 "The Pangkor Engagement"
 ENG_grant_straits_settlements_a_colonial_constitution_desc:0 "British Residents will advise the Malay rulers, extending British influence into the peninsula."
 ENG_fiji_cession:0 "The Cession of Fiji"
 ENG_fiji_cession_desc:0 "King Cakobau offers Fiji to the Queen. A Pacific coaling station is not to be refused."
 ENG_progress_in_oceania:0 "Progress in the Pacific"
 ENG_progress_in_oceania_desc:0 "The Pacific colonies are prospering and loyal."
 ENG_african_focus:0 "African Interests"
 ENG_african_focus_desc:0 "Missionaries, traders and explorers are drawing Britain deeper into Africa."
 ENG_grain_production_in_the_cape_colony:0 "The Cape Colony"
 ENG_grain_production_in_the_cape_colony_desc:0 "The Cape guards the sea route to India and feeds the passing fleets."
 ENG_nigerian_oil:0 "Palm Oil of the Niger"
 ENG_nigerian_oil_desc:0 "Palm oil from the Niger Delta lubricates British machinery and makes British soap."
 ENG_gold_coast_forts:0 "The Gold Coast Forts"
 ENG_gold_coast_forts_desc:0 "The Dutch will sell their forts on the Gold Coast, leaving Britain the only European power on that shore."
 ENG_increased_wine_production:0 "Cape Wool and Wine"
 ENG_increased_wine_production_desc:0 "The farms of the Cape export wool and wine to the mother country."
 ENG_lagos_and_the_niger:0 "Lagos and the Niger"
 ENG_lagos_and_the_niger_desc:0 "From Lagos, British traders push up the Niger towards the interior."
 ENG_ashanti_expedition:0 "The Ashanti Expedition"
 ENG_ashanti_expedition_desc:0 "The Asante have invaded the protectorate. An expedition must march on Kumasi before the fever season."
 ENG_diamond_fields:0 "The Diamond Fields"
 ENG_diamond_fields_desc:0 "Diamonds have been found at Kimberley. Griqualand West must be annexed before the Boer republics claim it."
 ENG_africa_doing_well:0 "Africa Secured"
 ENG_africa_doing_well_desc:0 "Britain's African possessions are secure and growing."
