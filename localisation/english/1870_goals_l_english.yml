 reich_trigger:0 "The §YGerman Empire§! exists"
 spanish_glorious_revolution:0 "Spanish Glorious Revolution"
 spanish_glorious_revolution_desc:0 "The Glorious Revolution, orchestrated by these valiant rebels, marks a new dawn for Spain, a testament to the resilience and spirit of our people! Embracing this wave of change, we stand poised to forge a brighter future, united under a banner of progress and liberty."
 invite_a_bonaparte:0 "Invite a Bonaparte"
 invite_a_bonaparte_desc:0 ""Inviting a Bonaparte to our courts is a mockery of our nation's history and sovereignty. We shall not bow to the whims of foreign powers seeking to manipulate us for their own gain. Our loyalty lies with our own people, not with the self-proclaimed heirs of a long-dead empire."
 invite_a_british:0 "Invite a Brit"
 invite_a_british_desc:0 "The very notion of inviting a British ruler to govern our lands is an insult to our independence and heritage. We refuse to surrender our autonomy to foreign interests, especially those of the British imperialists. Our allegiance is to our own people, not to some distant monarch across the sea."
 invite_a_savoyan:0 "Invite a Savoyan"
 invite_a_savoyan_desc:0 "The invitation of a Savoyan ruler honors our rich history and traditions, presenting an opportunity for unity and stability under a respected lineage. Embracing the legacy of Italy, we open our arms to a leader who understands our values and aspirations."
 invite_a_hohenzollern:0 "Invite a Hohenzollern"
 invite_a_hohenzollern_desc:0 "Inviting a Hohenzollern to lead us echoes the spirit of Leopold's candidacy, offering a path towards strength and resilience in these uncertain times. Inspired by a legacy of leadership, we stand ready to embrace a ruler who shares our vision for a prosperous future."
 borders_ethiopia:0 "Borders §Y[ETH.GetNameDef]§!"
