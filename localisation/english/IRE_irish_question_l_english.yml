 IRE_coercion_campaign:0 "Coercion Campaign"
 IRE_coercion_campaign_desc:0 "Special powers, arrests and flying columns of the Constabulary in the selected province. It works quickly, and leaves a harvest of bitterness."
 IRE_reform_programme:0 "Reform Programme"
 IRE_reform_programme_desc:0 "Relief works, fairer rents and Catholic appointments in the selected province. Slow, expensive and resented by Protestant Ulster and the Conservative benches."
 IRE_benign_neglect:0 "Benign Neglect"
 IRE_benign_neglect_desc:0 "Leave Ireland to Dublin Castle and spend the money elsewhere."
 IRE_land_purchase_loans:0 "Land Purchase Loans"
 IRE_land_purchase_loans_desc:0 "Advance state money so Irish tenants can buy their holdings."
 IRE_release_fenian_prisoners:0 "Release the Fenian Prisoners"
 IRE_release_fenian_prisoners_desc:0 "An act of clemency, welcomed in Ireland and in Irish America."
