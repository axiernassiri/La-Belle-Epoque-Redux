 ire_coercion_backlash:0 "Coercion Backlash"
 ire_agrarian_outrages:0 "Agrarian Outrages"

 ire_question.1.t:0 "The Home Rule Question"
 ire_question.1.d:0 "Nationalist feeling in Ireland has reached the point where no government can ignore it. Isaac Butt's followers demand a Dublin parliament for Irish affairs; Protestant Ulster and the Conservative benches warn that Home Rule means Rome Rule. The Cabinet must answer."
 ire_question.1.a:0 "Offer Home Rule within the Union."
 ire_question.1.b:0 "The Union is not negotiable."
 ire_question.1.c:0 "A new Coercion Act."
 ire_question.2.t:0 "Agrarian Outrages"
 ire_question.2.d:0 "Rent strikes, maimed cattle, burned hayricks and shots fired at land agents: the countryside is slipping out of the Constabulary's control."
 ire_question.2.a:0 "Send in the troops."
 ire_question.2.b:0 "Concessions to the tenants."
 ire_question.3.t:0 "The Irish Republic"
 ire_question.3.d:0 "The Irish Republican Brotherhood has proclaimed an Irish Republic in Dublin, and this time the country has risen with it. Police barracks have fallen across the south and west, and a provisional government claims all of Ireland."
 ire_question.3.a:0 "Crush the rebellion."
 ire_question.3.b:0 "Let Ireland go."
 ire_question.10.t:0 "The Home Government Association"
 ire_question.10.d:0 "In a Dublin hotel, Isaac Butt, a Protestant barrister who once defended the Fenians, has founded the Home Government Association. It asks for an Irish parliament for Irish affairs, within the United Kingdom."
 ire_question.10.a:0 "A matter for Parliament."
 ire_question.10.b:0 "Fenianism in a frock coat."
 ire_question.11.t:0 "The Home Rule League"
 ire_question.11.d:0 "A national conference in Dublin has replaced Butt's Association with the Home Rule League, a disciplined movement that means to fight every Irish seat at the next election."
 ire_question.11.a:0 "Watch the League closely."
 ire_question.11.b:0 "Ban its meetings."
 ire_question.12.t:0 "The Irish Church Act"
 ire_question.12.d:0 "The Church of Ireland is disestablished. Catholic Ireland no longer pays for a Protestant establishment, though the Orange lodges call it a betrayal."
 ire_question.12.a:0 "One grievance fewer."
 ire_question.13.t:0 "The Irish Land Act"
 ire_question.13.d:0 "The Landlord and Tenant (Ireland) Act gives evicted tenants compensation and gives legal force to the Ulster custom. It is a first step, though critics say a timid one."
 ire_question.13.a:0 "The tenant has some security at last."
 ire_question.14.t:0 "The Ballot Comes to Ireland"
 ire_question.14.d:0 "With the secret ballot, Irish tenants can vote against their landlords' candidates without fear of eviction. Nationalist candidates are expected to sweep the south."
 ire_question.14.a:0 "So be it."
 ire_question.20.t:0 "An Irish Republic"
 ire_question.20.d:0 "Ireland has broken away from the United Kingdom. A provisional government in Dublin has proclaimed an Irish Republic."
 ire_question.20.a:0 "Ireland is lost to the Crown... for now."
 ire_question.20.b:0 "Ireland is free!"
 ire_question.20.c:0 "The British Empire is shaken."
 IRE_suspend_habeas_corpus:0 "Suspend Habeas Corpus in Ireland"
 IRE_suspend_habeas_corpus_desc:0 "American veterans of the Civil War are crossing the Atlantic to lead an Irish rising. Suspected conspirators will be held without trial until the danger has passed, and the garrisons will be ready."
 IRE_disestablish_church_of_ireland:0 "The Irish Church Act"
 IRE_disestablish_church_of_ireland_desc:0 "Why should a Catholic nation pay tithes to a Protestant Church? Disestablishing the Church of Ireland will end the anomaly."
 IRE_irish_land_act:0 "The Landlord and Tenant (Ireland) Act"
 IRE_irish_land_act_desc:0 "Compensation for disturbance and for improvements, and legal force for the Ulster custom, will give the Irish tenant his first security. Unlocks §YLand Purchase Loans§!."
 IRE_irish_settlement:0 "An Irish Settlement"
 IRE_irish_settlement_desc:0 "With the Church question settled, the tenant protected and the provinces calm, the Irish Question has ceased to threaten the stability of the realm. Requires both great Irish Acts and overall nationalism below §Y35§!."
