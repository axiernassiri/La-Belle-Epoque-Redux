# Ideas
FRA_constitutional_reform_of_1862: "Constitutional Reform of 1862"
FRA_constitutional_reform_of_1862_desc: "Since 1860, the legislature has gained greater freedom to debate government policy while constitutional reforms have begun to loosen the Emperor's absolute control. Though the Bonapartist system remains intact, these concessions have strengthened parliamentary institutions and opened the door to further liberalization."
FRA_education_reforms: "Education Reforms"
FRA_education_reforms_desc: "Under Victor Duruy, the Empire has embarked upon an ambitious programme to broaden access to education and modernize the patrie's schools. Though social resistance is preventing compulsory schooling, these reforms promise to establish a strong foundation for France's national progress."
FRA_cobden_chevalier_treaty: "Cobden-Chevalier Treaty"
FRA_cobden_chevalier_treaty_desc: "In January 1860, Richard Cobden and Michel Chevalier negotiated a landmark commercial treaty between our countries. By lowering tariffs and removing barriers to trade, the agreement promises to expand markets for French goods and support the Emperor's design for a free economy."
FRA_intense_political_division: "Intense Political Division"
FRA_intense_political_division_desc: "The Second Empire is beset by increasingly bitter political divisions. Liberals demand greater parliamentary freedoms while radical Republicans seek to dismantle imperial rule altogether. With rival factions competing for influence, government becomes increasingly difficult and public confidence in the regime begins to erode."
FRA_marine_imperiale: "Marine Impériale"
FRA_marine_imperiale_desc: "Under the Emperor's enlightened hand, France has entered a new era of naval warfare, pioneering steam propulsion and ironclad warships. Challenging British naval supremacy and colonial interests, however, demands further investment."
FRA_french_economy_modifier: "Économie de la France"
FRA_french_economy_modifier_desc: "Financial instability and rising unemployment threaten industrial output, while the costs of ambitious public works and foreign interventions strain the state’s finances. The liberalisation of trade has opened new opportunities, but many domestic producers fear competition from abroad."
FRA_french_army_modifier: "Armée Impériale Française"
FRA_french_army_modifier_desc: "The Austro-Prussian War has exposed the many shortcomings of our military body. The recruitment system leaves us with insufficient reserves, while an inefficient logistics system and outdated command structure hamper our field operations. Emperor Napoleon's attempts at reform face fierce public opposition, leaving the army ill-prepared for a major European war."

### Focuses
# Army
FRA_our_great_friend_sastres_our_army_supplier: "Our Great Friend Sastres"
FRA_our_great_friend_sastres_our_army_supplier_desc: "A reliable logistics system is the cornerstone of any modern army. Our great friend and industrialist, §OHector de Sastres§!, will ensure our forces lack for nothing."
FRA_adolphe_niels_reform: "Introduce Niel's Reforms"
FRA_adolphe_niels_reform_desc: "The swift Prussian victory in the Bruderkrieg has stunned even the most cautious of observers. §2Maréchal Adolphe Niel§! has proposed sweeping reforms to recruitment, including the establishment of a Mobile National Guard, should France ever need to defend itself."
FRA_reorganize_the_supply_networks: "Reorganize the Supply Networks"
FRA_reorganize_the_supply_networks_desc: "Our improved supply services will ensure that provisions reach our troops when they are needed."
FRA_reorganization_of_the_army: "Reorganization of the Army"
FRA_reorganization_of_the_army_desc: "Our military machine must adapt to the rapidly changing conditions of warfare if it wishes to remain an effective fighting force."
FRA_garde_nationale_mobile: "Garde Nationale Mobile"
FRA_garde_nationale_mobile_desc: "The Mobile National Guard is intended to provide a steady reserve of manpower beyond the regular army. By organising eligible citizens into a national force, we can reinforce our defences and increase the number of men available in the event of war."
FRA_standardization_of_the_chassepot_rifle: "Standardize the Chassepot Rifle"
FRA_standardization_of_the_chassepot_rifle_desc: "The Chassepot rifle offers our infantry a significant advantage in firepower over older weapons. Standardizing its adoption will be a great boon to our forces."
FRA_leeve_en_masse: "Levée en Masse"
FRA_leeve_en_masse_desc: "Ever since the French Revolution, France has been able to call upon vast amounts of her loyal citizens to defend the patrie when necessary. The measure is not popular and desertion is common but through enough drill we might turn out an orderly force."
FRA_the_potential_of_the_metrailleuse: "The Potential of the Mitrailleuse"
FRA_the_potential_of_the_metrailleuse_desc: "Though it has not found its place in our army yet, the mitrailleuse is a weapon with devastating potential. We would be wise to continue its implementation."
FRA_reorganize_the_garde_nationale_mobile: "Reorganize the Garde Nationale Mobile"
FRA_reorganize_the_garde_nationale_mobile_desc: "Creating the Mobile National Guard was only the first step. It must also be properly organised, equipped and trained. Regular exercises will help turn this unruly reserve into a force capable of supporting the regular army."
FRA_modernization_of_the_artillery: "Modernization of the Artillery"
FRA_modernization_of_the_artillery_desc: "Modern warfare demands modern artillery. By improving our guns and ammunition we can strengthen the firepower available to our line formations."
FRA_improvisation_of_arms_productivity: "Modernize Arms Production"
FRA_improvisation_of_arms_productivity_desc: "A chassepot in every hand! We must increase arms production to meet the hefty demands of our growing army."
FRA_preparatives_for_the_inevitable: "Prepare for the Inevitable"
FRA_preparatives_for_the_inevitable_desc: "The balance of power in Europe is shifting and the growing strength of Prussia cannot be ignored. We must prepare our armed forces for the possibility of a conflict in the near future."
FRA_general_frossard_defensive_plan: "Adopt Frossard's Defensive Plan"
FRA_general_frossard_defensive_plan_desc: "§2Général Charles Frossard§! has advocated a defensive strategy built around fortified positions and troop concentration at key points along the frontier. Together with our new rifles and artillery, an advancing enemy would suffer great losses."
FRA_preemptive_mobilization_of_the_population: "Preemptive Mobilization of the Population"
FRA_preemptive_mobilization_of_the_population_desc: "Waiting until war is declared to mobilize our reserves is risky. We should prepare the population ahead of time to bring a greater force against the enemy when the time calls."
FRA_risky_measures: "Equip the Militias"
FRA_risky_measures_desc: "With our regular army overstretched, organizing the militias would help us to reinforce less strategic objectives. However, equipping this undisciplined rable could have §Runforeseen consequences§!."
FRA_learn_from_der_bruderkrieg: "Learn from the Bruderkrieg"
FRA_learn_from_der_bruderkrieg_desc: "Prussia's victory in the Bruderkrieg has shown the importance of rapid mobilization and modern military organization. We must study the campaign carefully and draw lessons from the Prussian system before France faces a similar test."
