l_english:
 ENG_chancellors_budget:0 "The Chancellor's Budget"
 ENG_chancellors_budget_desc:0 "Every spring the Chancellor of the Exchequer opens his box and tells the Commons what the nation will pay. The Budget is the true measure of a government."
 ENG_exchequer_and_audit:0 "The Exchequer and Audit Act"
 ENG_exchequer_and_audit_desc:0 "A single Comptroller and Auditor General will examine every account of every department. Money voted for one purpose shall not be spent on another."
 ENG_the_national_debt:0 "The National Debt"
 ENG_the_national_debt_desc:0 "Eight hundred millions of debt hang over the nation, the legacy of the French wars. Its service eats a third of the revenue."
 ENG_the_income_tax:0 "The Income Tax"
 ENG_the_income_tax_desc:0 "The income tax was meant to be temporary. Thirty years on, it is still levied, and every Chancellor must decide its future."
 ENG_treasury_control:0 "Treasury Control"
 ENG_treasury_control_desc:0 "No department may spend a shilling without Treasury sanction. The War Office and the Admiralty are outraged."
 ENG_abolish_the_income_tax:0 "Pledge to Abolish the Income Tax"
 ENG_abolish_the_income_tax_desc:0 "A tax on industry and thrift is no fit burden for a free people. With economy, the income tax can be swept away altogether."
 ENG_broaden_the_income_tax:0 "A Permanent Income Tax"
 ENG_broaden_the_income_tax_desc:0 "Let the income tax become the permanent backbone of the revenue, so that the poor man's tea and sugar can be freed of duty."
 ENG_sinking_fund:0 "The Sinking Fund"
 ENG_sinking_fund_desc:0 "A fixed charge on the revenue will extinguish the debt year by year, whatever the politics of the moment."
 ENG_remit_the_sugar_duties:0 "Remit the Sugar Duties"
 ENG_remit_the_sugar_duties_desc:0 "Halve the duty on sugar and the breakfast table of every working family is the cheaper for it."
 ENG_control_of_the_estimates:0 "Control of the Estimates"
 ENG_control_of_the_estimates_desc:0 "The Army and Navy Estimates will be settled by the Cabinet with the Treasury, not by the services alone."
 ENG_consols_conversion:0 "Convert the Consols"
 ENG_consols_conversion_desc:0 "With money cheap, the Three per Cents can be converted to a lower rate. The fundholders will grumble."
 ENG_ex_luce_lucellum:0 "Ex Luce Lucellum"
 ENG_ex_luce_lucellum_desc:0 "A halfpenny tax on every box of matches will balance the books. The match girls of the East End may have something to say about it."
 ENG_gladstonian_finance:0 "Peace and Thrift"
 ENG_gladstonian_finance_desc:0 "Money should fructify in the pockets of the people. A frugal state is a strong state."
 ENG_sound_money:0 "Sound Money"
 ENG_sound_money_desc:0 "Sterling is as good as gold, and the world knows it. Every bill of exchange drawn on London is a vote of confidence in British finance."
 ENG_local_self_government:0 "Local Self-Government"
 ENG_local_self_government_desc:0 "England is governed by a tangle of vestries, boards and benches. If the nation is to be improved, the localities must be put in order."
 ENG_metropolitan_board_of_works:0 "The Metropolitan Board of Works"
 ENG_metropolitan_board_of_works_desc:0 "Sir Joseph Bazalgette's board has given London its sewers. Give it the powers and the money to give London its streets."
 ENG_municipal_corporations:0 "The Municipal Corporations"
 ENG_municipal_corporations_desc:0 "The boroughs have mayors and councils, but few of them dare to spend. Let the towns be bold."
 ENG_county_government:0 "The Quarter Sessions"
 ENG_county_government_desc:0 "The counties are still governed by the magistrates in Quarter Sessions. The squires do the work cheaply, but answer to no ratepayer."
 ENG_the_thames_embankment:0 "The Victoria Embankment"
 ENG_the_thames_embankment_desc:0 "A great river wall from Westminster to Blackfriars will carry the low-level sewer, a railway and a fine new road."
 ENG_gas_and_water:0 "Gas and Water"
 ENG_gas_and_water_desc:0 "Let the corporations buy out the gas and water companies, and run them for the ratepayers rather than for the shareholders."
 ENG_municipal_franchise_act:0 "The Municipal Franchise Act"
 ENG_municipal_franchise_act_desc:0 "Every ratepayer, man or woman, shall vote for the town council. Mr Jacob Bright's amendment passes almost unnoticed."
 ENG_metropolitan_improvements:0 "Metropolitan Improvements"
 ENG_metropolitan_improvements_desc:0 "New thoroughfares will be driven through the rookeries, from Queen Victoria Street to the Holborn Viaduct."
 ENG_the_civic_gospel:0 "The Civic Gospel"
 ENG_the_civic_gospel_desc:0 "From Birmingham's chapels comes a new creed: the town is a moral community, and the council its instrument of improvement."
 ENG_a_government_for_london:0 "A Government for London"
 ENG_a_government_for_london_desc:0 "London has a Board of Works but no government. A single elected municipality for the whole metropolis is overdue."
 ENG_leave_it_to_the_vestries:0 "Leave It to the Vestries"
 ENG_leave_it_to_the_vestries_desc:0 "The parishes know their own business. A London municipality would be a dangerous rival to Parliament itself."
 ENG_local_taxation:0 "Grants in Aid of the Rates"
 ENG_local_taxation_desc:0 "Mr Goschen's report shows the rates bearing burdens that belong to the nation. The Treasury must contribute."
 ENG_the_imperial_metropolis:0 "The Imperial Metropolis"
 ENG_the_imperial_metropolis_desc:0 "London must look the part: a capital of embankments, boulevards and great public buildings worthy of the Empire."
 ENG_self_governing_towns:0 "The Self-Governing Towns"
 ENG_self_governing_towns_desc:0 "Clean water, lit streets, paved roads and public parks: the towns have learned to govern themselves, and they are the better for it."
 ENG_the_party_machine:0 "The Party Machine"
 ENG_the_party_machine_desc:0 "Household suffrage has doubled the electorate. The old ways of the clubs and the county families will no longer carry an election."
 ENG_the_fourth_estate:0 "The Fourth Estate"
 ENG_the_fourth_estate_desc:0 "Newspapers, freed of the stamp and the paper duty, now reach every town. Ministers rise and fall by the leading articles."
 ENG_the_registration_courts:0 "The Registration Courts"
 ENG_the_registration_courts_desc:0 "Elections are won in the revising barristers' courts, one disputed lodger at a time."
 ENG_election_petitions:0 "The Parliamentary Elections Act"
 ENG_election_petitions_desc:0 "Election petitions will be tried by judges rather than by committees of partisan Members."
 ENG_the_penny_press:0 "The Penny Press"
 ENG_the_penny_press_desc:0 "The Daily Telegraph sells two hundred thousand copies a day. The penny paper speaks for the new electorate."
 ENG_the_thunderer:0 "The Thunderer"
 ENG_the_thunderer_desc:0 "The Times still speaks for the governing classes, and a leader in Printing House Square can make or break a policy."
 ENG_the_birmingham_caucus:0 "The Birmingham Caucus"
 ENG_the_birmingham_caucus_desc:0 "In Birmingham the Liberal Association tells every voter how to cast his votes, ward by ward. The Whigs call it American wire-pulling."
 ENG_disfranchise_corrupt_boroughs:0 "Disfranchise the Corrupt Boroughs"
 ENG_disfranchise_corrupt_boroughs_desc:0 "Bridgwater, Beverley, Sligo and Cashel have sold themselves at every election. Let them lose their Members."
 ENG_purity_of_elections:0 "The Purity of Elections"
 ENG_purity_of_elections_desc:0 "Treating, bribery and intimidation are being driven from the polls. The election agent replaces the publican."
 ENG_public_opinion:0 "The Power of Public Opinion"
 ENG_public_opinion_desc:0 "Ministers now govern with one eye on the newspapers. Public opinion is a new estate of the realm, fickle but irresistible."
 ENG_the_party_whips:0 "The Party Whips"
 ENG_the_party_whips_desc:0 "Members vote with their party. The independent Member, beloved of the old House, is becoming a rarity."
 ENG_government_by_party:0 "Government by Party"
 ENG_government_by_party_desc:0 "Two disciplined parties, each with a programme, each appealing to the nation: the British constitution has found its modern form."
 ENG_the_sanitary_idea:0 "The Sanitary Idea"
 ENG_the_sanitary_idea_desc:0 "Edwin Chadwick's gospel has won: disease is born of filth, and filth can be removed by engineering and inspection."
 ENG_bazalgettes_sewers:0 "Bazalgette's Sewers"
 ENG_bazalgettes_sewers_desc:0 "Eighty-two miles of intercepting sewers carry London's filth away from the Thames. The Great Stink must never return."
 ENG_the_cholera_of_1866:0 "The Cholera of 1866"
 ENG_the_cholera_of_1866_desc:0 "Cholera has struck the East End again. Dr Farr traces it to the East London Water Company's unfiltered reservoir at Old Ford."
 ENG_compulsory_vaccination:0 "Compulsory Vaccination"
 ENG_compulsory_vaccination_desc:0 "The Vaccination Act requires every child to be vaccinated against smallpox. The anti-vaccinators are already organising."
 ENG_clean_water:0 "Clean Water"
 ENG_clean_water_desc:0 "The water companies must filter their supply and draw it from above the tidal reach. The days of the parish pump are numbered."
 ENG_royal_sanitary_commission:0 "The Royal Sanitary Commission"
 ENG_royal_sanitary_commission_desc:0 "A Royal Commission will survey the chaos of sanitary authorities and recommend a single, rational system."
 ENG_torrens_act:0 "The Torrens Act"
 ENG_torrens_act_desc:0 "Local authorities may now order the owners of insanitary houses to repair them or pull them down."
 ENG_medical_officers_of_health:0 "Medical Officers of Health"
 ENG_medical_officers_of_health_desc:0 "Every sanitary district shall have its own medical officer, with a duty to report on the health of the people."
 ENG_the_peabody_trust:0 "The Peabody Trust"
 ENG_the_peabody_trust_desc:0 "George Peabody's half million builds block dwellings for the respectable poor at rents they can afford."
 ENG_model_dwellings:0 "Model Dwellings"
 ENG_model_dwellings_desc:0 "The Improved Industrial Dwellings Company shows that decent housing for working men can pay a dividend."
 ENG_listers_antisepsis:0 "Lister's Antisepsis"
 ENG_listers_antisepsis_desc:0 "Joseph Lister's carbolic acid dressings have halved the deaths after amputation in Glasgow. The London surgeons scoff."
 ENG_pure_food:0 "The Adulteration of Food Act"
 ENG_pure_food_desc:0 "The sale of adulterated food and drink is now an offence. The grocers' associations protest at the meddling."
 ENG_a_healthy_nation:0 "A Healthy Nation"
 ENG_a_healthy_nation_desc:0 "The death rate is falling in the great towns for the first time in living memory. Sanitas sanitatum, omnia sanitas."
 ENG_the_poor_law:0 "The New Poor Law"
 ENG_the_poor_law_desc:0 "The workhouse stands in every union as a warning to the idle. But the sick, the old and the orphaned are paupers too."
 ENG_metropolitan_poor_act:0 "The Metropolitan Poor Act"
 ENG_metropolitan_poor_act_desc:0 "London's sick paupers will be treated in proper infirmaries paid for by a common fund, not in the workhouse wards."
 ENG_charity_organisation_society:0 "The Charity Organisation Society"
 ENG_charity_organisation_society_desc:0 "Indiscriminate alms breed pauperism. The Society will investigate every case and help only the deserving."
 ENG_friendly_societies:0 "The Friendly Societies"
 ENG_friendly_societies_desc:0 "Four million working men insure themselves against sickness and death through the Oddfellows, the Foresters and a hundred lesser orders."
 ENG_workhouse_infirmaries:0 "The Workhouse Infirmaries"
 ENG_workhouse_infirmaries_desc:0 "Separate infirmaries, with trained nurses and resident doctors, for the sick poor of the metropolis."
 ENG_the_co_operative_movement:0 "The Co-operative Movement"
 ENG_the_co_operative_movement_desc:0 "From Rochdale the co-operative stores have spread to every northern town. The Co-operative Wholesale Society buys for them all."
 ENG_post_office_savings_bank:0 "The Post Office Savings Bank"
 ENG_post_office_savings_bank_desc:0 "A savings bank in every post office, backed by the State, takes the working man's pennies safely."
 ENG_crusade_against_outdoor_relief:0 "The Crusade against Outdoor Relief"
 ENG_crusade_against_outdoor_relief_desc:0 "No more doles at the door. The able-bodied pauper will be offered the workhouse, and nothing else."
 ENG_humane_outdoor_relief:0 "Humane Outdoor Relief"
 ENG_humane_outdoor_relief_desc:0 "The aged and the widowed should be helped in their own homes. The workhouse should be a last resort, not a punishment."
 ENG_dr_barnardo:0 "Dr Barnardo's Homes"
 ENG_dr_barnardo_desc:0 "A young Irish medical student has opened a ragged school in Stepney. No destitute child, he says, shall ever be refused admission."
 ENG_thrift_and_providence:0 "Thrift and Providence"
 ENG_thrift_and_providence_desc:0 "The respectable artisan has his savings book, his friendly society and his co-operative dividend. He is the backbone of the nation."
 ENG_the_deserving_poor:0 "The Deserving Poor"
 ENG_the_deserving_poor_desc:0 "Between the State, the charities and the working men's own institutions, the poor of England are better cared for than ever before."
 ENG_the_woman_question:0 "The Woman Question"
 ENG_the_woman_question_desc:0 "Mr Mill has raised it in the Commons, and it will not go away. What is woman's proper sphere, and who is to decide?"
 ENG_girton_college:0 "Girton College"
 ENG_girton_college_desc:0 "Miss Emily Davies opens a college for women at Hitchin. Her students will sit the Cambridge Tripos, whether the University likes it or not."
 ENG_women_doctors:0 "Women in Medicine"
 ENG_women_doctors_desc:0 "Elizabeth Garrett holds the Apothecaries' licence. Others are knocking at the doors of the medical schools."
 ENG_womens_suffrage_society:0 "The Women's Suffrage Society"
 ENG_womens_suffrage_society_desc:0 "Lydia Becker in Manchester and Millicent Fawcett in London organise the first national campaign for votes for women."
 ENG_women_on_school_boards:0 "Women on the School Boards"
 ENG_women_on_school_boards_desc:0 "Women may stand for the new school boards. Elizabeth Garrett tops the poll in Marylebone."
 ENG_north_london_collegiate:0 "Girls' Schools"
 ENG_north_london_collegiate_desc:0 "Miss Buss and Miss Beale prove that girls can be taught as rigorously as boys. The Endowed Schools Commission takes note."
 ENG_the_edinburgh_seven:0 "The Edinburgh Seven"
 ENG_the_edinburgh_seven_desc:0 "Sophia Jex-Blake and six other women matriculate at Edinburgh. The male students riot at Surgeons' Hall."
 ENG_suffrage_petitions:0 "The Suffrage Petitions"
 ENG_suffrage_petitions_desc:0 "Petitions bearing a quarter of a million signatures are laid before Parliament."
 ENG_womens_disabilities_bill:0 "The Women's Disabilities Bill"
 ENG_womens_disabilities_bill_desc:0 "Jacob Bright's bill passes its second reading before Mr Gladstone has it killed in committee. The cause has a foothold in the Commons."
 ENG_higher_education_for_women:0 "Higher Education for Women"
 ENG_higher_education_for_women_desc:0 "Women's colleges at Cambridge and lectures in every university town: the intellectual equality of women is being demonstrated."
 ENG_school_of_medicine_for_women:0 "The London School of Medicine for Women"
 ENG_school_of_medicine_for_women_desc:0 "Rebuffed at Edinburgh, the women open their own medical school in London."
 ENG_mrs_fawcett:0 "Mrs Fawcett Speaks"
 ENG_mrs_fawcett_desc:0 "Millicent Fawcett takes the platform, calm, witty and unanswerable. Women speaking in public was a scandal ten years ago."
 ENG_women_in_public_life:0 "Women in Public Life"
 ENG_women_in_public_life_desc:0 "On school boards, boards of guardians and in the public offices, women are taking their place in the work of the nation."
 ENG_a_larger_sphere:0 "A Larger Sphere"
 ENG_a_larger_sphere_desc:0 "Woman's sphere is wherever she can be useful. The doors of the professions, the universities and public life are opening one by one."
 ENG_the_age_of_science:0 "The Age of Science"
 ENG_the_age_of_science_desc:0 "Darwin, Faraday, Thomson and Maxwell are British names. Science is the glory of the age, and perhaps the key to its prosperity."
 ENG_the_ancient_universities:0 "The Ancient Universities"
 ENG_the_ancient_universities_desc:0 "Oxford and Cambridge still train clergymen and gentlemen. Reformers want them to train scientists and scholars too."
 ENG_the_royal_society:0 "The Royal Society"
 ENG_the_royal_society_desc:0 "The oldest learned society in the world advises the Government, distributes the grants and crowns the careers of men of science."
 ENG_south_kensington:0 "South Kensington"
 ENG_south_kensington_desc:0 "The profits of the Great Exhibition have bought a quarter of museums, colleges and schools. The Department of Science and Art rules it."
 ENG_the_cavendish_laboratory:0 "The Cavendish Laboratory"
 ENG_the_cavendish_laboratory_desc:0 "The Duke of Devonshire pays for a physical laboratory at Cambridge. Professor Maxwell will direct it."
 ENG_the_devonshire_commission:0 "The Devonshire Commission"
 ENG_the_devonshire_commission_desc:0 "A Royal Commission on Scientific Instruction and the Advancement of Science will ask what the State owes to learning."
 ENG_the_royal_albert_hall:0 "The Royal Albert Hall"
 ENG_the_royal_albert_hall_desc:0 "The Queen opens the great hall of arts and sciences in memory of the Prince Consort, who dreamed of it."
 ENG_endowment_of_research:0 "The Endowment of Research"
 ENG_endowment_of_research_desc:0 "Let the college fellowships support men who discover, not merely men who teach."
 ENG_the_descent_of_man:0 "The Descent of Man"
 ENG_the_descent_of_man_desc:0 "Mr Darwin has published at last on the origin of mankind. The bishops are appalled, and the bookshops sold out."
 ENG_the_natural_history_museum:0 "The Natural History Museum"
 ENG_the_natural_history_museum_desc:0 "Professor Owen will have his cathedral of nature, designed by Mr Waterhouse, built of terracotta in South Kensington."
 ENG_technical_education:0 "Technical Education"
 ENG_technical_education_desc:0 "The Paris Exhibition showed Continental manufacturers catching up. The answer is technical education for the British workman."
 ENG_the_challenger_expedition:0 "The Challenger Expedition"
 ENG_the_challenger_expedition_desc:0 "HMS Challenger will sail round the world sounding, dredging and sampling the deep ocean, the greatest voyage of discovery since Cook."
 ENG_kelvin_and_maxwell:0 "Thomson and Maxwell"
 ENG_kelvin_and_maxwell_desc:0 "Sir William Thomson's instruments carry the cables; Professor Maxwell's equations explain the electricity that flows through them."
 ENG_kew_gardens:0 "Kew and the Colonial Gardens"
 ENG_kew_gardens_desc:0 "Dr Hooker's Kew sends cinchona to India and rubber to the East. Botany is now an imperial science."
 ENG_the_engineering_institutions:0 "The Engineering Institutions"
 ENG_the_engineering_institutions_desc:0 "The Civil Engineers, the Mechanical Engineers and the Naval Architects set the standards that the world follows."
 ENG_science_and_the_state:0 "Science and the State"
 ENG_science_and_the_state_desc:0 "The State must pay for science as it pays for the Navy. A national investment in knowledge will repay itself a hundredfold."
 ENG_science_and_industry:0 "The Marriage of Science and Industry"
 ENG_science_and_industry_desc:0 "Siemens, Perkin and Bessemer have shown what science can do for manufacture. Every great works needs its laboratory."
 ENG_the_scientific_nation:0 "The Scientific Nation"
 ENG_the_scientific_nation_desc:0 "Britain leads the world in the sciences that matter. The laboratory has joined the workshop and the counting-house as a pillar of national power."
 ENG_letters_and_the_arts:0 "Letters and the Arts"
 ENG_letters_and_the_arts_desc:0 "A nation is remembered for its poets and painters as much as for its ironclads. The age has its own genius."
 ENG_the_victorian_novel:0 "The Victorian Novel"
 ENG_the_victorian_novel_desc:0 "Mr Dickens reads to packed halls; Middlemarch appears in parts. The novel is the great art form of the age."
 ENG_the_south_kensington_museum:0 "The South Kensington Museum"
 ENG_the_south_kensington_museum_desc:0 "Treasures of the decorative arts will teach British designers to equal the French."
 ENG_the_pre_raphaelites:0 "The Brotherhood"
 ENG_the_pre_raphaelites_desc:0 "Rossetti, Morris and Burne-Jones scandalise the Academy and enchant the drawing-rooms."
 ENG_the_poet_laureate:0 "The Poet Laureate"
 ENG_the_poet_laureate_desc:0 "Tennyson's Idylls of the King give the nation an Arthurian mirror of duty, chivalry and Empire."
 ENG_the_national_gallery:0 "The National Gallery"
 ENG_the_national_gallery_desc:0 "The nation buys Sir Robert Peel's Dutch pictures and builds new rooms in Trafalgar Square to hang them."
 ENG_morris_and_company:0 "Morris and Company"
 ENG_morris_and_company_desc:0 "Mr Morris makes wallpapers, chintzes and stained glass by hand, in protest against the shoddy goods of the machine age."
 ENG_the_great_reviews:0 "The Great Reviews"
 ENG_the_great_reviews_desc:0 "The Fortnightly, the Contemporary and the Nineteenth Century carry the debates of the age into every educated home."
 ENG_art_for_the_people:0 "Art for the People"
 ENG_art_for_the_people_desc:0 "A branch museum in Bethnal Green will bring the treasures of South Kensington to the East End."
 ENG_ruskins_guild:0 "Mr Ruskin's Guild"
 ENG_ruskins_guild_desc:0 "The Slade Professor at Oxford founds a Guild of St George to restore honest work and the beauty of the land."
 ENG_a_golden_age_of_letters:0 "A Golden Age of Letters"
 ENG_a_golden_age_of_letters_desc:0 "Never has English literature been so rich or so widely read. The Victorian age will be remembered as one of the great ages of the mind."
 ENG_the_home_office:0 "The Home Office"
 ENG_the_home_office_desc:0 "Police, prisons, factories, mines and burial grounds: the Home Secretary answers for the domestic peace of the kingdom."
 ENG_the_metropolitan_police:0 "The Metropolitan Police"
 ENG_the_metropolitan_police_desc:0 "Sir Richard Mayne's peelers have kept the peace of London for forty years without a sword or a gun."
 ENG_end_public_executions:0 "End Public Executions"
 ENG_end_public_executions_desc:0 "The hangings outside Newgate are drunken carnivals. Henceforward executions will take place inside the prison walls."
 ENG_the_convict_prisons:0 "The Convict Prisons"
 ENG_the_convict_prisons_desc:0 "Portland, Dartmoor, Chatham and Pentonville hold the men sentenced to penal servitude."
 ENG_the_detective_department:0 "The Detective Department"
 ENG_the_detective_department_desc:0 "Plain-clothes officers at Scotland Yard will pursue the forger, the swindler and the conspirator."
 ENG_habitual_criminals_act:0 "The Habitual Criminals Act"
 ENG_habitual_criminals_act_desc:0 "Twice-convicted men will be kept under police supervision after their release, and may be arrested on suspicion."
 ENG_end_of_transportation:0 "The End of Transportation"
 ENG_end_of_transportation_desc:0 "The Hougoumont has landed the last convicts in Western Australia. Britain must keep her criminals at home."
 ENG_special_constables:0 "Special Constables"
 ENG_special_constables_desc:0 "After the Clerkenwell explosion, a hundred and sixty thousand citizens were sworn in as special constables in a single winter."
 ENG_prevention_of_crimes_act:0 "The Prevention of Crimes Act"
 ENG_prevention_of_crimes_act_desc:0 "Receivers of stolen goods and men without visible means of support will feel the weight of the law."
 ENG_du_canes_system:0 "Du Cane's System"
 ENG_du_canes_system_desc:0 "Hard labour, hard fare and hard board: Captain Du Cane's convict prisons will be uniform, economical and feared."
 ENG_the_parks_regulation_act:0 "The Parks Regulation Act"
 ENG_the_parks_regulation_act_desc:0 "Hyde Park will be open to meetings, but under rules. The Reform League will not tear down the railings a second time."
 ENG_the_queens_peace:0 "The Queen's Peace"
 ENG_the_queens_peace_desc:0 "Crime is falling, the streets are safer than ever before, and the rule of law runs from Land's End to John o' Groats."
 ENG_the_railway_age:0 "The Railway Age"
 ENG_the_railway_age_desc:0 "The railway mania is over, but the building goes on: branch lines, junctions, termini and the great trunk routes to the North."
 ENG_the_midland_main_line:0 "The Midland Main Line"
 ENG_the_midland_main_line_desc:0 "The Midland Railway will have its own road to London, and its own terminus, rather than pay tolls to the Great Northern."
 ENG_railway_regulation_act:0 "The Regulation of Railways Act"
 ENG_railway_regulation_act_desc:0 "The companies must report every accident and publish their accounts to the Board of Trade."
 ENG_the_underground:0 "The Underground Railway"
 ENG_the_underground_desc:0 "The Metropolitan Railway carries twenty million passengers a year beneath the streets of London, in steam and smoke."
 ENG_st_pancras:0 "St Pancras"
 ENG_st_pancras_desc:0 "Barlow's train shed is the widest single span in the world, and Scott's hotel will be the grandest in London."
 ENG_board_of_trade_inspectors:0 "The Railway Inspectorate"
 ENG_board_of_trade_inspectors_desc:0 "Captain Tyler and the Royal Engineer inspectors examine every new line and every disaster."
 ENG_crewe_and_swindon:0 "Crewe and Swindon"
 ENG_crewe_and_swindon_desc:0 "The railway towns build their own locomotives, carriages and rails. Crewe turns out an engine a week."
 ENG_the_block_system:0 "The Block System"
 ENG_the_block_system_desc:0 "Absolute block signalling and interlocked points: only one train in each section, and no conflicting signals."
 ENG_the_inner_circle:0 "The Inner Circle"
 ENG_the_inner_circle_desc:0 "The Metropolitan and the District will close the circle round the heart of London, if their chairmen ever stop quarrelling."
 ENG_third_class_for_all:0 "Third Class on Every Train"
 ENG_third_class_for_all_desc:0 "The Midland Railway admits third-class passengers to every train. The other companies must follow or lose their traffic."
 ENG_the_iron_road:0 "The Iron Road"
 ENG_the_iron_road_desc:0 "No country on earth is so well served by its railways. Coal, goods and people move faster and cheaper than ever before."
 ENG_coal_iron_and_steel:0 "Coal, Iron and Steel"
 ENG_coal_iron_and_steel_desc:0 "A hundred million tons of coal a year, and half the world's pig iron. The heavy trades are the sinews of the nation."
 ENG_the_coal_question:0 "The Coal Question"
 ENG_the_coal_question_desc:0 "Mr Jevons warns that our coal will not last for ever. A Royal Commission will count the reserves."
 ENG_barrow_in_furness:0 "Barrow-in-Furness"
 ENG_barrow_in_furness_desc:0 "A fishing village twenty years ago, Barrow now has the largest steelworks in the world and a dock to match."
 ENG_siemens_open_hearth:0 "The Open Hearth"
 ENG_siemens_open_hearth_desc:0 "Dr Siemens' regenerative furnace makes steel of a quality Bessemer's converter cannot match."
 ENG_coal_mines_regulation_act:0 "The Coal Mines Regulation Act"
 ENG_coal_mines_regulation_act_desc:0 "Certificated managers, more inspectors and no boys under twelve below ground. The coal owners protest at the cost."
 ENG_rhondda_steam_coal:0 "Rhondda Steam Coal"
 ENG_rhondda_steam_coal_desc:0 "Every navy in the world wants Welsh steam coal. The Rhondda valleys fill with pits and terraces."
 ENG_the_landore_works:0 "The Landore Works"
 ENG_the_landore_works_desc:0 "Dr Siemens' own steelworks at Landore proves the open hearth on an industrial scale."
 ENG_steel_rails:0 "Steel Rails"
 ENG_steel_rails_desc:0 "A steel rail outlasts ten iron ones. The railway companies are relaying their main lines."
 ENG_armour_plate:0 "Armour Plate"
 ENG_armour_plate_desc:0 "Cammell and John Brown roll armour plate for the Navy in their Sheffield mills."
 ENG_the_coal_famine:0 "The Coal Famine"
 ENG_the_coal_famine_desc:0 "Coal has doubled in price. Colliers earn record wages, householders shiver, and manufacturers curse."
 ENG_iron_and_steel_institute:0 "The Iron and Steel Institute"
 ENG_iron_and_steel_institute_desc:0 "The ironmasters found their own learned society, to share discoveries rather than guard them."
 ENG_iron_and_coal:0 "Iron and Coal"
 ENG_iron_and_coal_desc:0 "The furnaces of Middlesbrough, Sheffield and South Wales burn day and night. Britain forges the world's iron."
 ENG_the_mills:0 "The Mills"
 ENG_the_mills_desc:0 "The Cotton Famine is over. Lancashire, Yorkshire and the Scottish lowlands must win back and widen their markets."
 ENG_oldham_limiteds:0 "The Oldham Limiteds"
 ENG_oldham_limiteds_desc:0 "Working men buy shares in new joint-stock spinning mills. Oldham will soon have more spindles than France."
 ENG_the_worsted_trade:0 "The Worsted Trade"
 ENG_the_worsted_trade_desc:0 "Bradford's merchants sell wool cloth to the world, while the Germans and French close their markets."
 ENG_new_sources_of_cotton:0 "New Sources of Cotton"
 ENG_new_sources_of_cotton_desc:0 "Never again shall Lancashire depend on the slave states. Cotton must come from India, Egypt and Brazil."
 ENG_the_cotton_exchange:0 "The Liverpool Cotton Exchange"
 ENG_the_cotton_exchange_desc:0 "The Liverpool brokers fix the price of raw cotton for the whole world, and trade futures by cable."
 ENG_dundee_jute:0 "Dundee Jute"
 ENG_dundee_jute_desc:0 "Juteopolis spins the sacking that carries the world's grain and coffee."
 ENG_egyptian_cotton:0 "Egyptian Cotton"
 ENG_egyptian_cotton_desc:0 "The Khedive's long-staple cotton is the finest in the world, and Alexandria's merchants want British capital."
 ENG_mill_towns:0 "The Mill Towns"
 ENG_mill_towns_desc:0 "Blackburn, Bolton, Preston and Burnley grow by a street a week. The mill chimney is the spire of the new England."
 ENG_platt_brothers:0 "The Textile Machine Makers"
 ENG_platt_brothers_desc:0 "Platt Brothers of Oldham is the largest engineering works in the world, and sells its mules to every rival."
 ENG_raw_cotton_security:0 "Raw Cotton Security"
 ENG_raw_cotton_security_desc:0 "With supplies from three continents, a war in one can no longer starve the mills."
 ENG_clothing_the_world:0 "Clothing the World"
 ENG_clothing_the_world_desc:0 "From Shanghai to Valparaiso, the world wears Lancashire cotton. Two thirds of all cloth in international trade is British."
 ENG_the_money_market:0 "The Money Market"
 ENG_the_money_market_desc:0 "After Overend, Gurney the City has rebuilt its confidence. Lombard Street lends to the world again."
 ENG_joint_stock_banks:0 "The Joint-Stock Banks"
 ENG_joint_stock_banks_desc:0 "The London and Westminster and the London and County gather deposits from every High Street in the land."
 ENG_the_stock_exchange:0 "The Stock Exchange"
 ENG_the_stock_exchange_desc:0 "The House in Capel Court lists railways, mines and governments from every corner of the globe."
 ENG_lloyds_of_london:0 "Lloyd's of London"
 ENG_lloyds_of_london_desc:0 "Lloyd's Act gives the underwriters their own corporation. Every ship afloat is insured in the Room."
 ENG_foreign_government_loans:0 "Foreign Government Loans"
 ENG_foreign_government_loans_desc:0 "Barings and the Rothschilds float loans for Egypt, Peru, Turkey and the Argentine. Some will never be repaid."
 ENG_the_companies_acts:0 "Limited Liability"
 ENG_the_companies_acts_desc:0 "Any seven men may now form a company with limited liability. Enterprise flourishes, and so does fraud."
 ENG_the_clearing_banks:0 "The Clearing Banks"
 ENG_the_clearing_banks_desc:0 "The Bankers' Clearing House settles millions of cheques a day with barely a sovereign changing hands."
 ENG_the_vienna_crash:0 "The Crash of 1873"
 ENG_the_vienna_crash_desc:0 "Vienna, then New York: the boom is over across the world. London must stand firm while others panic."
 ENG_the_silver_question:0 "The Silver Question"
 ENG_the_silver_question_desc:0 "Germany has adopted gold and dumps its silver. Britain holds to gold, whatever the bimetallists say."
 ENG_weather_the_depression:0 "Weather the Depression"
 ENG_weather_the_depression_desc:0 "Prices are falling everywhere. British industry must cut its costs and keep its markets."
 ENG_the_worlds_banker:0 "The World's Banker"
 ENG_the_worlds_banker_desc:0 "A bill on London is the currency of world trade. The City is the clearing house of the globe."
 ENG_the_land:0 "The Land"
 ENG_the_land_desc:0 "High farming has brought prosperity to the shires. But the labourer earns twelve shillings a week, and the foreign grain ships are coming."
 ENG_the_agricultural_labourer:0 "The Agricultural Labourer"
 ENG_the_agricultural_labourer_desc:0 "Hodge works from dawn to dusk for wages that would shame a mill hand. The Royal Commission's reports make grim reading."
 ENG_steam_ploughing:0 "Steam Ploughing"
 ENG_steam_ploughing_desc:0 "Fowler's engines haul ploughs across the field on steel cables. Labour is saved, and labourers are laid off."
 ENG_the_great_estates:0 "The Great Estates"
 ENG_the_great_estates_desc:0 "Settled estates pass intact from father to son. The landed interest is the ballast of the constitution."
 ENG_joseph_arch:0 "Joseph Arch's Union"
 ENG_joseph_arch_desc:0 "A Warwickshire hedge-cutter has founded the National Agricultural Labourers' Union. A hundred thousand join within a year."
 ENG_royal_agricultural_society:0 "The Royal Agricultural Society"
 ENG_royal_agricultural_society_desc:0 "Shows, trials and a journal spread the science of farming from estate to estate."
 ENG_drainage_loans:0 "Drainage Loans"
 ENG_drainage_loans_desc:0 "Public loans for underdrainage turn cold clay into good corn land."
 ENG_revolt_of_the_field:0 "The Revolt of the Field"
 ENG_revolt_of_the_field_desc:0 "The farmers lock out the union men. Will the labourers starve, emigrate or win?"
 ENG_the_new_domesday:0 "The New Domesday"
 ENG_the_new_domesday_desc:0 "The Return of Owners of Land will show who owns England. The Radicals expect it to prove their case."
 ENG_american_grain:0 "American Grain"
 ENG_american_grain_desc:0 "The prairies and the railroads send cheap wheat across the Atlantic. Bread is cheaper; rents will fall."
 ENG_the_land_question:0 "Free Trade in Land"
 ENG_the_land_question_desc:0 "Abolish entail, simplify conveyancing and let land be bought and sold like any other commodity."
 ENG_the_golden_age_of_agriculture:0 "The Golden Age of Agriculture"
 ENG_the_golden_age_of_agriculture_desc:0 "Rents are high, harvests good and the shires prosperous. It may be the last such age British farming will see."
 ENG_the_ordnance:0 "The Ordnance"
 ENG_the_ordnance_desc:0 "The Board of Ordnance is long gone, but the guns, rifles and powder of the Army and Navy still come from the State's own factories."
 ENG_the_woolwich_arsenal:0 "The Royal Arsenal"
 ENG_the_woolwich_arsenal_desc:0 "Woolwich employs ten thousand men in its gun factory, carriage department and laboratory. It is the largest arsenal in the world."
 ENG_armstrong_and_whitworth:0 "The Great Gun Controversy"
 ENG_armstrong_and_whitworth_desc:0 "Sir William Armstrong and Mr Whitworth have fought for ten years over whose gun is best. The Army must choose."
 ENG_enfield_lock_factory:0 "The Royal Small Arms Factory"
 ENG_enfield_lock_factory_desc:0 "Enfield's American machinery turns out interchangeable rifles by the hundred thousand."
 ENG_royal_gun_factory:0 "The Royal Gun Factory"
 ENG_royal_gun_factory_desc:0 "Built-up wrought-iron guns of every calibre, from the field nine-pounder to the thirty-eight-ton monster for the turret ships."
 ENG_the_elswick_works:0 "The Elswick Works"
 ENG_the_elswick_works_desc:0 "Armstrong's Tyneside works sells guns to every navy in the world. Should the Queen's forces buy from it too?"
 ENG_ordnance_select_committee:0 "The Ordnance Select Committee"
 ENG_ordnance_select_committee_desc:0 "A committee of experts will test every new gun, rifle and shell before it is adopted."
 ENG_the_birmingham_gunmakers:0 "Birmingham Small Arms"
 ENG_the_birmingham_gunmakers_desc:0 "The Birmingham gunmakers' company will supply rifles when Enfield cannot keep up, and to foreign armies when it can."
 ENG_palliser_shot:0 "Palliser Shot"
 ENG_palliser_shot_desc:0 "Major Palliser's chilled-iron shot pierces armour that cast iron cannot scratch."
 ENG_the_gatling_gun:0 "The Gatling Gun"
 ENG_the_gatling_gun_desc:0 "The Committee's trials show the American revolving gun firing four hundred rounds a minute. The Royal Artillery is unconvinced."
 ENG_the_moncrieff_carriage:0 "The Moncrieff Carriage"
 ENG_the_moncrieff_carriage_desc:0 "Captain Moncrieff's disappearing carriage uses the gun's own recoil to drop it behind the parapet for loading."
 ENG_breechloader_question:0 "The Breech-Loader Question"
 ENG_breechloader_question_desc:0 "The Prussians have breech-loading field guns. Woolwich insists that muzzle-loaders are safer, simpler and cheaper."
 ENG_arsenal_of_the_empire:0 "Arsenal of the Empire"
 ENG_arsenal_of_the_empire_desc:0 "From the Martini-Henry to the eighty-ton gun, the Queen's forces are armed by British industry, and armed well."
 ENG_home_defence:0 "Home Defence"
 ENG_home_defence_desc:0 "The Channel is no longer the barrier it was; steam has bridged it. How would England resist an invasion?"
 ENG_the_palmerston_forts:0 "The Palmerston Forts"
 ENG_the_palmerston_forts_desc:0 "The great ring of forts around Portsmouth and Plymouth is nearly complete. Critics call them Palmerston's Follies."
 ENG_the_battle_of_dorking:0 "The Battle of Dorking"
 ENG_the_battle_of_dorking_desc:0 "Colonel Chesney's tale of a German invasion sells eighty thousand copies. The country is in a fright."
 ENG_the_royal_engineers:0 "The Royal Engineers"
 ENG_the_royal_engineers_desc:0 "Sappers build the forts, the barracks, the telegraphs and the survey of the Empire."
 ENG_coast_artillery_volunteers:0 "The Artillery Volunteers"
 ENG_coast_artillery_volunteers_desc:0 "Volunteer gunners will man the coast batteries, freeing the Royal Artillery for the field army."
 ENG_school_of_military_engineering:0 "The School of Military Engineering"
 ENG_school_of_military_engineering_desc:0 "Chatham trains officers in fortification, mining, telegraphy and photography."
 ENG_the_mobilisation_scheme:0 "The Mobilisation Scheme"
 ENG_the_mobilisation_scheme_desc:0 "Every regular, militia and volunteer unit will have its place in eight army corps for home defence."
 ENG_the_reserve_forces_act:0 "The Army Reserve"
 ENG_the_reserve_forces_act_desc:0 "Discharged soldiers will be paid a retainer to rejoin the colours in an emergency."
 ENG_submarine_mining:0 "Submarine Mining"
 ENG_submarine_mining_desc:0 "Engineer companies will lay electrically fired mines across the entrances of every naval harbour."
 ENG_an_englishmans_home:0 "An Englishman's Home"
 ENG_an_englishmans_home_desc:0 "Forts, mines, reservists and volunteers in their hundreds of thousands: any invader would find England a hard nut to crack."
 ENG_soldiers_of_the_queen:0 "Soldiers of the Queen"
 ENG_soldiers_of_the_queen_desc:0 "The Army takes the men nobody else wants, then wonders why its men are no better. Recruiting begins with the barracks."
 ENG_end_flogging_in_peacetime:0 "Abolish Flogging in Peacetime"
 ENG_end_flogging_in_peacetime_desc:0 "The lash will no longer be used on soldiers at home in time of peace. The old colonels predict the end of discipline."
 ENG_army_medical_department:0 "The Army Medical Department"
 ENG_army_medical_department_desc:0 "Miss Nightingale's lessons from the Crimea have not been forgotten. The soldier must be kept healthy, not merely buried."
 ENG_army_schools:0 "The Army Schools"
 ENG_army_schools_desc:0 "Every regiment will have its school, and every soldier the chance to earn a certificate of education."
 ENG_married_quarters:0 "Married Quarters"
 ENG_married_quarters_desc:0 "Wives and children will no longer sleep behind a blanket in the corner of the barrack room."
 ENG_sanitary_barracks:0 "Barrack Improvement"
 ENG_sanitary_barracks_desc:0 "Ventilation, drains and space: the barracks death rate is twice the civilian rate, and must be brought down."
 ENG_army_schoolmasters:0 "The Corps of Army Schoolmasters"
 ENG_army_schoolmasters_desc:0 "Trained schoolmasters will teach soldiers to read, write and reckon, and their children too."
 ENG_temperance_in_the_ranks:0 "Temperance in the Ranks"
 ENG_temperance_in_the_ranks_desc:0 "Drink is the curse of the Army. Temperance societies and coffee rooms will offer the soldier another way."
 ENG_royal_victoria_hospital:0 "The Royal Victoria Hospital"
 ENG_royal_victoria_hospital_desc:0 "Netley's quarter-mile corridor houses the Army Medical School and a thousand beds for invalided soldiers."
 ENG_good_conduct_pay:0 "Good Conduct Pay"
 ENG_good_conduct_pay_desc:0 "Every badge on the sleeve brings an extra penny a day. Long service and good behaviour will be rewarded."
 ENG_tommy_atkins:0 "Tommy Atkins"
 ENG_tommy_atkins_desc:0 "The British soldier is better fed, better housed, better taught and better treated than ever before, and the recruiting sergeant feels the difference."
 ENG_the_royal_dockyards:0 "The Royal Dockyards"
 ENG_the_royal_dockyards_desc:0 "The dockyards were built for wooden ships of the line. Ironclads need deeper basins, bigger docks and steam factories."
 ENG_chatham_extension:0 "The Chatham Extension"
 ENG_chatham_extension_desc:0 "Three great basins are being dug out of St Mary's Island, the largest dockyard works in the world."
 ENG_keyham_steam_yard:0 "The Keyham Steam Yard"
 ENG_keyham_steam_yard_desc:0 "Devonport's steam factory will build and repair the engines of the Western fleet."
 ENG_bermuda_floating_dock:0 "The Bermuda Floating Dock"
 ENG_bermuda_floating_dock_desc:0 "The largest floating dock ever built is towed across the Atlantic to give the North American squadron a dock of its own."
 ENG_pembroke_dockyard:0 "Pembroke Dockyard"
 ENG_pembroke_dockyard_desc:0 "The Welsh yard builds ironclads on its slips, far from the dangers of the Channel."
 ENG_malta_dockyard:0 "The Malta Dockyard"
 ENG_malta_dockyard_desc:0 "The Mediterranean Fleet needs a dock that can take an ironclad. The Somerset Dock will be cut in the rock of Malta."
 ENG_the_great_basins:0 "The Great Basins"
 ENG_the_great_basins_desc:0 "Portsmouth's great extension will give the fleet a tidal basin, three docks and miles of quay."
 ENG_the_contract_builders:0 "The Contract Builders"
 ENG_the_contract_builders_desc:0 "Laird, Napier, Samuda and Palmers build ironclads faster than the Royal Dockyards, and for foreign navies too."
 ENG_coaling_depots:0 "Coaling Depots"
 ENG_coaling_depots_desc:0 "Hulks and sheds of Welsh coal at every station: a steamer is only as good as its next bunker."
 ENG_close_woolwich_and_deptford:0 "Close Woolwich and Deptford"
 ENG_close_woolwich_and_deptford_desc:0 "The two oldest yards are too shallow for ironclads. Close them and save the money, whatever the shipwrights say."
 ENG_dockyard_accounts:0 "Dockyard Accounts"
 ENG_dockyard_accounts_desc:0 "Mr Childers will know what every ship costs. The dockyard officers resent the clerks from Whitehall."
 ENG_the_fleets_workshop:0 "The Fleet's Workshop"
 ENG_the_fleets_workshop_desc:0 "Britain can build, arm, dock and repair ironclads faster than any two rivals combined."
 ENG_gunnery_and_tactics:0 "Gunnery and Tactics"
 ENG_gunnery_and_tactics_desc:0 "Nobody has fought a fleet action under steam except the Austrians and Italians at Lissa. How will the next sea battle be fought?"
 ENG_hms_excellent:0 "HMS Excellent"
 ENG_hms_excellent_desc:0 "The gunnery school at Portsmouth trains every gunner in the fleet. Accuracy, not rate of fire, wins battles."
 ENG_lessons_of_lissa:0 "The Lessons of Lissa"
 ENG_lessons_of_lissa_desc:0 "Tegetthoff rammed and sank the Re d'Italia. Every navy in the world now fits its ironclads with rams."
 ENG_committee_on_designs:0 "The Committee on Designs"
 ENG_committee_on_designs_desc:0 "After the loss of the Captain, a committee of experts will decide what kind of ship the Navy should build."
 ENG_the_ram_bow:0 "The Ram Bow"
 ENG_the_ram_bow_desc:0 "A ship that can ram need not hit with her guns. Others warn that the ram sinks friends as readily as enemies."
 ENG_steam_tactics:0 "Steam Evolutions"
 ENG_steam_tactics_desc:0 "Squadrons will learn to manoeuvre in line abreast and in groups, independent of the wind."
 ENG_abandon_the_masts:0 "Abandon the Masts"
 ENG_abandon_the_masts_desc:0 "HMS Devastation carries no sail at all. The old admirals are horrified; the engineers are triumphant."
 ENG_hms_vernon:0 "HMS Vernon"
 ENG_hms_vernon_desc:0 "A torpedo school is established at Portsmouth to master the Whitehead fish torpedo and the electric mine."
 ENG_fleet_manoeuvres:0 "Fleet Manoeuvres"
 ENG_fleet_manoeuvres_desc:0 "The Channel Squadron will exercise in the Atlantic every summer, by day and by night."
 ENG_torpedo_defence:0 "Torpedo Defence"
 ENG_torpedo_defence_desc:0 "Nets, booms, searchlights and quick-firing guns must protect the fleet at anchor from the new weapon."
 ENG_the_citadel_ironclad:0 "The Citadel Ironclad"
 ENG_the_citadel_ironclad_desc:0 "A central citadel of the thickest armour, carrying the heaviest guns ever mounted afloat. Mr Barnaby is already drawing her lines."
 ENG_the_steam_navy:0 "The Steam Navy"
 ENG_the_steam_navy_desc:0 "The last ship of the line has been paid off. The fleet of turrets, rams and torpedoes is ready for any foe."
 ENG_policing_the_seas:0 "Policing the Seas"
 ENG_policing_the_seas_desc:0 "Most of the Navy is not in the Channel but on distant stations, chasing slavers, pirates and the Queen's enemies."
 ENG_west_africa_squadron:0 "The West Africa Squadron"
 ENG_west_africa_squadron_desc:0 "The Atlantic slave trade is all but dead. The squadron's work is nearly done, but not quite."
 ENG_the_china_station:0 "The China Station"
 ENG_the_china_station_desc:0 "Gunboats on the Yangtze and corvettes in the treaty ports protect British trade with the Celestial Empire."
 ENG_the_hydrographic_office:0 "The Hydrographic Office"
 ENG_the_hydrographic_office_desc:0 "Admiralty charts cover every sea, and every navy uses them."
 ENG_slave_trade_treaties:0 "The Slave Trade Treaties"
 ENG_slave_trade_treaties_desc:0 "With Spain closing the Cuban trade and America's right of search conceded, the Atlantic slavers have nowhere left to hide."
 ENG_dhow_patrols:0 "The Dhow Patrols"
 ENG_dhow_patrols_desc:0 "Boats from the East Indies station chase the Arab slave dhows running from Zanzibar to the Gulf."
 ENG_pirates_of_the_china_seas:0 "Pirates of the China Seas"
 ENG_pirates_of_the_china_seas_desc:0 "Junks of pirates infest the coasts from Hong Kong to Hainan. The gunboats burn them in their creeks."
 ENG_admiralty_charts:0 "Admiralty Charts"
 ENG_admiralty_charts_desc:0 "Surveying ships chart the shoals of every coast. Merchant captains of every nation steer by them."
 ENG_the_last_slavers:0 "The Last Slavers"
 ENG_the_last_slavers_desc:0 "The Royal Navy will not rest while a single slaver sails. It is the one war the British public never tires of."
 ENG_gunboat_diplomacy:0 "Gunboat Diplomacy"
 ENG_gunboat_diplomacy_desc:0 "Where a consul's protest fails, a gunboat in the harbour rarely does."
 ENG_survey_of_the_seas:0 "The Survey of the Seas"
 ENG_survey_of_the_seas_desc:0 "No coast is too remote for the surveying ships, and no reef too small to be charted."
 ENG_policeman_of_the_oceans:0 "The Policeman of the Oceans"
 ENG_policeman_of_the_oceans_desc:0 "The seas are free and safe for the commerce of all nations, because the Royal Navy keeps them so."
 ENG_the_royal_family:0 "The Royal Family"
 ENG_the_royal_family_desc:0 "Nine children, and grandchildren by the dozen: the Queen's family will soon sit on half the thrones of Europe."
 ENG_prince_alfreds_voyage:0 "The Voyage of the Galatea"
 ENG_prince_alfreds_voyage_desc:0 "The Duke of Edinburgh will take his frigate round the world, the first royal prince to visit the Australian colonies."
 ENG_general_ponsonby:0 "The Private Secretary"
 ENG_general_ponsonby_desc:0 "Colonel Ponsonby, tactful, liberal and discreet, will stand between the Queen and her ministers."
 ENG_princess_louises_marriage:0 "Princess Louise's Marriage"
 ENG_princess_louises_marriage_desc:0 "The Queen's daughter will marry a subject, the Marquess of Lorne. No princess has done so since 1515."
 ENG_the_clontarf_shooting:0 "The Clontarf Shooting"
 ENG_the_clontarf_shooting_desc:0 "A Fenian sympathiser has shot the Duke of Edinburgh at a picnic in Sydney. The colony erupts in loyal fury."
 ENG_prince_arthur_in_canada:0 "Prince Arthur in Canada"
 ENG_prince_arthur_in_canada_desc:0 "The Queen's favourite son serves with his regiment in Montreal and is fêted across the Dominion."
 ENG_the_royal_household:0 "The Royal Household"
 ENG_the_royal_household_desc:0 "Equerries, ladies-in-waiting and Highland servants: the household must be managed with economy and tact."
 ENG_the_royal_dowries:0 "The Royal Dowries"
 ENG_the_royal_dowries_desc:0 "Thirty thousand pounds for Princess Louise and an annuity for Prince Arthur: the Radicals oppose every penny."
 ENG_royal_tours_of_the_empire:0 "Royal Tours of the Empire"
 ENG_royal_tours_of_the_empire_desc:0 "A prince in every colony: royal visits bind the Empire to the Crown more tightly than any Act of Parliament."
 ENG_the_albert_memorial:0 "The Albert Memorial"
 ENG_the_albert_memorial_desc:0 "Mr Scott's great Gothic shrine to the Prince Consort is unveiled in Kensington Gardens."
 ENG_the_mordaunt_scandal:0 "The Mordaunt Divorce Case"
 ENG_the_mordaunt_scandal_desc:0 "The Prince of Wales is called as a witness in a society divorce case. He denies everything; nobody believes him."
 ENG_the_family_on_the_throne:0 "The Family on the Throne"
 ENG_the_family_on_the_throne_desc:0 "The monarchy is no longer merely the Queen but a family, and the family belongs to the nation and the Empire."
 ENG_church_and_chapel:0 "Church and Chapel"
 ENG_church_and_chapel_desc:0 "Half the nation worships in the parish church and half in the chapel. Religion is the most divisive force in English politics."
 ENG_the_established_church:0 "The Established Church"
 ENG_the_established_church_desc:0 "The Church of England is by law established, its bishops sit in the Lords, and its parsons hold the parishes."
 ENG_the_nonconformist_conscience:0 "The Nonconformist Conscience"
 ENG_the_nonconformist_conscience_desc:0 "Methodists, Baptists, Congregationalists and Quakers are the backbone of the Liberal party, and they expect their reward."
 ENG_the_catholic_revival:0 "The Catholic Revival"
 ENG_the_catholic_revival_desc:0 "Archbishop Manning presides over a Catholic Church growing with every Irish immigrant and every Oxford convert."
 ENG_the_ritualists:0 "The Ritualist Controversy"
 ENG_the_ritualists_desc:0 "Vestments, candles and incense in Anglican churches: is the Church of England being led back to Rome?"
 ENG_the_lambeth_conference:0 "The Lambeth Conference"
 ENG_the_lambeth_conference_desc:0 "Seventy-six bishops of the Anglican Communion meet at Lambeth for the first time."
 ENG_the_liberation_society:0 "The Liberation Society"
 ENG_the_liberation_society_desc:0 "Mr Miall's society campaigns for the disestablishment of the Church of England itself."
 ENG_the_christian_mission:0 "The Christian Mission"
 ENG_the_christian_mission_desc:0 "William Booth preaches to the drunkards and outcasts of the East End, and organises his converts like an army."
 ENG_papal_infallibility:0 "Papal Infallibility"
 ENG_papal_infallibility_desc:0 "The Vatican Council has declared the Pope infallible. Can a Catholic be a loyal subject of a Protestant Queen?"
 ENG_church_defence:0 "Church Defence"
 ENG_church_defence_desc:0 "The Church Defence Institution rallies loyal Anglicans against the Liberationists."
 ENG_moody_and_sankey:0 "Moody and Sankey"
 ENG_moody_and_sankey_desc:0 "Two American evangelists fill the halls of Britain with hymns and sermons. Revival sweeps the land."
 ENG_the_vatican_decrees:0 "The Vatican Decrees"
 ENG_the_vatican_decrees_desc:0 "Mr Gladstone's pamphlet on the Vatican Decrees sells a hundred and fifty thousand copies. The Catholic bishops are furious."
 ENG_a_christian_nation:0 "A Christian Nation"
 ENG_a_christian_nation_desc:0 "Divided as they are, the churches give the nation its morality, its charities and its sense of duty."
 ENG_the_great_game:0 "The Great Game"
 ENG_the_great_game_desc:0 "Russian columns are advancing across the steppe towards Bokhara and Khiva. Where will they stop, and how close to India?"
 ENG_the_cretan_revolt:0 "The Cretan Revolt"
 ENG_the_cretan_revolt_desc:0 "The Christians of Crete have risen against the Sultan. Philhellenes demand intervention; the Foreign Office counsels patience."
 ENG_the_russian_advance:0 "The Russian Advance"
 ENG_the_russian_advance_desc:0 "Tashkent has fallen; Samarkand will be next. Each Russian victory is cheered in St Petersburg and studied in Simla."
 ENG_the_persian_connection:0 "The Persian Connection"
 ENG_the_persian_connection_desc:0 "The Shah's friendship is the first line of India's defence. The telegraph to India already runs across his kingdom."
 ENG_masterly_inactivity:0 "Masterly Inactivity"
 ENG_masterly_inactivity_desc:0 "Lord Lawrence's policy: leave the Afghans alone, strengthen India, and let the Russians exhaust themselves in the desert."
 ENG_the_forward_policy:0 "The Forward Policy"
 ENG_the_forward_policy_desc:0 "Meet the Russians in the mountain passes, not on the plains of the Punjab. Afghanistan must be a British buffer."
 ENG_the_seistan_arbitration:0 "The Seistan Arbitration"
 ENG_the_seistan_arbitration_desc:0 "General Goldsmid will draw the border between Persia and Afghanistan. Neither will be satisfied."
 ENG_ottoman_reform:0 "Ottoman Reform"
 ENG_ottoman_reform_desc:0 "British money and British advice will help the Sultan modernise his empire, if his pashas will let him."
 ENG_the_ambala_durbar:0 "The Ambala Durbar"
 ENG_the_ambala_durbar_desc:0 "Lord Mayo receives the Amir Sher Ali with pomp and presents, but no treaty. Afghanistan is courted, not bound."
 ENG_gorchakov_talks:0 "Talks with Prince Gorchakov"
 ENG_gorchakov_talks_desc:0 "A neutral zone between the two empires would spare both a ruinous war. The talks drag on for years."
 ENG_the_fall_of_khiva:0 "The Fall of Khiva"
 ENG_the_fall_of_khiva_desc:0 "General Kaufmann has taken Khiva. The Russophobes say the road to Herat lies open."
 ENG_the_oxus_boundary:0 "The Oxus Boundary"
 ENG_the_oxus_boundary_desc:0 "Lord Granville and Prince Gorchakov agree that the Oxus shall be Afghanistan's northern border."
 ENG_guardians_of_india:0 "Guardians of the Road to India"
 ENG_guardians_of_india_desc:0 "From Constantinople to Kabul, Britain watches every road that leads to India. Let the Tsar take note."
 ENG_the_european_balance:0 "The European Balance"
 ENG_the_european_balance_desc:0 "Prussia has beaten Austria; France is uneasy; Italy and Spain are in flux. Europe's map is being redrawn."
 ENG_the_ausgleich:0 "The Ausgleich"
 ENG_the_ausgleich_desc:0 "The Habsburg Empire becomes Austria-Hungary. Count Beust looks to London for friendship."
 ENG_the_spanish_revolution:0 "The Spanish Revolution"
 ENG_the_spanish_revolution_desc:0 "Queen Isabella has fled to France. The generals in Madrid are looking for a new king, anywhere in Europe."
 ENG_the_roman_question:0 "The Roman Question"
 ENG_the_roman_question_desc:0 "Only French bayonets keep the Pope in Rome. When they go, the Italians will march in."
 ENG_friendship_with_vienna:0 "Friendship with Vienna"
 ENG_friendship_with_vienna_desc:0 "Austria-Hungary is the natural ally of Britain in the East: both want the Turk upheld and the Russian kept back."
 ENG_the_hohenzollern_candidature:0 "The Hohenzollern Candidature"
 ENG_the_hohenzollern_candidature_desc:0 "Bismarck has offered a Prussian prince for the Spanish throne. Paris erupts. Can Lord Granville calm the storm?"
 ENG_italy_completed:0 "Italy Completed"
 ENG_italy_completed_desc:0 "Rome is the capital of a united Italy at last. Britain, which cheered Garibaldi, welcomes it."
 ENG_foreign_enlistment_act:0 "The Foreign Enlistment Act"
 ENG_foreign_enlistment_act_desc:0 "No British ship shall be fitted out for a belligerent again. The Alabama has taught us that lesson."
 ENG_the_paris_commune:0 "The Paris Commune"
 ENG_the_paris_commune_desc:0 "Paris is in the hands of the Commune. Refugees, communards and reactionaries pour into London alike."
 ENG_the_three_emperors:0 "The Three Emperors"
 ENG_the_three_emperors_desc:0 "Berlin, Vienna and St Petersburg draw together. Britain may find herself without a friend on the Continent."
 ENG_strict_neutrality:0 "Strict Neutrality"
 ENG_strict_neutrality_desc:0 "Britain will trade with all and fight for none, unless her own interests are directly at stake."
 ENG_the_new_balance:0 "The New Balance"
 ENG_the_new_balance_desc:0 "A united Germany is the strongest power in Europe. Britain must adjust to the new order of things."
 ENG_arbiter_of_europe:0 "Arbiter of Europe"
 ENG_arbiter_of_europe_desc:0 "No great question in Europe can be settled without Britain. She remains the holder of the balance."
 ENG_the_far_east:0 "The Far East"
 ENG_the_far_east_desc:0 "The Middle Kingdom and the Land of the Rising Sun are opening their doors. British merchants mean to be first through them."
 ENG_the_treaty_ports:0 "The Treaty Ports"
 ENG_the_treaty_ports_desc:0 "Shanghai, Canton and the Yangtze ports are open to British merchants under British consuls and British law."
 ENG_the_meiji_restoration:0 "The Meiji Restoration"
 ENG_the_meiji_restoration_desc:0 "The Shogun has fallen and the young Emperor rules in Tokyo. Britain backed the winning side."
 ENG_siam_and_burma:0 "Siam and Burma"
 ENG_siam_and_burma_desc:0 "King Mindon of Burma and King Mongkut of Siam keep their independence by courting Britain."
 ENG_the_tianjin_massacre:0 "The Tianjin Massacre"
 ENG_the_tianjin_massacre_desc:0 "A mob has murdered French nuns and the consul at Tianjin. The Powers demand redress; gunboats gather."
 ENG_sir_harry_parkes:0 "Sir Harry Parkes"
 ENG_sir_harry_parkes_desc:0 "The fiery British Minister in Tokyo is the most influential foreigner in Japan."
 ENG_the_iwakura_mission:0 "The Iwakura Mission"
 ENG_the_iwakura_mission_desc:0 "Japan's leaders tour the dockyards and mills of Britain, studying how a modern nation is built."
 ENG_the_mandalay_treaty:0 "The Mandalay Treaty"
 ENG_the_mandalay_treaty_desc:0 "King Mindon opens his kingdom to British trade and accepts a Resident at his court."
 ENG_imperial_maritime_customs:0 "The Imperial Maritime Customs"
 ENG_imperial_maritime_customs_desc:0 "Robert Hart, an Ulsterman, collects the customs of the Chinese Empire with incorruptible efficiency."
 ENG_the_naval_mission_to_japan:0 "The Naval Mission to Japan"
 ENG_the_naval_mission_to_japan_desc:0 "Commander Douglas and thirty officers will train the Imperial Japanese Navy on British lines."
 ENG_the_open_door:0 "The Open Door to the East"
 ENG_the_open_door_desc:0 "From Rangoon to Yokohama, British trade, British ships and British consuls dominate the commerce of the East."
 ENG_trade_and_the_flag:0 "Trade and the Flag"
 ENG_trade_and_the_flag_desc:0 "The Foreign Office does not push trade, it is said. Perhaps it is time it did."
 ENG_the_cobden_treaty:0 "The Cobden Treaty"
 ENG_the_cobden_treaty_desc:0 "The commercial treaty with France has doubled trade between the two countries. It must be renewed."
 ENG_the_consular_service:0 "The Consular Service"
 ENG_the_consular_service_desc:0 "Consuls in every port protect British subjects, register British ships and report on foreign markets."
 ENG_latin_american_trade:0 "Latin American Trade"
 ENG_latin_american_trade_desc:0 "British capital builds the railways and ports of Argentina, Brazil and Chile."
 ENG_most_favoured_nation:0 "Most Favoured Nation"
 ENG_most_favoured_nation_desc:0 "Every treaty will give Britain whatever terms the most favoured nation enjoys."
 ENG_the_river_plate:0 "The River Plate"
 ENG_the_river_plate_desc:0 "Buenos Aires is a British city in all but name: British banks, British railways, British merchants."
 ENG_the_paraguayan_war:0 "The Paraguayan War"
 ENG_the_paraguayan_war_desc:0 "Brazil, Argentina and Uruguay are destroying Paraguay. British merchants supply all sides."
 ENG_defend_free_trade:0 "Defend Free Trade Abroad"
 ENG_defend_free_trade_desc:0 "Protectionist tariffs are rising again in France and America. Britain must hold the line."
 ENG_commercial_attaches:0 "Commercial Attachés"
 ENG_commercial_attaches_desc:0 "A commercial attaché at the great embassies will study and promote British trade."
 ENG_the_informal_empire:0 "The Informal Empire"
 ENG_the_informal_empire_desc:0 "Who needs colonies in South America when British capital already owns the railways, the banks and the debt?"
 ENG_trade_follows_the_flag:0 "Trade Follows the Flag"
 ENG_trade_follows_the_flag_desc:0 "British trade circles the globe, protected by British treaties, consuls and, where necessary, gunboats."
 ENG_the_viceroyalty:0 "The Viceroyalty"
 ENG_the_viceroyalty_desc:0 "Ten years after the Mutiny, the Crown rules India through a Viceroy in Calcutta and a Secretary of State in Whitehall."
 ENG_the_indian_civil_service:0 "The Indian Civil Service"
 ENG_the_indian_civil_service_desc:0 "The competition wallahs, chosen by examination, rule districts the size of Wales before they are thirty."
 ENG_mayos_finance:0 "Provincial Finance"
 ENG_mayos_finance_desc:0 "Lord Mayo gives each province fixed grants to manage its own roads, gaols and schools. The deficits must end."
 ENG_the_frontiers:0 "The Frontiers"
 ENG_the_frontiers_desc:0 "From the Black Mountain to the Lushai hills, the frontier tribes test the strength of the Raj every season."
 ENG_indians_in_the_service:0 "Indians in the Public Service"
 ENG_indians_in_the_service_desc:0 "An Act of 1870 allows Natives of India of proven merit to hold posts once reserved for the covenanted service."
 ENG_black_mountain_expedition:0 "The Black Mountain Expedition"
 ENG_black_mountain_expedition_desc:0 "Twelve thousand men march against the Hazara tribes who attacked the frontier post at Oghi."
 ENG_the_indian_universities:0 "The Indian Universities"
 ENG_the_indian_universities_desc:0 "Calcutta, Bombay and Madras turn out graduates in their thousands, educated in English and in English ideas."
 ENG_indian_public_works:0 "The Irrigation Canals"
 ENG_indian_public_works_desc:0 "The Ganges, Agra and Sirhind canals will water millions of acres. Public works will pay for themselves."
 ENG_the_kuka_rising:0 "The Kuka Rising"
 ENG_the_kuka_rising_desc:0 "The Namdhari sect has attacked Malerkotla. The Deputy Commissioner blows sixty-five prisoners from guns without trial."
 ENG_assassination_of_lord_mayo:0 "The Murder of Lord Mayo"
 ENG_assassination_of_lord_mayo_desc:0 "The Viceroy has been stabbed to death by a convict while inspecting the Andaman Islands penal settlement."
 ENG_the_bengal_famine:0 "The Bengal Famine"
 ENG_the_bengal_famine_desc:0 "Sir Richard Temple will import rice from Burma and spend whatever it takes. Not one life shall be lost. It costs six millions."
 ENG_the_jewel_in_the_crown:0 "The Jewel in the Crown"
 ENG_the_jewel_in_the_crown_desc:0 "India is the greatest possession of the British Crown, the source of its wealth, its armies and its pride."
 ENG_british_america:0 "British America"
 ENG_british_america_desc:0 "Confederation has given British North America a government of its own. The question is how much Britain still owes it."
 ENG_ruperts_land:0 "Rupert's Land"
 ENG_ruperts_land_desc:0 "The Hudson's Bay Company will sell its vast territories to the Dominion. The prairies are Canada's future."
 ENG_withdraw_the_garrisons:0 "Withdraw the Garrisons"
 ENG_withdraw_the_garrisons_desc:0 "Self-governing colonies must defend themselves. The regiments will leave Canada, all but the fortress of Halifax."
 ENG_the_leeward_islands:0 "The Leeward Islands"
 ENG_the_leeward_islands_desc:0 "Antigua, St Kitts, Nevis, Montserrat and the Virgin Islands will be federated under a single governor."
 ENG_the_red_river_resistance:0 "The Red River Resistance"
 ENG_the_red_river_resistance_desc:0 "Louis Riel and the Métis have seized Fort Garry and set up their own government. Ottawa calls for troops."
 ENG_british_columbia_joins:0 "British Columbia Joins"
 ENG_british_columbia_joins_desc:0 "The Pacific colony will enter Confederation, if the Dominion promises a railway across the Rockies."
 ENG_indentured_labour:0 "Indentured Labour"
 ENG_indentured_labour_desc:0 "Coolies from India cut the cane of Trinidad and British Guiana. Abolitionists call it slavery by another name."
 ENG_the_intercolonial_railway:0 "The Intercolonial Railway"
 ENG_the_intercolonial_railway_desc:0 "An imperial guarantee will raise the money for a line from Halifax to Quebec, on British soil all the way."
 ENG_prince_edward_island:0 "Prince Edward Island"
 ENG_prince_edward_island_desc:0 "The island colony, saddled with railway debts, will join the Dominion after all."
 ENG_the_sugar_colonies:0 "The Sugar Colonies"
 ENG_the_sugar_colonies_desc:0 "Beet sugar from the Continent is ruining the West Indian planters. Can the islands be saved?"
 ENG_the_loyal_dominion:0 "The Loyal Dominion"
 ENG_the_loyal_dominion_desc:0 "Canada stretches from sea to sea under the British Crown, self-governing, loyal and secure."
 ENG_southern_africa:0 "Southern Africa"
 ENG_southern_africa_desc:0 "Two British colonies, two Boer republics and a dozen African kingdoms share the south of the continent uneasily."
 ENG_basutoland:0 "Basutoland"
 ENG_basutoland_desc:0 "King Moshoeshoe, hard pressed by the Free State, begs to become a subject of the Queen."
 ENG_responsible_government:0 "Responsible Government at the Cape"
 ENG_responsible_government_desc:0 "The Cape Colony will govern itself under a ministry responsible to its own parliament."
 ENG_natal_and_shepstone:0 "Natal and Shepstone"
 ENG_natal_and_shepstone_desc:0 "Theophilus Shepstone rules the Africans of Natal through their own chiefs and their own law."
 ENG_the_orange_free_state:0 "The Orange Free State"
 ENG_the_orange_free_state_desc:0 "President Brand is a reasonable man. A frontier treaty with the Free State would save much trouble."
 ENG_the_cape_parliament:0 "Mr Molteno's Ministry"
 ENG_the_cape_parliament_desc:0 "The Cape's first prime minister wants self-government, not British adventures."
 ENG_griqualand_west:0 "Griqualand West"
 ENG_griqualand_west_desc:0 "The diamond fields will be annexed in the name of the Griqua chief Waterboer, whatever the Boers say."
 ENG_cetshwayos_coronation:0 "Cetshwayo's Coronation"
 ENG_cetshwayos_coronation_desc:0 "Shepstone himself crowns the new Zulu king. Britain must keep the friendship of the strongest army in Africa."
 ENG_the_keate_award:0 "The Keate Award"
 ENG_the_keate_award_desc:0 "The Governor of Natal draws the diamond fields border in Britain's favour. The Transvaal protests in vain."
 ENG_kimberley_mine:0 "The Kimberley Mine"
 ENG_kimberley_mine_desc:0 "Ten thousand diggers work three thousand claims in a single great hole. The richest square mile on earth."
 ENG_langalibalele:0 "The Langalibalele Affair"
 ENG_langalibalele_desc:0 "A Hlubi chief refuses to register his men's guns. Natal's punitive expedition becomes a scandal in London."
 ENG_south_african_confederation:0 "South African Confederation"
 ENG_south_african_confederation_desc:0 "If Canada could be federated, why not South Africa? British colonies and Boer republics in one Dominion."
 ENG_tropical_africa:0 "Tropical Africa"
 ENG_tropical_africa_desc:0 "Beyond the coastal forts lies a continent unknown to Europeans. The explorers are filling in the map."
 ENG_livingstone_and_stanley:0 "Livingstone and Stanley"
 ENG_livingstone_and_stanley_desc:0 "Dr Livingstone, I presume? The American journalist has found the lost explorer at Ujiji, and the world is enthralled."
 ENG_the_frere_mission:0 "The Frere Mission"
 ENG_the_frere_mission_desc:0 "Sir Bartle Frere sails to Zanzibar to demand that the Sultan end the slave trade."
 ENG_sierra_leone_and_the_gambia:0 "Sierra Leone and the Gambia"
 ENG_sierra_leone_and_the_gambia_desc:0 "Freetown is the capital of the West African Settlements: a colony of freed slaves and missionaries."
 ENG_the_royal_geographical_society:0 "The Royal Geographical Society"
 ENG_the_royal_geographical_society_desc:0 "Sir Roderick Murchison's society sends out the expeditions and crowns the explorers with its medals."
 ENG_the_sultan_of_zanzibar:0 "The Sultan of Zanzibar"
 ENG_the_sultan_of_zanzibar_desc:0 "Sultan Barghash depends on the slave trade for his revenue and on Britain for his throne."
 ENG_close_the_slave_market:0 "Close the Slave Market"
 ENG_close_the_slave_market_desc:0 "Under the guns of the squadron, the Sultan signs. The Zanzibar slave market is closed for ever."
 ENG_the_gambia_exchange:0 "The Gambia Exchange"
 ENG_the_gambia_exchange_desc:0 "Give the Gambia to France for her posts on the Ivory Coast? The merchants of the Gambia protest loudly."
 ENG_the_missionaries:0 "The Missionaries"
 ENG_the_missionaries_desc:0 "The Universities' Mission and the Free Church of Scotland will follow Livingstone into the interior."
 ENG_the_east_african_coast:0 "The East African Coast"
 ENG_the_east_african_coast_desc:0 "Consul Kirk is the real power in Zanzibar. British India merchants dominate the trade of the coast."
 ENG_west_african_settlements:0 "The West African Settlements"
 ENG_west_african_settlements_desc:0 "Lagos, Sierra Leone, the Gambia and the Gold Coast under one governor-in-chief: cheaper, if not better."
 ENG_commerce_christianity_civilisation:0 "Commerce, Christianity and Civilisation"
 ENG_commerce_christianity_civilisation_desc:0 "Livingstone's creed: legitimate trade and the Gospel will drive out the slave trade and open Africa to the world."
 ENG_the_southern_colonies:0 "The Southern Colonies"
 ENG_the_southern_colonies_desc:0 "Six Australasian colonies govern themselves, tax each other's goods and agree on almost nothing."
 ENG_overland_telegraph:0 "The Overland Telegraph"
 ENG_overland_telegraph_desc:0 "Two thousand miles of wire across the desert from Adelaide to Port Darwin will put Australia in touch with London in hours."
 ENG_vogels_public_works:0 "Vogel's Public Works"
 ENG_vogels_public_works_desc:0 "New Zealand's Treasurer borrows ten millions to build railways, roads and immigrant ships. Boom or bust?"
 ENG_the_pacific_islanders:0 "The Pacific Islanders"
 ENG_the_pacific_islanders_desc:0 "Blackbirders kidnap islanders for the Queensland plantations. The murder of Bishop Patteson shames the Empire."
 ENG_western_australia:0 "Western Australia"
 ENG_western_australia_desc:0 "The last convict colony is to be a free one. Its pastoralists and pearlers want self-government."
 ENG_withdraw_from_new_zealand:0 "Withdraw from New Zealand"
 ENG_withdraw_from_new_zealand_desc:0 "The last imperial regiment leaves New Zealand. The colonists must fight their own wars now."
 ENG_assisted_emigration:0 "Assisted Emigration"
 ENG_assisted_emigration_desc:0 "Free passages for farm labourers and domestic servants will fill the empty lands of the South."
 ENG_the_kidnapping_act:0 "The Pacific Islanders Protection Act"
 ENG_the_kidnapping_act_desc:0 "Labour vessels must be licensed and their recruits willing. The Navy will police the trade."
 ENG_intercolonial_conferences:0 "Intercolonial Conferences"
 ENG_intercolonial_conferences_desc:0 "The premiers meet to discuss tariffs, mails and defence. Federation is a distant dream, but a dream nonetheless."
 ENG_new_zealand_railways:0 "The New Zealand Railways"
 ENG_new_zealand_railways_desc:0 "Narrow-gauge lines push inland from every port, carrying settlers out and wool back."
 ENG_western_pacific_high_commission:0 "A High Commission for the Pacific"
 ENG_western_pacific_high_commission_desc:0 "A High Commissioner with jurisdiction over British subjects in the islands will bring law to the South Seas."
 ENG_britain_of_the_south:0 "Britain of the South"
 ENG_britain_of_the_south_desc:0 "Wool, gold and wheat; parliaments, railways and cricket: a new Britain flourishes beneath the Southern Cross."
 ENG_the_colonial_office_reformed:0 "Imperial Administration"
 ENG_the_colonial_office_reformed_desc:0 "Lord Kimberley wants the Colonial Office to govern the Empire rather than merely correspond with it."
 ENG_the_crown_agents:0 "The Crown Agents"
 ENG_the_crown_agents_desc:0 "The Crown Agents raise the loans, buy the stores and hire the engineers for every colony that cannot do it for itself."
 ENG_the_royal_colonial_institute:0 "The Royal Colonial Institute"
 ENG_the_royal_colonial_institute_desc:0 "A society for the colonies in London, to make the Empire better known to its rulers."
 ENG_the_colonial_laws:0 "The Colonial Laws"
 ENG_the_colonial_laws_desc:0 "Colonial legislatures may pass any law not repugnant to an Act of Parliament. Where is the line?"
 ENG_self_government_for_settlers:0 "Self-Government for the Settlers"
 ENG_self_government_for_settlers_desc:0 "Every colony of British settlers will in time govern itself. The only question is how soon."
 ENG_crown_colony_government:0 "Crown Colony Government"
 ENG_crown_colony_government_desc:0 "Where the settlers are few and the natives many, the Governor must rule directly for the Crown."
 ENG_the_imperial_telegraph:0 "The Imperial Telegraph"
 ENG_the_imperial_telegraph_desc:0 "London can now speak to Bombay, Hong Kong and Adelaide in hours. Governors will have less room to act alone."
 ENG_colonial_governors:0 "The Colonial Governors"
 ENG_colonial_governors_desc:0 "Soldiers, sailors, lawyers and aristocrats: the governors of the Empire must be chosen with care."
 ENG_the_sun_never_sets:0 "The Empire on Which the Sun Never Sets"
 ENG_the_sun_never_sets_desc:0 "Forty colonies, a quarter of the world's people, and every one of them ruled from Downing Street."
 ENG_reform_spirit_tt:0 "Each reform line is a single national spirit that grows by one stage with every focus on that line."
 ENG_the_farmers_defence:0 "The Farmers' Defence Associations"
 ENG_the_farmers_defence_desc:0 "The farmers will not be dictated to by a hedge-cutter's union. Lock out the union men and hire whoever will work at the old wage."
 ENG_trust_the_gun:0 "Trust the Gun"
 ENG_trust_the_gun_desc:0 "Lissa was won by luck and confusion. A well-laid gun will sink a ship long before she can close to ram. The gunnery officers carry the day."
 ENG_keep_the_royal_yards:0 "Keep the Royal Yards Open"
 ENG_keep_the_royal_yards_desc:0 "Woolwich and Deptford built the fleets of Nelson. Their shipwrights' skills cannot be replaced, whatever the economists at the Treasury say."
 ENG_retain_the_lash:0 "Retain the Lash"
 ENG_retain_the_lash_desc:0 "The colonels are united: without the cat-o'-nine-tails there is no discipline. Flogging stays, and so do the recruiting sergeant's difficulties."
 ENG_keep_the_gambia:0 "The Gambia Is Not for Sale"
 ENG_keep_the_gambia_desc:0 "The merchants of Bathurst have petitioned the Queen, and the Commons agrees: British subjects will not be handed to France like goods on a counter."
 ENG_garrison_the_dominion:0 "Garrison the Dominion"
 ENG_garrison_the_dominion_desc:0 "With the Fenians raiding across the border and American annexationists talking loudly, the regiments will stay in Canada."
 ENG_rule_by_the_governor:0 "Rule by the Governor"
 ENG_rule_by_the_governor_desc:0 "The Cape is not ready to govern itself while its frontiers burn. The Governor will keep the reins, and the colonists will keep complaining."
 ENG_voluntary_vaccination:0 "Vaccination by Persuasion"
 ENG_voluntary_vaccination_desc:0 "Free vaccination at every dispensary, explained by every doctor, but no fines and no prosecutions. Fewer children protected, and no riots."
 ENG_hush_it_up:0 "Keep the Prince out of Court"
 ENG_hush_it_up_desc:0 "A word in the right ear, a settlement for the family, and the Prince of Wales need never enter the witness box. It is expensive, and everyone in society still knows."
 ENG_stand_by_the_colonists:0 "Stand by the Colonists"
 ENG_stand_by_the_colonists_desc:0 "Titokowaru and Te Kooti are still in the field. The imperial regiments will stay until New Zealand is at peace."
 ENG_science_pays_its_way:0 "Science Can Pay Its Own Way"
 ENG_science_pays_its_way_desc:0 "Let the universities, the learned societies and the manufacturers fund their own research. The Treasury has better uses for its money, whatever Professor Huxley says."
 ENG_keep_the_gallows_public:0 "Keep the Gallows Public"
 ENG_keep_the_gallows_public_desc:0 "Justice must be seen to be done. A hanging behind prison walls deters nobody, say the old judges, and the crowds outside Newgate agree."
 ENG_the_academy_triumphant:0 "The Academy Triumphant"
 ENG_the_academy_triumphant_desc:0 "Sir Francis Grant's Royal Academy sets the national taste: history painting, portraiture and nothing to frighten the drawing-room."
 ENG_put_down_ritualism:0 "Put Down Ritualism"
 ENG_put_down_ritualism_desc:0 "A bill to regulate public worship will drive the vestments and the incense out of the Church of England. The High Churchmen vow to go to prison first."
 ENG_buy_out_the_railways:0 "Buy Out the Railways"
 ENG_buy_out_the_railways_desc:0 "The Act of 1844 lets the State purchase any line after twenty-one years. One national system, run for the public, would end the companies' wasteful rivalry."
 ENG_bimetallism:0 "The Bimetallic Standard"
 ENG_bimetallism_desc:0 "Gold and silver together will give the world enough money to trade and stop prices falling. The City is horrified; Lancashire and India are delighted."
 ENG_calcutta_holds_the_purse:0 "Calcutta Holds the Purse"
 ENG_calcutta_holds_the_purse_desc:0 "Every rupee of revenue will be collected and spent by the Government of India. The provinces will ask, and Calcutta will decide."
 ENG_leave_tianjin_to_the_french:0 "Leave Tianjin to the French"
 ENG_leave_tianjin_to_the_french_desc:0 "The victims were French. Let Paris demand its reparations; British merchants have no wish to see the treaty ports in flames."
 ENG_woolwich_knows_best:0 "Woolwich Knows Best"
 ENG_woolwich_knows_best_desc:0 "The Royal Gun Factory will design and build the Army's guns itself. Private gunmakers can sell to foreigners."
 ENG_a_foreign_prince:0 "A Foreign Prince for Louise"
 ENG_a_foreign_prince_desc:0 "Royal daughters marry royal sons. A German prince for Princess Louise will strengthen the family's ties across Europe, whatever the newspapers say."
