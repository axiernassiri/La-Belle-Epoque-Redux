#focuses
 AUS_toward_a_habsburg_europe: "Toward a Habsburg Europe"
 AUS_toward_a_habsburg_europe_desc: "With Prussia humbled, Vienna is once again the heart of Central Europe. Now we must look beyond Germany and decide how far the House of Habsburg's reach will extend."
 AUS_rivals_of_the_old: "Rivals of Old"
 AUS_rivals_of_the_old_desc: "For centuries the Sublime Porte has been our greatest rival in the east. The Turk once stood at the gates of Vienna. Now the old empire is weak, and it is time we pushed it out of Europe."
 AUS_gurantee_greece: "Guarantee Greece"
 AUS_gurantee_greece_desc: "The Hellenic Kingdom has long wanted to free its kin still under Ottoman rule. An Austrian guarantee will keep it safe and bind it to our cause."
 AUS_relations_with_persia: "Relations with Persia"
 AUS_relations_with_persia_desc: "The Shah has lost land to both the Russians and the Turks. A friendly Persia at their backs would be a great help to us."
 AUS_deal_with_the_shah: "A Deal with the Shah"
 AUS_deal_with_the_shah_desc: "We will offer the Shah the lands he lost in exchange for Persian soldiers when the time comes."
 AUS_influence_the_balkan_states: "Influence the Balkan Peoples"
 AUS_influence_the_balkan_states_desc: "Bulgarians, Bosniaks, Albanians and Montenegrins all chafe under the Sultan. With Austrian money and Austrian rifles, they can be made to rise."
 AUS_fund_greek_sepratists: "Fund Greek Separatists"
 AUS_fund_greek_sepratists_desc: "Crete, Epirus and the Aegean islands are full of Greeks who want union with Athens. A little Austrian gold will turn their wishes into open revolt."
 AUS_instigate_armenian_resistance: "Instigate Armenian Resistance"
 AUS_instigate_armenian_resistance_desc: "The Armenians of Erzurum, Van and Kars suffer under Ottoman misrule. If we arm them, the Porte will have to fight a second front in the heart of Anatolia."
 AUS_make_a_deal_with_the_arabs: "Make a Deal with the Arabs"
 AUS_make_a_deal_with_the_arabs_desc: "The House of Saud has no love for the Ottoman governors of the Hejaz. If we promise them the holy cities, they will strike from the south."
 AUS_create_the_colition: "Create the Coalition"
 AUS_create_the_colition_desc: "No single power should have to carve up an empire alone. We will invite all who want to see the Ottoman Empire's end to stand with us."
 AUS_call_for_the_dissolution_of_the_ottoman_empire: "Call for the Dissolution of the Ottoman Empire"
 AUS_call_for_the_dissolution_of_the_ottoman_empire_desc: "The sick man of Europe has lingered long enough. We declare to the world that the Ottoman Empire must be dissolved, and we will enforce it by the sword."
 AUS_victory_against_the_ottomans: "Victory Against the Ottomans"
 AUS_victory_against_the_ottomans_desc: "The Sultan has surrendered. The Balkans are free of Ottoman rule, and the Danube flows through Habsburg lands from its source to the sea."
 AUS_curtail_russian_ambition: "Curtail Russian Ambition"
 AUS_curtail_russian_ambition_desc: "The Tsar thinks of himself as the protector of every Slav and every Orthodox Christian. Russian ambitions in the Balkans directly threaten our own, and they must be stopped."
 AUS_winter_adaptations: "Winter Adaptations"
 AUS_winter_adaptations_desc: "Napoleon's Grande Armée was destroyed by the Russian winter. Our army will not make the same mistake."
 AUS_infiltrate_ukraine: "Infiltrate Ukraine"
 AUS_infiltrate_ukraine_desc: "Our agents in Lemberg have close ties with the Ukrainians across the border. If we stir them up, the Tsar's southern provinces will become a liability."
 AUS_galician_fortifications: "Galician Fortifications"
 AUS_galician_fortifications_desc: "Galicia is the gateway between our empire and Russia. It must be fortified."
 AUS_conduct_border_raids: "Conduct Border Raids"
 AUS_conduct_border_raids_desc: "Quick raids on Russian depots along the border will give our soldiers experience and their rifles."
 AUS_rebellous_people_of_the_caucasus: "Rebellious Peoples of the Caucasus"
 AUS_rebellous_people_of_the_caucasus_desc: "Georgians, Armenians, Azeris and the mountain peoples of Dagestan were only recently conquered by Russia. When war comes, they will rise."
 AUS_slay_the_orthodox_giant: "Slay the Orthodox Giant"
 AUS_slay_the_orthodox_giant_desc: "Russia is the last great obstacle to Habsburg supremacy in the east. The time has come to face the giant."
 AUS_victory_over_russia: "Victory Over Russia"
 AUS_victory_over_russia_desc: "The Tsar has surrendered. Ukraine is under our protection, the Caucasus is free, and Russia will not threaten Central Europe again for a generation."

#ideas
 AUS_winter_preparations: "Winter Preparations"
 AUS_winter_preparations_desc: "Our soldiers are now equipped and trained to fight through the harsh eastern winters."
 AUS_heir_to_the_porte: "Heir to the Porte"
 AUS_heir_to_the_porte_desc: "The Ottoman Empire's European possessions now belong to the House of Habsburg and its clients. Vienna is the master of the Balkans."
 AUS_the_giant_slain: "The Giant Slain"
 AUS_the_giant_slain_desc: "Russia, the giant of the east, has been brought to its knees by Austrian arms."

