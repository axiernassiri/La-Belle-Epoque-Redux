 #shown ideas
 fpw_outdated_military: "Outdated Military"
 fpw_outdated_military_desc: "The [Root.GetAdjective] army is woefully unprepared for the modern battlefield. Outdated tactics, aging equipment, and poor coordination plague our forces. Without urgent reform, we risk humiliation at the hands of other armies."
 fpw_idea_austria_shelling_prussians: "Shelling Prussians"
 fpw_idea_austria_shelling_prussians_desc: "Our only hope of defeating the Prussians is to overwhelm them with superior artillery. By investing in our artillery corps and developing new tactics, we can break their formations and seize the initiative on the battlefield."
 fpw_idea_austria_superior_navy: "Superior Navy"
 fpw_idea_austria_superior_navy_desc: "Our navy is essential for preventing invasions into our southern provinces by Italy and for projecting power in the Mediterranean."
 fpw_idea_austria_shadow_frankfurt: "Shadow of Frankfurt"
 fpw_idea_austria_shadow_frankfurt_desc: "The 1848 revolutions have left the monarchy weakened and politically isolated. - will be expanded"
 fpw_idea_austria_power_centralized: "Centralized Power"
 fpw_idea_austria_power_centralized_desc: "The only way to ensure the survival of the monarchy is to centralize power in Vienna. By consolidating authority and reducing the influence of regional governments, Austria can maintain control over its diverse territories and prevent internal dissent."
 fpw_idea_austria_power_decentralized: "Decentralized Power"
 fpw_idea_austria_power_decentralized_desc: "The only way way to ensure the survival of the monarchy is to decentralize power and grant greater autonomy to the empire's diverse regions. By empowering local governments and respecting regional identities, Austria can foster loyalty and cooperation among its peoples."
 fpw_idea_the_duel_monarchy: "The Dual Monarchy"
 fpw_idea_the_duel_monarchy_desc: "The experiment of the Dual Monarchy has proven to be a successful compromise between the crown and Hungary. By maintaining this arrangement, Austria can ensure the stability of the empire while respecting the distinct identities of its constituent nations."
 fpw_idea_habsburg_horses: "Habsburg Horses"
 fpw_idea_habsburg_horses_desc: "Our Lippizaner horses are a symbol of the Habsburgs' military tradition. By investing in the breeding and training of these exceptional animals, Austria can ensure that its cavalry remains a formidable force on the battlefield."
 fpw_modernized_military_command: "Modernized Military Command"
 fpw_modernized_military_command_desc: "With a modernized command structure, Austria can improve communication, coordination, and decision-making within its armed forces. This will enhance the army's effectiveness and responsiveness in the face of evolving threats."
 fpw_alpine_warfare: "Alpine Warfare"
 fpw_alpine_warfare_desc: "Our country's terrain is dominated by the Alps and therefore it gives us a unique advantage in mountain warfare. By training our soldiers in alpine tactics and equipping them with specialized gear, Austria can defend its mountainous regions and exploit the terrain to its advantage."
 fpw_austria_reigns_supreme: "Austrian Reigns Supreme"
 fpw_austria_reigns_supreme_desc: "Though the monarchy has faced challenges and setbacks, Austria has emerged as a dominant power in Europe. By consolidating its influence, strengthening its alliances, and maintaining a strong military, the empire can ensure its continued prominence on the continent."
 fpw_aus_new_arty: "New Austrian Artillery"
 fpw_aus_new_arty_desc: "No one can match the Austrian artillery. With our new artillery pieces, we can dominate the battlefield and ensure that our enemies are crushed under the weight of our firepower."
 fpw_idea_aus_new_inf: "New Austrian Infantry Equipment"
 fpw_idea_aus_new_inf_desc: "No one can match the Austrian infantry. With our new rifles, we can dominate the battlefield and ensure that our enemies are crushed under the weight of our firepower."
 AUS_stock_market_crash: "Stock Market Crash"
 AUS_stock_market_crash_desc: "The stock market crash has shaken the foundations of the monarchy's economy. By implementing reforms, stabilizing financial institutions, and restoring investor confidence, Austria can recover from this crisis and ensure long-term economic stability."
 AUS_imperial_restoration: "Imperial Restoration"
 AUS_imperial_restoration_desc: "After the founding of the new Holy Roman Empire, the monarchy must work to restore its imperial authority and prestige. By strengthening its institutions, promoting loyalty among its subjects, and asserting its influence in European affairs, Austria can reclaim its historic position as a leading power on the continent."
 AUS_unified_military: "Unified Military"
 AUS_unified_military_desc: "Our military forces are finally unified under a single command structure. This integration of the army and navy will enhance our ability to defend the empire and project power abroad."
 AUS_modern_army: "Modern Army"
 AUS_modern_army_desc: "We finally have a modernized army that can compete with the best in Europe. With improved training, equipment, and organization, Austria is now prepared to defend its interests and assert its influence on the continent."
 AUS_rebuilding_imperial_treasury: "Rebuilding the Imperial Treasury"
 AUS_rebuilding_imperial_treasury_desc: "After years of war and economic instability, the monarchy is taking steps to rebuild its treasury. By implementing fiscal reforms, improving tax collection, and promoting economic growth, Austria can ensure that it has the financial resources necessary to support its ambitions and maintain its position in Europe."
 AUS_economic_militarizaiton: "Economic Militarization"
 AUS_economic_militarizaiton_desc: "By integrating military and economic strategies, Austria can enhance its overall power and influence in Europe."
 AUS_cutting_corners: "Cutting Corners"
 AUS_cutting_corners_desc: "In times of crisis, Austria may be forced to cut corners to maintain its position, but this approach comes with risks."
 AUS_improved_production_methods_id: "Improved Production Methods"
 AUS_improved_production_methods_id_desc: "New production methods can enhance the efficiency and output of Austria's industries, strengthening the economy and supporting military needs."
 
#events
 fpw_austria.1.t: "Austria Asks for Our Support"
 fpw_austria.1.d: "The Austrian Empire is requesting our assistance in what they are calling a possible war with [PRS.GetNameDef]."
 fpw_austria.1.a: "We shall help them"
 fpw_austria.1.b: "We shall stay neutral"
 fpw_austria.1.c: "We have other plans for Austria..."
 fpw_austria.2.t: "France Agrees to Help"
 fpw_austria.2.d: "[FRA.GetNameDefCap] has agreed to help us in our future war with [PRS.GetNameDef]"
 fpw_austria.2.a: "Great!"
 fpw_austria.3.t: "France Promises Neutrality"
 fpw_austria.3.d: "[FRA.GetNameDefCap] has declared their neutrality in our future war with [PRS.GetNameDef]"
 fpw_austria.3.a: "Well..."
 fpw_austria.4.t: "France Denies to Help"
 fpw_austria.4.d: "[FRA.GetNameDefCap] has denied to help us in our future war with [PRS.GetNameDef]"
 fpw_austria.4.a: "You can never rely on the French!"
 fpw_austria.5.t: "Hungarian Protests"
 fpw_austria.5.d: "All across the empire, the Hungarian population is protesting against the governemt. They are demanding greater autonomy and recognition of their rights."
 fpw_austria.5.a: "Is it 1848 all over again?"
 fpw_austria.6.t: "The Slavs Revolt"
 fpw_austria.6.d: "Not long after the Hungarian protests, the Slavic population has also risen up against the government. They are demanding greater autonomy and recognition of their rights. We must act quickly to quell these uprisings before they spread further."
 fpw_austria.6.a: "It is 1848 all over again."
 fpw_austria.7.t: "Congress of Berlin"
 fpw_austria.7.d: "[AUS.GetNameDef] proposes an agreement to split up [TUR.GetNameDef] between [ENG.GetNameDef], [SOV.GetNameDef], and [AUS.GetNameDef]. Under this agreement the balkan states would gain freedom, with [SOV.GetNameDef] gaining overlordship of Romania. [ENG.GetNameDef] would gain Cyprus, and [Aus.GetNameDef] would annex Bosnia."
 fpw_austria.7.a: "A fine plan."
 fpw_austria.7.b: "Ridiculous!"
 fpw_austria.8.t: "Great Powers seek concessions."
 fpw_austria.8.d: "Certain powers have met up in Berlin to discuss the future of our country for us. They have decided to divide up the balkan."
 fpw_austria.8.a: "We cannot risk a major war."
 fpw_austria.8.b: "hecks nah."
 fpw_austria.9.t: ""
 fpw_austria.10.t: "An Austrian Ultimatum"
 fpw_austria.10.d: "[AUS.GetNameDefCap] demands that we accept a Habsburg protectorate. Refusal will provide Vienna with a pretext for war."
 fpw_austria.10.a: "Accept the protectorate."
 fpw_austria.10.b: "We will not bow to Vienna!"
 fpw_austria.11.t: "[AUS.GetNameDef] proposes Anti-German Alliance."
 fpw_austria.11.d: "Austria has proposed an alliance against the newly formed German Empire. This alliance would include Austria, France, and any other powers willing to join."
 fpw_austria.11.a: "We Agree."
 fpw_austria.11.b: "No."
 fpw_austria.12.t: "[AUS.GetNameDef] proposes a Germanic Alliance."
 fpw_austria.12.d: "Austria has proposed an alliance with the German Empire. This alliance would include Austria, Germany, and any other powers willing to join. This alliance would be a counterweight to the French and Russian influence in Europe."
 fpw_austria.12.a: "We accept"
 fpw_austria.12.b: "No."
 fpw_austria.13.t: "Prussia capitulates"
 fpw_austria.13.d: "Prussia has capitulated to the Austrian Empire. Berlin has sent a delegation to Vienna to discuss the terms of surrender."
 fpw_austria.13.a: "Austria accepts the Prussian surrender."
 fpw_austria.13.b: "We reject the terms. WE'LL BE IN BERLIN IN 2 WEEKS!"
 fpw_austria.14.t: "Italy capitulates"
 fpw_austria.14.d: "Italy has capitulated to the Austrian Empire. Rome has sent a delegation to Vienna to discuss the terms of surrender."
 fpw_austria.14.a: "Austria accepts the Italian surrender."
 fpw_austria.14.b: "We reject the terms. WE'LL BE IN ROME IN 1 WEEK!"
 fpw_austria.15.t: "World Fair 1873"
 fpw_austria.15.d: "For the first time in history, the world fair will be held in Vienna. The fair will showcase the latest technological and cultural achievements from around the world."
 fpw_austria.15.a: "Everything is ready for the fair. Kaiser Franz Joseph will hold the opening ceremony."
 fpw_austria.15.b: "No, we cannot hold the fair. The empire is too unstable."
 fpw_austria.16.t: "Panic of 1873"
 fpw_austria.16.d: "The Panic of 1873 has struck the Austrian Empire, causing widespread economic turmoil. Banks are failing, businesses are closing, and unemployment is rising. The government must take immediate action to stabilize the economy and restore confidence."
 fpw_austria.16.a: "This is bad."
 fpw_austria.17.t: "Imperial Awards"
 fpw_austria.17.d: "Every year, the emperor gives awards to soldiers who have distinguished themselves in service to the empire. However, awarding these awards are costly so we can choose to give out awards or pause the program until next year."
 fpw_austria.17.a: "We will award the medals."
 fpw_austria.17.b: "We unfortunately don't have enough money right now."
 fpw_austria.18.t: "Price of a new Uniform"
 fpw_austria.18.d: "Uniforms aren't cheap. So we need to decide whether we have enough money to buy our soldiers new uniforms or if they need to do it themselves."
 fpw_austria.18.a: "We cannot impose any further burdens on our soldiers."
 fpw_austria.18.b: "Sorry, but we simply do not have enough money."
 fpw_austria.19.t: "The Empress and the Hungarian Question"
 fpw_austria.19.d: "The Empress has taken a keen interest in Hungarian culture and has begun learning the Hungarian language. Through her growing connections with Hungarian politicians, she hopes to influence the Emperor and convince him to grant Hungary greater autonomy. However, not everyone at court agrees with her approach, and the question remains whether tradition or reform will prevail."
 fpw_austria.19.a: "Let the Empress do as she wishes"
 fpw_austria.19.b: "Tradition must be upheld"
 fpw_austria.20.t: "Imperial Address"
 fpw_austria.20.d: "After the Bruderkrieg and the subsequent Ausgleich, our glorious Emperor wishes to deliver a speech to his people. He must choose between promising economic reforms and a peaceful course for the coming years, or vowing revenge and reconquest."
 fpw_austria.20.a: "Promise economic reforms and peace for the coming years."
 fpw_austria.20.b: "Promise revenge and reconquest"
 fpw_austria.21.t: "The final Loss of Venice"
 fpw_austria.21.d: "As we have lost the war against Prussia and Italy, we are forced to cede Venice to Italy. As this would be a great disgrace to our empire, the Emperor of France agreed to act as an intermediary and transfer Venice to Italy on our behalf. This way, we can save face and avoid further humiliation."
 fpw_austria.21.a: "We were too weak to hold onto Venice"
 fpw_austria.22.t: "Diplomatic Victory in the Berlin Congress"
 fpw_austria.22.d: "Our diplomats have achieved a great diplomatic victory for Austria at the Congress of Berlin. The Ottoman Empire will be forced to cede Bosnia to us."
 fpw_austria.22.a: "We are back on the Worldstage!"
 fpw_austria.23.t: "Ottomans are resisting"
 fpw_austria.23.d: "The Ottoman Empire is resisting our final demand. This means that we will have to go to war with them to achieve our goals. We need to assemble the Congress of Berlin and prepare for war." 
 fpw_austria.23.a: "Let's finish them once and for all!"
 fpw_austria.24.t: "The Promotion of Anton von Schönfeld"
 fpw_austria.24.d: "Anton von Schönfeld has served the empire with distinction and has been promoted to a higher rank in the military. His leadership and strategic acumen will be invaluable in the coming years."
 fpw_austria.24.a: "We are proud of his service and wish him continued success."
 fpw_austria.25.t: "Austria demands us to join the German Confederation"
 fpw_austria.25.d: "Austria demands that we join the German Confederation. We must decide whether to accept this demand and join the confederation or to resist and maintain our independence."
 fpw_austria.25.a: "We will join the German Confederation."
 fpw_austria.25.b: "We refuse!"
 fpw_austria.26.t: "Austria promises us Holstein for joining the German Confederation"
 fpw_austria.26.d: "Austria promises us the territory of Holstein if we agree to join the German Confederation. We must decide whether to accept this offer and join the confederation or to resist and maintain our independence."
 fpw_austria.26.a: "We will join the German Confederation."
 fpw_austria.26.b: "We refuse!"
 fpw_austria.27.t: "Austria demands us to join the German Confederation"
 fpw_austria.27.d: "Austria demands that we, Switzerland, join the German Confederation. We must decide whether to accept this demand and join the confederation or to resist and maintain our independence."
 fpw_austria.27.a: "We will join the German Confederation."
 fpw_austria.27.b: "We refuse!"
 fpw_austria.28.t: "Revolts in the Rhineland"
 fpw_austria.28.d: "Austria has instigated revolts in the Rhineland against Prussia. The people are demanding independence and have risen up against the Prussian authorities. We need to stop the revolting people to maintain our control over the region."
 fpw_austria.28.a: "We need to crush them!"
 fpw_austria.29.t: "Revolts in Thuringia"
 fpw_austria.29.d: "Austria has instigated revolts in Thuringia against Prussia. The people are demanding independence and have risen up against the Prussian authorities. We need to stop the revolting people to maintain our control over the region."
 fpw_austria.29.a: "We need to crush them!"

