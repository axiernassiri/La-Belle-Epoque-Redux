#custom effect tooltips
 AUS_stir_protests_tt: "After §Y60 days§!, every §YOttoman-held§! state of this people gets §RAustrian-Backed Agitation§!:\n   Local Manpower: §R-25%§!\n   Local Factories: §R-15%§!\n   Construction Speed: §R-25%§!\n   Local Supplies: §R-15%§!\nUnlocks a decision to launch their §Ruprising§!."
 AUS_launch_uprising_tt: "This people §Rrises up§! and takes control of its §YOttoman-held core states§!, becoming an §Yindependent country§!.\nThey receive §Y2 militia§! and §Y1 infantry§! division in every state they hold, §Y20,000§! manpower, and §Y3,000 infantry equipment§! and §Y300 support equipment§! from our stockpile.\nWe lose §R3,000 infantry equipment§!.\n[TUR.GetNameDef] will §Rdeclare war§! on them. §gWe do not join this war.§!\nWhen we defeat [TUR.GetNameDef], they become our §Ysubjects§!."
 AUS_launch_breakaway_tt: "This nation breaks free of [TUR.GetNameDef]: it stops being an §YOttoman subject§! and leaves the Ottoman faction.\nThey receive §Y3,000 infantry equipment§! from our stockpile. We lose §R3,000 infantry equipment§!.\n[TUR.GetNameDef] will §Rdeclare war§! on them. §gWe do not join this war.§!"
 AUS_greek_war_tt: "[GRE.GetNameDef] gets claims on the regions we funded and §Rdeclares war§! on [TUR.GetNameDef].\n[GRE.GetNameDef] receives §Y3,000 infantry equipment§!, §Y15,000§! manpower and §G+15%§! war support. We lose §R3,000 infantry equipment§!.\n§gWe do not join this war.§!"
 AUS_deal_with_the_shah_tt: "If the Shah accepts, §YPersia§! will §Rdeclare war§! alongside us on the §YOttomans§! and §YRussia§!, and will receive §YMesopotamia§! (Iraq and Mosul) and §YBaku§! in the peace."
 AUS_armenian_revolt_tt: "When we start the §YWar of Dissolution§!, §YErzurum§!, §YVan§! and §YKars§! will §Rrevolt§! as §YArmenia§!, which joins our faction as our §Ysubject§!."
 AUS_arab_deal_tt: "When we start the §YWar of Dissolution§!, the §YSaudis§! will §Rdeclare war§! on the Ottomans, and they will receive the §YHejaz§!, §YTabuk§! and §YAsir-Makkah§! in the peace."
 AUS_dissolution_war_tt: "Every member of our faction will join the war.\n§YSerbia§! and §YRomania§! will fight for the Ottomans while they remain Ottoman subjects."
 AUS_war_armenia_revolts_tt: "§YArmenia§! will §Rrevolt§! in Erzurum, Van and Kars and join our faction as our subject."
 AUS_war_caucasus_revolts_tt: "§YGeorgia§!, §YArmenia§!, §YAzerbaijan§! and §YDagestan§! will §Rrevolt§! and join our faction, each with its own militia."
 AUS_ottoman_peace_terms_tt: "\n§YPeace terms when [TUR.GetNameDef] capitulates:§!\n - §YAustria§! annexes Bosnia, Herzegovina, Eastern Serbia, Southern Serbia and Kosovo\n - §YBulgaria§!, §YAlbania§!, §YMontenegro§! and §YArmenia§! become independent as our §Ysubjects§!\n - §YGreece§! gets Crete, Epirus, Thrace, Central Macedonia and the Aegean islands\n - The §YSaudis§! get the Hejaz; §YPersia§! gets Mesopotamia if it fought, otherwise §YIraq§! is released\n - §YSyria§! and §YLibya§! are released\n - Serbia, Romania and other Ottoman subjects are freed\n - [TUR.GetNameDef] keeps only Anatolia, Constantinople and Cyprus"
 AUS_victory_against_the_ottomans_tt: "If the §YBalkans§! were an irrelevant population, they become a §RHostile§! population of the empire."
 AUS_victory_against_the_ottomans_trigger_tt: "Completes automatically when [TUR.GetNameDef] §Ycapitulates§! in the §YWar of Dissolution§!."
 AUS_ottoman_peace_tt: "The War of Dissolution is over."
 aus_caucausus_revolt: "When we go to war with [SOV.GetNameDef], §YGeorgia§!, §YArmenia§!, §YAzerbaijan§! and §YDagestan§! will §Rrevolt§! and join our faction, each with its own militia."
 AUS_infiltrate_ukraine_tt: "The §RUkrainian Unrest§! is removed when the war with Russia ends."
 AUS_start_russian_war_tt: "Every member of our faction will join the war.\n§YFinland§! will fight for Russia."
 AUS_russian_peace_terms_tt: "\n§YPeace terms when [SOV.GetNameDef] capitulates:§!\n - §YAustria§! annexes Volhynia (Rivne) and Podolia (Khmelnytskyi)\n - §YUkraine§! is released as our §Ysubject§!\n - §YGeorgia§!, §YArmenia§! and §YDagestan§! become independent\n - §YBaku§! goes to §YPersia§! if it fought, otherwise to an independent §YAzerbaijan§!"
 AUS_victory_over_russia_trigger_tt: "Completes automatically when [SOV.GetNameDef] §Ycapitulates§! in our war against them."
 AUS_victory_over_russia_tt: "§GThe Galician attitude toward the empire improves.§!"
 AUS_russian_peace_tt: "The war with Russia is over."

#events
 fpw_austria.30.t: "An Austrian Proposal"
 fpw_austria.30.d: "The Austrian ambassador has come to the Shah with an offer. If Persia fights with Austria against the Ottomans or the Russians, Vienna promises to return the lands Persia lost to them: Mesopotamia from the Turks and Baku from the Russians."
 fpw_austria.30.a: "Persia accepts."
 fpw_austria.30.b: "We will not be dragged into Austria's wars."
 fpw_austria.31.t: "The Shah Accepts"
 fpw_austria.31.d: "The Shah has accepted our proposal. When we go to war with the Ottomans or Russia, Persia will fight with us."
 fpw_austria.31.a: "Excellent."
 fpw_austria.32.t: "The Shah Declines"
 fpw_austria.32.d: "The Shah has politely declined our proposal. Persia will stay out of our wars."
 fpw_austria.32.a: "A pity."
 fpw_austria.38.t: "The Habsburg Coalition"
 fpw_austria.38.d: "[FROM.GetNameDef] is building a coalition to bring about the end of the Ottoman Empire and has invited us to join. If we join, we will share in the spoils when the Sultan falls."
 fpw_austria.38.a: "We will join the coalition."
 fpw_austria.38.b: "We decline."
 fpw_austria.39.t: "Austrian Border Raids"
 fpw_austria.39.d: "Austrian troops have crossed the Galician border and raided our depots, taking thousands of rifles. Vienna claims it was the work of bandits, but nobody in Saint Petersburg believes it."
 fpw_austria.39.a: "This will not be forgotten."
 fpw_austria.40.t: "The Dissolution of the Ottoman Empire"
 fpw_austria.40.d: "The Sultan has surrendered. Bosnia, Herzegovina and the Serbian lands now belong to the Empire. Bulgaria, Albania and Montenegro have been freed as Austrian clients. Greece, Armenia and our other allies have received their shares, and what remains of the Ottoman state is limited to Anatolia and Constantinople."
 fpw_austria.40.a: "The Danube is ours."
 fpw_austria.41.t: "Slay the Orthodox Giant"
 fpw_austria.41.d: "The Emperor has given the word. Our army is ready for the winter, Russia's borderlands are restless, and the peoples of the Caucasus have risen at our signal. Austria is at war with Russia."
 fpw_austria.41.a: "For the Emperor!"
 fpw_austria.42.t: "Russia Surrenders"
 fpw_austria.42.d: "The Tsar has asked for peace. Volhynia and Podolia are now part of the Empire, Ukraine has been freed under our protection, and the peoples of the Caucasus have their independence. Russia's ambitions in Europe are finished."
 fpw_austria.42.a: "The giant has fallen."

#trigger tooltips (Germanification)
 AUS_all_hungary_cored_tt: "Every §YHungarian§! state we own is an §YAustrian core§!."
 AUS_all_balkans_cored_tt: "Every §YBalkan§! state (Serbian, Bulgarian, Croatian, Bosnian, Greek, Albanian and Romanian cores) is an §YAustrian core§!."

#focus summary tooltips (first line of every Ottoman/Russia focus tooltip)
 AUS_toward_a_habsburg_europe_summary_tt: "§YA new Habsburg foreign policy.§!\nUnlocks three paths: rivalry with the §YOttoman Empire§!, containing §YRussia§!, and securing §YItaly§!."
 AUS_rivals_of_the_old_summary_tt: "§YWe turn on the Porte.§!\nWe embargo the §YOttoman Empire§! and relations worsen.\nUnlocks the path to the §YWar of Dissolution§!: Balkan uprisings, allies in Greece, Persia and Arabia, and finally war."
 AUS_gurantee_greece_summary_tt: "§YWe guarantee Greek independence.§!\nIf the Ottomans attack §YGreece§!, we will go to war to defend it. Greece will see us as a friend."
 AUS_relations_with_persia_summary_tt: "§YWe approach the Shah.§!\nWe sign a §Ynon-aggression pact§! with §YPersia§! and relations improve."
 AUS_deal_with_the_shah_summary_tt: "§YWe offer the Shah an alliance of convenience.§!\nPersia decides whether to fight alongside us against the Ottomans and Russia."
 AUS_influence_the_balkan_states_summary_tt: "§YWe stir up the Ottoman Balkans.§!\nUnlocks decisions to fund §Rprotests§! among the Bulgarians, Bosniaks, Albanians and Montenegrins and then launch Austrian-armed §Ruprisings§!, and to break §YSerbia§! and §YRomania§! away from the Porte."
 AUS_fund_greek_sepratists_summary_tt: "§YWe fund Greek separatists.§!\nUnlocks decisions to fund separatists in §YCrete§!, §YEpirus and Macedonia§! and the §YAegean islands§!, and then to start the §YGreek War of Liberation§!."
 AUS_instigate_armenian_resistance_summary_tt: "§YWe arm the Armenians.§!\nThe Armenian regions of the Ottoman Empire become hard to govern, and they will rise up when our war starts."
 AUS_make_a_deal_with_the_arabs_summary_tt: "§YWe make a deal with the House of Saud.§!\nWe send the Saudis rifles, and they will invade the Ottoman Empire from the south when our war starts."
 AUS_create_the_colition_summary_tt: "§YWe form the Habsburg Coalition.§!\nWe create our own faction if we have none, and invite the enemies of the Porte to join it."
 AUS_call_for_the_dissolution_of_the_ottoman_empire_summary_tt: "§RWe go to war with the Ottoman Empire.§!\nOur allies join us, and when the Sultan capitulates, a scripted peace partitions his empire."
 AUS_victory_against_the_ottomans_summary_tt: "§YThe Ottoman Empire has been dissolved.§!\nWe gain the §YHeir to the Porte§! national spirit, political power and army experience."
