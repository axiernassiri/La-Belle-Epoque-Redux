l_english:

# Focuses
 army_effort:0 "Army Effort"
 army_effort_desc:0 "Despite the increasing possibilities of aerial and naval warfare, ground combat is still key in tomorrow's wars. With preparation, we can avoid reliving the hell of the trenches."
 equipment_effort:0 "Equipment Effort"
 equipment_effort_desc:0 "The limits for what equipment can be carried by infantry are constantly being pushed. We will focus on giving our troops the best tools available."
 cavalry_effort:0 "Cavalry Effort"
 cavalry_effort_desc:0 "Cavalry Effort"
 logistics_effort:0 "Logistics Effort"
 logistics_effort_desc:0 "Logistics Effort"
 cavalry_effort_2:0 "Cavalry Effort II"
 cavalry_effort_2_desc:0 "Cavalry Effort II"
 doctrine_effort:0 "Doctrine Effort"
 doctrine_effort_desc:0 "The military doctrines that defined ground combat in the Great War are outdated. We must put our greatest minds to the task of shaping the military thought of tomorrow."
 equipment_effort_2:0 "Equipment Effort II"
 equipment_effort_2_desc:0 "We will continue our efforts to ensure our infantry and support troops are armed with the best possible equipment of our time."
 doctrine_effort_2:0 "Doctrine Effort II"
 doctrine_effort_2_desc:0 "The battlefield has changed not just in the interbellum years, but over the course of recent conflicts. We must continuously reevaluate our doctrines to reflect this."
 equipment_effort_3:0 "Equipment Effort III"
 equipment_effort_3_desc:0 "Instead of imitating or buying foreign equipment, we should aim to become world-leading in infantry weapons."
 special_forces:0 "Special Forces"
 special_forces_desc:0 "We have need of elite forces; mountain troops and paratroopers should be our priority."
 
 naval_effort:0 "Naval Effort"
 naval_effort_tt:0 "Not enough building slots for §YNaval Dockyards§!"
 naval_effort_desc:0 "The expansion of our navy should be our first priority. Assign all available resources to new Dockyards and research into light surface ships."
 flexible_navy:0 "Flexible Navy"
 flexible_navy_desc:0 "Reinventing naval warfare to account for the advances in submarine technology will allow us to strike efficiently against enemy convoys."
 large_navy:0 "Large Navy"
 large_navy_desc:0 "Adapting our naval doctrines to accommodate large ships and ensuring the safety of our trade convoys will teach us much about what sort of ships we need."
 submarine_effort:0 "Submarine Effort"
 submarine_effort_desc:0 "Submarine warfare is the most exciting naval development since the invention of the torpedo boat. We would do well to not just protect against submarines, but also use them against enemy shipping."
 cruiser_effort:0 "Cruiser Effort"
 cruiser_effort_desc:0 "Before making forays into advanced battleship research, the smaller cruisers are in need of replacement."
 destroyer_effort:0 "Destroyer Effort"
 destroyer_effort_desc:0 "Studying the design and strategic use of submarines, we have also learned how to counter those strategies. Destroyers will be crucial for this."
 capital_ships_effort:0 "Capital Ship Effort"
 capital_ships_effort_desc:0 "The nation with the most battleships will rule the oceans. Battleships and carriers represent the old and the new in naval superiority."

 industrial_effort:0 "Industrial Effort"
 industrial_effort_desc:0 "Focus all our political efforts on building up the civilian industry in a great leap forward."
 industrial_effort_2:0 "Industrial Effort II"
 industrial_effort_2_desc:0 "With iron will and a relentless work ethic, we can mobilize the people in another great industrial effort."
 construction_effort:0 "Construction Effort"
 construction_effort_tt:0 "Not enough building slots for §YCivilian Factories§!"
 construction_effort_desc:0 "Civilian industrial capacity must not be underestimated even when war looms over the world."
 production_effort:0 "Armament Effort"
 production_effort_tt:0 "Not enough building slots for §YMilitary Factory§!"
 production_effort_desc:0 "If you can build tractors, you can build tanks! We must not allow our military production capacity to lag behind."
 construction_effort_2:0 "Construction Effort II"
 construction_effort_2_desc:0 "Continuing to expand our factories will allow us to speed up production of goods for trade and further construction efforts."
 production_effort_2:0 "Armament Effort II"
 production_effort_2_desc:0 "Trying to adapt civilian factories to produce military equipment is inefficient. We should focus on preparing military production now."
 production_effort_3:0 "Armament Effort III"
 production_effort_3_desc:0 "Continued efforts to expand our military factories are necessary to meet the demands for new equipment."
 infrastructure_effort:0 "Infrastructure Effort"
 infrastructure_effort_desc:0 "A country without proper infrastructure cannot pursue advanced projects or constructions."
 infrastructure_effort_tt:0 "Not enough building slots for §YInfrastructure§!"
 infrastructure_effort_2:0 "Infrastructure Effort II"
 infrastructure_effort_2_desc:0 "Extending our infrastructure further will enable the transports and communications necessary for high-tech clandestine projects."
 construction_effort_3:0 "Construction Effort III"
 construction_effort_3_desc:0 "Expansion of our infrastructure network has significantly improved our capacity for construction."
 extra_tech_slot:0 "Extra Research Slot"
 extra_tech_slot_desc:0 "Our industrial expansion and other recent advances might allow us to conduct more R&D in parallel."
 extra_tech_slot_2:0 "Extra Research Slot II"
 extra_tech_slot_2_desc:0 "The rapid industrialization of our nation has opened up new opportunities in R&D that we should pursue."


 political_effort:0 "Political Effort"
 political_effort_desc:0 "To bring about change in the world, we need to be able to bring about change in our own country. Strengthening our political position should come first."
 support_the_landowners:0 "Support the Landowners"
 support_the_landowners_desc:0 "By supporting the landowners we can ensure stability in a fast changing world."
 crack_down_on_dissent:0 "Crack Down on Dissent"
 crack_down_on_dissent_desc:0 "Crack down on Dissent"
 appoint_conservative_bureaucrats:0 "Appoint Conservative Bureaucrats"
 appoint_conservative_bureaucrats_desc:0 "Appoint"
 defend_the_status_quo:0 "Defend the Status Quo"
 defend_the_status_quo_desc:0 "Defend the Status quo"
 absolute_monarchy:0 "Absolute Monarchy"
 absolute_monarchy_desc:0 "Absol"
 support_the_bourgeoisie:0 "Support the Bourgeoisie"
 support_the_bourgeoisie_desc:0 "Supporting the capitalists and industrialists would benefit our economy as we modernise our laws."
 privatize_agriculture:0 "Privatize Agriculture"
 privatize_the_industries:0 "Privatize the Industries"
 constitutional_reform:0 "Constitutional Reform"
 constitutional_reform_desc:0 "Constit"
 limited_democracy:0 "Limited Democracy"
 universal_suffrage:0 "Universal Suffrage"
 support_the_proletariat:0 "Support the Proletariat"
 support_the_proletariat_desc:0 "The working class has suffered for far too long. We must overthrow the conservative establishment to seize the means of production, adopting socialist policies."
 promote_class_struggle:0 "Promote Class Struggle"
 promote_class_struggle_desc:0 "Promote Class Struggle"
 seize_means_of_production:0 "Seize Means of Production"
 seize_means_of_production_desc:0 "Seize Means of Production"
 workers_associations:0 "Form Worker's Associations"
 workers_associations_desc:0 "Form Worker's Associations"
 vanguard_state:0 "Vanguard State"

 our_place_in_the_world:0 "Our Place in the World"
 our_place_in_the_world_desc:0 "The world is changing quickly. How should [ROOT.GetNameDef] protect itself from outside threats?"
 loyalty_to_the_leader_and_state:0 "Loyalty to the Leader and State"
 loyalty_to_the_leader_and_state_desc:0 "We shall remain loyal to the republic, the [ROOT.GetRulingParty], and of course [ROOT.GetLeader], as it wouldn't be possible without [ROOT.GetLeader.GetSheHe]."
 the_socialist_crusade:0 "The Socialist Crusade"
 the_socialist_crusade_desc:0 "We shall violate all the capitalist nations, as their evil views have no right to exist on this planet."
 home_of_the_revolution:0 "[ROOT.GetNonIdeologyName], Home of the Revolution"
 home_of_the_revolution_desc:0 "The [ROOT.GetAdjectiveCap] people have succeeded in overthrowing the tyrranical regime of the bourgeoisie, and shall now spread their influence to other nations."
 nuetrality:0 "Neutrality"
 nuetrality_desc:0 "The best way to keep ourself safe is to avoid foreign conflicts."
 create_defensive_militia:0 "Create Defensive Militia"
 create_defensive_militia_desc:0 "We will create the [ROOT.GetAdjectiveCap] Home Defence Militia to protect us from foreign invaders."
 imperialism:0 "Imperialism"
 imperialism_desc:0 "Forget peace, the [ROOT.GetAdjectiveCap]s shall conquer the world, working towards a [ROOT.GetAdjectiveCap] Empire."
 national_militarism:0 "[ROOT.GetAdjectiveCap] Militarism"
 national_militarism_desc:0 "Our soldiers shall be the greatest soldiers in the world, as they march from country to country, relentlessly killing those who oppose us."
 colonial_effort:0 "Colonial Effort"
 colonial_effort_desc:0 "While expansion on our own continent may be difficult, there is an entirely unexplored continent waiting to be devoured by us, Africa. We can easily conquer them and set up some colonies."
 manifest_destiny:0 "Manifest Destiny"
 manifest_destiny_desc:0 "The [ROOT.GetAdjectiveCap] Empire is growing stronger every day, and soon, we will be the greatest country the world has ever known."

 red_legion:0 "Red Legion"
 red_legion_desc:0 "Red Legion"
 international_cooperation:0 "International Cooperation"
 international_cooperation_desc:0 "International Cooperation"
 counter_intelligence_effort:0 "Counter-Intelligence"
 counter_intelligence_effort_desc:0 ""
 encourage_solidarity:0 "Encourage Solidarity"
 encourage_solidarity_desc:0 "Encourage Solidarity"
 economic_mobilisation:0 "Pre-emptive Mobilisation"
 economic_mobilisation_desc:0 "Economic Mobilisation"
 national_security:0 "National Security"
 national_security_desc:0 "National Security"
 colonial_development:0 "Colonial Development"
 colonial_development_desc:0 "Colonial Development"

 loyalty_to_the_confederation:0 "Loyalty to the Confederation"
 alliance_with_prussia:0 "Strengthen Ties with [PRS.GetNameDef]"
 alliance_with_prussia_desc:0 "It seems that we could benefit alot from improving relations with the [PRS.GetAdjectiveCap]s, not only because of their desire to unite Germany, but their strong military capabilities."
 alliance_with_austria:0 "Strengthen Ties with the [AUS.GetAdjectiveCap]s"
 alliance_with_austria_desc:0 "[AUS.GetNameDefCap] is the worthy leader of the German People, and it would only be logical to bow down to them."
 befriend_neighbouring_countries:0 "Befriend Neighbouring Member States"
 befriend_neighbouring_countries_desc:0 "We can befriend the neighbouring states that are in the German Confederation."
 aftermath_of_prussian_w:0 "Aftermath of the Brothers War"
 aftermath_of_prussian_w_completion_tt:0 "Auto-completed after a Prussian victory in the §YBrothers War§!"
 denounce_the_new_confederation:0 "Denounce the New Confederation"
 denounce_the_new_confederation_desc:0 "The North German Confederation is an illegitimate replacement to the original version, as it is merely a way for the Prussians to not seem like the 'bad guys'. We will refuse to join these tyrants, instead working with [FRA.GetLeader] to destroy them."
 alliance_with_france:0 "Alliance with France"
 alliance_with_france_desc:0 "[FRA.GetNameDefCap] has a rivalry with our enemies in [PRS.GetNameDef], so it would be very wise to seek an alliance with them."
 join_the_confederation:0 "Join the Confederation"
 join_the_confederation_desc:0 "Time has finally come to join the North German Confederation."
 confederation_trigger:0 "The §YNorth German Confederation§! exists"

